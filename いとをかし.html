-p12","だに","副助詞","①類推(〜さえ) ②最小限の限定(せめて〜だけでも)",null,"下に願望・意志・命令があれば「せめて〜だけでも」。打消があれば類推が多い。","光やあると見るに、蛍ばかりの光だになし","光があるかと見るが、蛍ほどの光さえない","竹取物語"),Ft("kg-p13","すら","副助詞","類推(〜さえ)",null,"極端な例を挙げて他を類推させる。中古和文では「だに」が優勢。"),Ft("kg-p14","さへ","副助詞","添加(〜までも)",null,"現代語の「さえ」(類推)とは意味が異なる。古文の類推は「だに・すら」。"),Ft("kg-p15","ばや","終助詞","自己の願望(〜たい)","未然形","未然形+ばや。「見ばや」=見たい。係助詞「は」+「や」との識別に注意。"),Ft("kg-p16","なむ","終助詞","他に対する願望・誂え(〜てほしい)","未然形","未然形接続が識別の決め手。係助詞「なむ」(種々の語に付く)・「ぬ+む」(連用形接続)と区別。"),Ft("kg-p17","もがな","終助詞","願望(〜があればなあ・〜であればなあ)",null,"存在しないものを望む。「心あらむ友もがな」(徒然草)。","心あらむ友もがな","情趣を解する友がいたらなあ","徒然草"),Ft("kg-p18","な〜そ","終助詞","禁止(〜してくれるな)。「な+連用形+そ」(カ変・サ変は未然形)","連用形(カ変・サ変は未然形)","副詞「な」と終助詞「そ」で挟む柔らかい禁止。文末の終助詞「な」単独の禁止(終止形+な)と区別。","「や、な起こしたてまつりそ」","「おい、お起こし申し上げるな」","宇治拾遺物語(児のそら寝)"),dl({id:"kg-k01",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"classification",category:"敬語",term:"敬語の三分類",meaning:"尊敬語・謙譲語・丁寧語の枠組み",qr:"古文の敬語の三分類を挙げ、それぞれ「誰への敬意」を表すか答えよ。",ar:"尊敬語=動作をする人(動作主)への敬意/謙譲語=動作を受ける人への敬意/丁寧語=聞き手(読み手)への敬意。",qc:"謙譲語が表す敬意の対象として正しいものを選べ。",choices:["動作を受ける人","動作をする人","聞き手・読み手","話し手自身"],expl:"「誰から」は地の文=作者から、会話文=話し手から。"}),dl({id:"kg-k02",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"direction",category:"敬語",term:"敬意の方向",meaning:"敬意の出どころと対象の判定",qr:"地の文と会話文とで、敬意の「出どころ(誰からの敬意か)」はどう異なるか。",ar:"地の文では作者からの敬意、会話文では話し手からの敬意となる。",qc:"会話文中の敬語が表す敬意の出どころとして正しいものを選べ。",choices:["その会話の話し手から","作者から","聞き手から","動作主から"],expl:"源氏物語冒頭「候ひ給ひける」=候ひ(謙譲:作者→帝)+給ひ(尊敬:作者→女御・更衣)の二方面敬語が典型例。",example:"女御、更衣あまた候ひ給ひける中に",translation:"女御や更衣が大勢お仕え申し上げなさっていた中に",source:"源氏物語(桐壺)"}),dl({id:"kg-k03",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"classification",category:"敬語",term:"給ふ(四段/下二段)",meaning:"四段=尊敬/下二段=謙譲(丁重)",qr:"「給ふ」には四段活用と下二段活用がある。それぞれの敬語の種類と用法を答えよ。",ar:"四段「給ふ」=尊敬の補助動詞(お〜になる)。下二段「給ふ」=謙譲(丁重)の補助動詞で、会話文中で「思ふ・見る・聞く・知る」などに付く(〜ております)。",qc:"下二段活用の「給ふ」の説明として正しいものを選べ。",choices:["会話文中で「思ふ・見る・聞く」等に付く謙譲(丁重)の補助動詞","地の文で用いる尊敬の補助動詞","「与える」意の本動詞","丁寧の本動詞"],expl:"「給へ」の形が已然形(四段)か未然・連用形(下二段)かの識別も頻出。"}),Za("kg-k04","おはす・おはします","尊敬語","いらっしゃる(あり・行く・来の尊敬)。補助動詞「〜ていらっしゃる」も","「おはします」の方がより高い敬意。"),Za("kg-k05","のたまふ・仰す","尊敬語","おっしゃる(言ふの尊敬)","「のたまはす」はさらに高い敬意。"),Za("kg-k06","思す・思し召す","尊敬語","お思いになる(思ふの尊敬)","「思し召す」の方がより高い敬意。"),Za("kg-k07","御覧ず","尊敬語","ご覧になる(見るの尊敬)"),Za("kg-k08","大殿籠る","尊敬語","お休みになる(寝の尊敬)"),dl({id:"kg-k09",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"classification",category:"敬語",term:"奏す・啓す",meaning:"【謙譲語(絶対敬語)】申し上げる",qr:"「奏す」「啓す」はそれぞれ誰に申し上げる場合にのみ用いる敬語か。",ar:"奏す=天皇・上皇に申し上げる/啓す=中宮(皇后)・東宮(皇太子)に申し上げる。相手が固定された絶対敬語。",qc:"「奏す」の説明として正しいものを選べ。",choices:["天皇・上皇に申し上げる(絶対敬語)","中宮・東宮に申し上げる(絶対敬語)","誰にでも使える「申し上げる」","「お聞きになる」の尊敬語"],expl:"会話の相手が本文に明示されなくても、奏す・啓すがあれば相手の身分が確定する。"}),Za("kg-k10","聞こゆ・申す","謙譲語","申し上げる(言ふの謙譲)。補助動詞「お〜申し上げる」も","「聞こゆ」には「聞こえる・評判になる」の一般動詞の用法もあるので文脈判断。"),dl({id:"kg-k11",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"classification",category:"敬語",term:"奉る・参る",meaning:"謙譲が基本だが尊敬用法あり",qr:"「奉る」「参る」の敬語の種類と、注意すべき例外的用法を答えよ。",ar:"基本は謙譲語(奉る=差し上げる・お〜申し上げる/参る=参上する・差し上げる)。ただし「奉る」=お召しになる・お乗りになる、「参る」=召し上がる、の尊敬用法がある。",qc:"「御格子参る」「壺なる御薬奉れ」等に見られる例外用法の説明として正しいものを選べ。",choices:["「奉る・参る」には尊敬(召し上がる・お召しになる等)の用法がある","「奉る・参る」は常に謙譲語である","「奉る・参る」は丁寧語である","「奉る・参る」は自敬表現専用である"],expl:"衣食住(着る・食ふ・乗る)に関わる文脈では尊敬用法を疑う。"}),dl({id:"kg-k12",subject:"kobun",type:"grammar",topic_type:"keigo",aspect:"classification",category:"敬語",term:"侍り・候ふ",meaning:"丁寧語/謙譲語の両用",qr:"「侍り」「候ふ」の敬語の種類を2つ挙げ、それぞれの意味を答えよ。",ar:"①丁寧語=あります・おります・〜ます(補助動詞) ②謙譲語=(貴人のおそばに)お仕えする・お控えする。",qc:"「侍り・候ふ」の説明として正しいものを選べ。",choices:["丁寧語(〜ます)と謙譲語(お仕えする)の両方の用法がある","常に尊敬語である","丁寧語の用法しかない","謙譲語の用法しかない"],expl:"源氏物語冒頭「候ひ給ひける」の「候ひ」は謙譲(お仕えする)。丁寧と即断しない。"}),dl({id:"kg-s01",subject:"kobun",type:"grammar",topic_type:"shikibetsu",aspect:"identification",category:"識別",term:"「なむ」の識別",meaning:"係助詞/終助詞/ナ変未然+む/完了ぬ未然+む",qr:"「花咲かなむ」の「なむ」を文法的に説明せよ。",ar:"未然形「咲か」に接続しているので、他への願望(誂え)の終助詞「なむ」(咲いてほしい)。",qc:"「花咲かなむ」の「なむ」の説明として正しいものを選べ。",choices:["未然形接続の終助詞(〜てほしい)","強意の係助詞(結びは連体形)","ナ変動詞の未然形活用語尾+推量「む」","完了「ぬ」の未然形+推量「む」"],expl:"①未然形+なむ=終助詞 ②連用形+なむ=完了ぬ /* ============================================================
   いとをかし — 硝子雅 (Glass & Elegance) Design System
   iOS26 Liquid Glass 的マテリアル + 雅な和文タイポグラフィ
   ============================================================ */

:root{
  --font-display:"Shippori Mincho B1","Yuji Syuku","Noto Serif JP",serif;
  --font-serif-classic:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:"Zen Kaku Gothic New","Inter","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"JetBrains Mono","Menlo","Consolas",monospace;

  /* motion & shape tokens */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-glass:cubic-bezier(.22,1,.36,1);
  --radius-glass:22px;
}

:root[data-theme=dark]{
  --bg-base:#17121a;
  --bg-soft:#1f1822;
  --bg-card:#251c28;
  --bg-card-hover:#2c2130;
  --text-main:#f0e7ec;
  --text-muted:#a8949f;
  --text-faint:#6e5b66;
  --kobun:#f29cb6;
  --kobun-soft:#f29cb624;
  --kobun-border:#f29cb64d;
  --kanbun:#f0a35e;
  --kanbun-soft:#f0a35e24;
  --kanbun-border:#f0a35e4d;
  --border-thin:#f0dce617;
  --nav-glass:#251c28cc;
  --shadow-card:0 4px 24px #00000059;
  --ok:#8fd6a8;
  --ng:#ef8f9d;
  --watermark:#f0dce60b;

  /* liquid glass layer tokens */
  --glass-fill:color-mix(in srgb, var(--bg-card) 62%, transparent);
  --glass-fill-strong:color-mix(in srgb, var(--bg-card) 80%, transparent);
  --glass-border:color-mix(in srgb, #ffffff 14%, transparent);
  --glass-highlight:rgba(255,255,255,.16);
  --glass-shadow:0 24px 70px -20px rgba(0,0,0,.65),0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);
  --nav-shadow:0 20px 50px -14px rgba(0,0,0,.6),0 2px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);
  --blob-a:#f29cb6;
  --blob-b:#f0a35e;
  --blob-c:#584a7c;
  --grain-opacity:.05;
}

:root[data-theme=light]{
  --bg-base:#f6f0e6;
  --bg-soft:#f0e8db;
  --bg-card:#fbf7ef;
  --bg-card-hover:#f4ecdf;
  --text-main:#3a2a33;
  --text-muted:#82707a;
  --text-faint:#b3a3ac;
  --kobun:#d9536f;
  --kobun-soft:#d9536f1a;
  --kobun-border:#d9536f52;
  --kanbun:#cd6f21;
  --kanbun-soft:#cd6f211a;
  --kanbun-border:#cd6f2152;
  --border-thin:#3c28321f;
  --nav-glass:#fbf7efd9;
  --shadow-card:0 4px 20px #5a3c3c1a;
  --ok:#2e9e5b;
  --ng:#d14f63;
  --watermark:#3c28320d;

  /* liquid glass layer tokens */
  --glass-fill:color-mix(in srgb, var(--bg-card) 68%, transparent);
  --glass-fill-strong:color-mix(in srgb, var(--bg-card) 86%, transparent);
  --glass-border:color-mix(in srgb, #3c2832 10%, transparent);
  --glass-highlight:rgba(255,255,255,.85);
  --glass-shadow:0 20px 50px -18px rgba(60,40,50,.25),0 2px 8px rgba(60,40,50,.1),inset 0 1px 0 rgba(255,255,255,.7);
  --nav-shadow:0 16px 40px -14px rgba(60,40,50,.28),0 2px 10px rgba(60,40,50,.12),inset 0 1px 0 rgba(255,255,255,.9);
  --blob-a:#d9536f;
  --blob-b:#cd6f21;
  --blob-c:#d8bd85;
  --grain-opacity:.035;
}

/* ---------- base & atmosphere ---------- */

html,body{
  background:var(--bg-base);
  color:var(--text-main);
  font-family:var(--font-ui);
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
}

/* soft drifting light behind everything, so the glass has something to catch */
body::before{
  content:"";
  position:fixed;
  inset:-10%;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(ellipse 65% 50% at 8% 4%, color-mix(in srgb, var(--blob-a) 30%, transparent) 0%, color-mix(in srgb, var(--blob-a) 10%, transparent) 40%, transparent 72%),
    radial-gradient(ellipse 60% 54% at 96% 14%, color-mix(in srgb, var(--blob-b) 27%, transparent) 0%, color-mix(in srgb, var(--blob-b) 9%, transparent) 40%, transparent 72%),
    radial-gradient(ellipse 75% 60% at 50% 108%, color-mix(in srgb, var(--blob-c) 24%, transparent) 0%, color-mix(in srgb, var(--blob-c) 8%, transparent) 40%, transparent 76%);
  animation:iw-drift 55s var(--ease-glass) infinite alternate;
}

/* faint washi-paper grain for tactile depth */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:var(--grain-opacity);
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22180%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.85%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22/%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22/%3E%3C/filter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%2523n%29%22/%3E%3C/svg%3E");
}

@keyframes iw-drift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-2%,2%) scale(1.06)}
  100%{transform:translate(2%,-1%) scale(1)}
}

@media (prefers-reduced-motion: reduce){
  body::before{animation:none}
}

/* ---------- typography roles ---------- */

.font-display{font-family:var(--font-display);letter-spacing:.02em}
.font-classic{font-family:var(--font-serif-classic);letter-spacing:.01em;line-height:1.9;font-feature-settings:"palt" 1}
.font-mono-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- glass cards ---------- */

.iw-card{
  background:var(--glass-fill);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  border-radius:var(--radius-glass);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px) saturate(130%);
  -webkit-backdrop-filter:blur(10px) saturate(130%);
}
.iw-card.accent-kobun{border-color:color-mix(in srgb, var(--kobun) 38%, var(--glass-border))}
.iw-card.accent-kanbun{border-color:color-mix(in srgb, var(--kanbun) 38%, var(--glass-border))}
.iw-card.accent-kobun::after,
.iw-card.accent-kanbun::after{
  content:"";
  position:absolute;
  top:0;left:18px;right:18px;height:2px;border-radius:2px;
  opacity:.75;
  pointer-events:none;
}
.iw-card.accent-kobun::after{background:linear-gradient(90deg,transparent,var(--kobun),transparent)}
.iw-card.accent-kanbun::after{background:linear-gradient(90deg,transparent,var(--kanbun),transparent)}

.watermark{
  font-family:var(--font-display);
  color:var(--watermark);
  pointer-events:none;
  -webkit-user-select:none;
  user-select:none;
  font-size:7.5rem;
  line-height:1;
  position:absolute;
  bottom:-30px;
  right:-6px;
}

/* ---------- floating capsule nav ---------- */

.capsule-nav{
  z-index:50;
  background:var(--nav-glass);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-border);
  border-radius:999px;
  gap:2px;
  padding:6px;
  display:flex;
  position:fixed;
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  left:14px;
  right:14px;
  max-width:640px;
  margin-inline:auto;
  box-shadow:var(--nav-shadow);
}

.capsule-tab{
  min-width:0;
  flex:1;
  min-height:48px;
  color:var(--text-muted);
  cursor:pointer;
  border:1px solid #0000;
  border-radius:999px;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:2px;
  padding:5px 6px;
  font-size:10px;
  font-weight:600;
  transition:background .25s var(--ease-glass),color .25s var(--ease-glass),transform .4s var(--ease-spring),box-shadow .4s var(--ease-spring);
  display:flex;
}
.capsule-tab .tab-icon{
  width:21px;
  height:21px;
  font-size:0;
  background-color:currentColor;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
  transition:filter .3s var(--ease-glass);
}
/* ホーム — 鳥居 */
.capsule-nav .capsule-tab:nth-child(1) .tab-icon{
  -webkit-mask-image:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%20%3Cpath%20d%3D%22M3%206.2%20Q12%203.6%2021%206.2%22/%3E%20%3Cpath%20d%3D%22M5%209.2%20H19%22/%3E%20%3Cpath%20d%3D%22M7.3%207.6%20V20.5%22/%3E%20%3Cpath%20d%3D%22M16.7%207.6%20V20.5%22/%3E%20%3C/svg%3E");
  mask-image:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%20%3Cpath%20d%3D%22M3%206.2%20Q12%203.6%2021%206.2%22/%3E%20%3Cpath%20d%3D%22M5%209.2%20H19%22/%3E%20%3Cpath%20d%3D%22M7.3%207.6%20V20.5%22/%3E%20%3Cpath%20d%3D%22M16.7%207.6%20V20.5%22/%3E%20%3C/svg%3E");
}

.capsule-tab:hover:not(.active){
  background:color-mix(in srgb, var(--text-main) 8%, transparent);
  color:var(--text-main);
}
.capsule-tab.active{
  color:var(--text-main);
  background:linear-gradient(135deg,var(--kobun-soft),var(--kanbun-soft));
  border-color:var(--glass-border);
  transform:translateY(-2px) scale(1.06);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.3),
    inset 0 -2px 6px #00000024,
    0 6px 16px -6px color-mix(in srgb, var(--kobun) 45%, transparent);
}
.capsule-tab.active .tab-icon{
  filter:drop-shadow(0 0 6px color-mix(in srgb, var(--kobun) 55%, transparent));
}
@media(min-width:768px){
  .capsule-tab{flex-direction:row;gap:7px;padding:8px 16px;font-size:13px}
}

/* ---------- reference list rows ---------- */

.ref-card{
  cursor:pointer;
  position:relative;
  transition:background .25s var(--ease-glass);
}
.ref-card:hover{background:var(--bg-card-hover)}
.ref-card::before{
  content:"";
  position:absolute;
  left:0;top:8px;bottom:8px;width:0;border-radius:2px;
  background:linear-gradient(180deg,var(--kobun),var(--kanbun));
  opacity:0;
  transition:width .25s var(--ease-glass),opacity .25s var(--ease-glass);
  pointer-events:none;
}
.ref-card:hover::before{width:3px;opacity:.85}
.ref-detail{
  grid-template-rows:0fr;
  transition:grid-template-rows .32s var(--ease-glass);
  display:grid;
}
.ref-detail.open{grid-template-rows:1fr}
.ref-detail>div{overflow:hidden}

/* ---------- glass buttons ---------- */

.iw-btn{
  border:1px solid var(--glass-border);
  background:var(--glass-fill-strong);
  min-height:44px;
  color:var(--text-main);
  cursor:pointer;
  border-radius:14px;
  justify-content:center;
  align-items:center;
  padding:10px 18px;
  font-size:14px;
  font-weight:600;
  transition:background .18s var(--ease-glass),transform .3s var(--ease-spring),box-shadow .3s var(--ease-spring);
  display:inline-flex;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.iw-btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-120%);
  transition:transform .6s ease;
  pointer-events:none;
}
.iw-btn:hover{background:var(--bg-card-hover);transform:translateY(-1px)}
.iw-btn:hover::after{transform:translateX(120%)}
.iw-btn:active{transform:translateY(0)}
.iw-btn.primary{
  background:linear-gradient(135deg,var(--kobun),var(--kanbun));
  color:#fff;
  border:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px color-mix(in srgb, var(--kobun) 55%, transparent);
}
.iw-btn:focus-visible{
  outline:2px solid var(--kobun);
  outline-offset:2px;
  box-shadow:0 0 0 5px color-mix(in srgb, var(--kobun) 22%, transparent);
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .iw-card,.capsule-nav{background:var(--bg-card)}
}

/* ---------- accordions ---------- */

.acc-body{
  grid-template-rows:0fr;
  transition:grid-template-rows .3s var(--ease-glass);
  display:grid;
}
.acc-body.open{grid-template-rows:1fr}
.acc-body>div{overflow:hidden}

/* ---------- scrollbar ---------- */

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--text-faint);border-radius:4px}
::-webkit-scrollbar-track{background:0 0}
