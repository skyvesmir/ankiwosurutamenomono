<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>英語例文暗唱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --nv:#1B2744;--nvl:#2A3E73;--gd:#C8981A;--gdl:#E8C84A;
  --cr:#F0EDE5;--wh:#FFFFFF;
  --ok:#1E7244;--ok2:#E6F4EE;
  --ng:#B92626;--ng2:#FEECEC;
  --tx:#1C2536;--tx2:#6B7280;
  --br:#DDD8CE;--sh:0 2px 16px rgba(26,39,68,.09);
  --r:14px;--nh:62px;--mw:540px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;-webkit-tap-highlight-color:transparent;}
body{min-height:100%;background:var(--cr);color:var(--tx);
  font-family:'Noto Sans JP',-apple-system,sans-serif;font-size:15px;line-height:1.6;
  padding-bottom:var(--nh);}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input,textarea{font:inherit;color:inherit;}
a{text-decoration:none;}
#app{min-height:calc(100vh - var(--nh));}
.con{max-width:var(--mw);margin:0 auto;padding:0 16px;}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.fw{width:100%;}

/* ── PAGE ── */
.page{min-height:calc(100vh - var(--nh));}
.ph{background:var(--nv);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;}
.ph-row{display:flex;align-items:center;gap:10px;}
.page-title{font-size:18px;font-weight:700;margin:0;}
.app-title{font-size:22px;font-weight:800;}
.app-sub{color:rgba(255,255,255,.7);font-size:13px;margin-top:2px;}
.pc{padding:16px;}

/* ── NAV ── */
#mnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:var(--wh);
  border-top:1px solid var(--br);display:flex;align-items:stretch;z-index:100;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--tx2);font-size:11px;font-weight:500;padding:4px 0;transition:color .15s;}
.nb.active{color:var(--nv);}
.ni{font-size:21px;line-height:1;}

/* ── BUTTONS ── */
.bp{display:block;width:100%;padding:13px 20px;background:var(--nv);color:#fff;
  border-radius:10px;font-weight:700;font-size:15px;text-align:center;transition:opacity .15s;}
.bp:hover{opacity:.9;}.bp:disabled{opacity:.4;cursor:default;}
.bs{display:block;width:100%;padding:12px 20px;background:#fff;color:var(--nv);
  border-radius:10px;font-weight:600;font-size:15px;text-align:center;
  border:2px solid var(--nv);transition:background .15s;}
.bs:hover{background:var(--cr);}
.bd{padding:10px 18px;background:var(--ng);color:#fff;border-radius:8px;font-weight:600;font-size:14px;}
.bl{color:var(--nv);font-size:14px;font-weight:600;text-align:center;display:block;margin:12px 0;padding:4px;}
.bsm{padding:8px 16px;background:var(--nv);color:#fff;border-radius:8px;font-weight:600;font-size:14px;}
.back{color:#fff;font-size:20px;padding:2px 6px;font-weight:700;line-height:1;}

/* ── HOME ── */
.rc{padding:20px;margin-bottom:16px;background:var(--nv);color:#fff;cursor:pointer;}
.rc-main{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.rc-n{font-size:52px;font-weight:800;color:var(--gdl);line-height:1;}
.rc-l{font-size:20px;font-weight:600;}
.rc-sub{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:12px;}
.rc-btn{background:var(--gd);color:var(--nv);padding:12px 20px;border-radius:8px;
  font-weight:700;font-size:15px;text-align:center;}
.rc-done{background:rgba(255,255,255,.15);color:#fff;padding:10px 20px;
  border-radius:8px;font-size:14px;text-align:center;}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.sb{background:#fff;border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:var(--sh);}
.sv{font-size:28px;font-weight:800;color:var(--nv);}
.sl{font-size:12px;color:var(--tx2);margin-top:2px;}
.stl{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.05em;}
.ri{display:flex;align-items:center;padding:14px 16px;margin-bottom:8px;cursor:pointer;}
.ri-m{flex:1;}.ri-n{font-weight:700;font-size:15px;}
.ri-i{font-size:13px;color:var(--tx2);margin-top:2px;}
.ri-a{color:var(--tx2);font-size:22px;}
.badge{background:var(--ng);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;}
.gbadge{color:var(--ok);font-size:12px;font-weight:700;}

/* ── DECKS ── */
.di{display:flex;align-items:center;padding:14px 16px;margin-bottom:8px;cursor:pointer;}
.di.sp{background:linear-gradient(135deg,var(--nv),var(--nvl));color:#fff;}
.di.sp .di-i{color:rgba(255,255,255,.7);}
.di.sp .di-a{color:rgba(255,255,255,.5);}
.di-m{flex:1;}.di-n{font-weight:700;font-size:15px;}
.di-i{font-size:13px;color:var(--tx2);margin-top:2px;}
.di-a{color:var(--tx2);font-size:22px;}

/* ── MODE SELECT ── */
.ms-p{font-size:14px;color:var(--tx2);text-align:center;margin:20px 0 14px;}
.mc-grid{display:grid;gap:12px;}
.mc{padding:22px 20px;cursor:pointer;text-align:center;transition:transform .12s;border-radius:var(--r);}
.mc:hover{transform:translateY(-2px);}
.mc-icon{font-size:38px;margin-bottom:8px;}
.mc-name{font-size:17px;font-weight:700;color:var(--nv);margin-bottom:4px;}
.mc-desc{font-size:13px;color:var(--tx2);}

/* ── STUDY PAGE ── */
.sp2{min-height:100vh;background:var(--cr);display:flex;flex-direction:column;}
.sh2{background:var(--nv);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.pi{flex:1;}
.pb{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-bottom:4px;}
.pf{height:100%;background:var(--gdl);border-radius:2px;transition:width .3s;}
.pt{font-size:12px;color:rgba(255,255,255,.7);text-align:right;}
.mb2{font-size:22px;}
.sb2{flex:1;padding:16px;max-width:var(--mw);margin:0 auto;width:100%;}

/* ── FLASHCARD ── */
.fcc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px;margin-bottom:16px;}
.fca{overflow-y:auto;max-height:calc(100vh - 130px);}
.cl{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:10px;}
.en{font-family:'Noto Serif',Georgia,serif;font-size:20px;line-height:1.65;
  color:var(--nv);font-weight:600;margin-bottom:16px;}
.hint{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:16px;font-style:italic;}
.dv{height:1px;background:var(--br);margin:16px 0;}
.ja{font-size:16px;line-height:1.8;color:var(--tx);margin-bottom:8px;padding:14px;
  background:var(--cr);border-radius:10px;}
.gs{margin:8px 0 12px;}
.gl{text-align:center;color:var(--tx2);font-size:13px;padding:10px;}
.nb2{list-style:none;padding:0;}
.nb2 li{font-size:13px;color:var(--tx);padding:5px 0 5px 14px;
  border-left:3px solid var(--gd);margin-bottom:5px;line-height:1.5;}
.nt{font-size:13px;font-weight:700;color:var(--nv);margin-bottom:6px;}
.nblk{margin-bottom:14px;}
.g-lbl{font-size:13px;color:var(--tx2);text-align:center;margin:16px 0 10px;font-weight:600;}
.gbts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.gbt{padding:10px 4px;border-radius:9px;font-size:12px;font-weight:700;text-align:center;
  cursor:pointer;border:2px solid;line-height:1.3;}
.g0{border-color:var(--ng);color:var(--ng);background:var(--ng2);}
.g1{border-color:#D4820A;color:#D4820A;background:#FEF5EC;}
.g2{border-color:var(--ok);color:var(--ok);background:var(--ok2);}
.g3{border-color:#2671B5;color:#2671B5;background:#EBF5FB;}

/* ── WORD ORDER ── */
.woc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px;}
.mt{background:var(--nv);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;
  font-weight:700;vertical-align:middle;margin-left:6px;}
.jab{background:var(--cr);border-radius:10px;padding:14px;margin:12px 0;
  font-size:16px;line-height:1.75;}
.albl{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:6px;}
.aa{min-height:54px;background:#F8F5EF;border:2px dashed var(--br);
  border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;margin-bottom:12px;}
.ap{color:var(--tx2);font-size:13px;font-style:italic;}
.wb{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.ch{padding:7px 14px;border-radius:20px;font-family:'Noto Serif',Georgia,serif;
  font-size:14px;cursor:pointer;transition:all .12s;user-select:none;white-space:nowrap;}
.ch.av{background:#fff;border:2px solid var(--br);color:var(--tx);}
.ch.av:hover{border-color:var(--nv);background:var(--cr);}
.ch.sl{background:var(--nv);color:#fff;border:2px solid var(--nv);}
.ch.sl:hover{background:var(--nvl);}
.woa{display:flex;gap:10px;}
.woa .bs{width:auto;flex:1;font-size:14px;padding:11px 16px;}
.woa .bp{width:auto;flex:2;font-size:14px;padding:11px 16px;}

/* ── WRITING ── */
.wrc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px;}
.wrl{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:8px;}
.wri{width:100%;padding:12px 14px;border:2px solid var(--br);border-radius:10px;
  font-size:15px;font-family:'Noto Serif',Georgia,serif;resize:none;outline:none;
  background:#FAFAF8;transition:border-color .2s;line-height:1.6;}
.wri:focus{border-color:var(--nv);background:#fff;}

/* ── RESULT ── */
.rko{background:var(--ok2);color:var(--ok);border-radius:10px;padding:12px 16px;
  font-size:16px;font-weight:700;text-align:center;margin:12px 0;}
.rng{background:var(--ng2);color:var(--ng);border-radius:10px;padding:12px 16px;
  font-size:16px;font-weight:700;text-align:center;margin:12px 0;}
.ca{margin-bottom:12px;}
.cal{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:6px;}
.cat{font-family:'Noto Serif',Georgia,serif;font-size:15px;color:var(--nv);font-weight:600;
  background:var(--cr);padding:10px 14px;border-radius:8px;border-left:3px solid var(--gd);}
.eg{background:var(--cr);border-radius:10px;padding:14px;margin:10px 0;}
.egl{font-size:13px;font-weight:700;color:var(--nv);margin-bottom:8px;}

/* ── SESSION END ── */
.ep{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cr);}
.ec{background:#fff;border-radius:var(--r);padding:32px 24px;max-width:380px;
  width:calc(100% - 32px);text-align:center;box-shadow:var(--sh);}
.etr{font-size:60px;margin-bottom:12px;}
.etl{font-size:22px;font-weight:800;color:var(--nv);margin-bottom:20px;}
.ests{display:flex;justify-content:center;gap:24px;margin-bottom:28px;}
.est{display:flex;flex-direction:column;align-items:center;}
.esv{font-size:30px;font-weight:800;color:var(--nv);}
.esl{font-size:12px;color:var(--tx2);margin-top:2px;}

/* ── STATS ── */
.sr4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.sbox{background:#fff;border-radius:var(--r);padding:14px 6px;text-align:center;box-shadow:var(--sh);}
.sv2{font-size:20px;font-weight:800;color:var(--nv);}
.sl2{font-size:10px;color:var(--tx2);margin-top:2px;}
.ctl{font-size:14px;font-weight:700;color:var(--tx2);padding:16px 16px 10px;}
.bch{display:flex;align-items:flex-end;gap:5px;padding:0 16px 16px;height:110px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;}
.bf{width:100%;background:var(--nv);border-radius:3px 3px 0 0;min-height:2px;}
.bn{font-size:10px;color:var(--tx);font-weight:600;min-height:13px;}
.bdy{font-size:10px;color:var(--tx2);}
.pr{display:flex;align-items:center;gap:10px;padding:5px 16px;}
.prn{font-size:11px;font-weight:600;color:var(--tx2);width:24px;flex-shrink:0;}
.prb{flex:1;height:6px;background:var(--br);border-radius:3px;}
.prf{height:100%;background:var(--gd);border-radius:3px;}
.prp{font-size:11px;color:var(--tx2);width:34px;text-align:right;}

/* ── SETTINGS ── */
.setc{padding:20px;}
.stt{font-size:16px;font-weight:700;color:var(--nv);margin-bottom:6px;}
.std{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:12px;}
.retry-banner{background:var(--ng2);color:var(--ng);text-align:center;
  padding:8px 16px;font-size:13px;font-weight:700;letter-spacing:.02em;}
/* ── ANIM ── */
@keyframes fdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pc{animation:fdIn .22s ease;}
.sb2{animation:fdIn .18s ease;}
</style>
</head>
<body>
<div id="app"></div>
<nav id="mnav">
  <button class="nb active" data-p="home" onclick="nav('home')">
    <span class="ni">🏠</span><span>ホーム</span>
  </button>
  <button class="nb" data-p="decks" onclick="nav('decks')">
    <span class="ni">📚</span><span>デッキ</span>
  </button>
  <button class="nb" data-p="stats" onclick="nav('stats')">
    <span class="ni">📊</span><span>記録</span>
  </button>
  <button class="nb" data-p="settings" onclick="nav('settings')">
    <span class="ni">⚙️</span><span>設定</span>
  </button>
</nav>
<script>
const DB=[["L1-1", "LESSON 1", "①", "I go jogging in a nearby park every morning to stay healthy.", "健康を維持するために、毎朝近くの公園にジョギングに行きます。"], ["L1-2", "LESSON 1", "②", "I'm looking for a book about current American politics.", "現在のアメリカ政治に関する本を探しています。"], ["L1-3", "LESSON 1", "③", "I learned about the life of President Kennedy in history class last week.", "先週の歴史の授業で、ケネディ大統領の生涯について学びました。"], ["L1-4", "LESSON 1", "④", "I have already decided what I want to do in the future.", "将来やりたいことはもう決めています。"], ["L1-5", "LESSON 1", "⑤", "I have never thought about living in a foreign country.", "外国に住むことを考えたことは一度もありません。"], ["L1-6", "LESSON 1", "⑥", "I've had a keen interest in social studies since I was an elementary school student.", "小学生の頃から社会科にとても興味があります。"], ["L1-7", "LESSON 1", "⑦", "I'm sure it will be challenging to study abroad.", "留学はきっと大変だと思います。"], ["L1-8", "LESSON 1", "⑧", "I'm going to study international relations in college.", "大学で国際関係学を勉強するつもりです。"], ["L2-1", "LESSON 2", "①", "It is natural for you to be excited about the concert next week.", "来週のコンサートにわくわくするのは当然です。"], ["L2-2", "LESSON 2", "②", "My plan for the weekend is to play shogi on my computer.", "週末の予定は、コンピュータで将棋をすることです。"], ["L2-3", "LESSON 2", "③", "Planning a vacation with my family can be lots of fun.", "家族で休暇の計画を立てることは、とても楽しいです。"], ["L2-4", "LESSON 2", "④", "I'm looking forward to watching the tennis match on TV tomorrow.", "明日のテニスの試合をテレビで見るのを楽しみにしています。"], ["L2-5", "LESSON 2", "⑤", "It's up to you to decide which subject to study at home.", "家でどの教科を勉強するかはあなたが決めることです。"], ["L2-6", "LESSON 2", "⑥", "His decision to keep regular hours should lead to a healthier life.", "規則正しい生活を送るという彼の決断は、より健康的な生活につながるはずです。"], ["L2-7", "LESSON 2", "⑦", "The problem is that there isn't enough space in the room for this sofa.", "問題は、この部屋にこのソファを置くのに十分なスペースがないということです。"], ["L2-8", "LESSON 2", "⑧", "I'm not sure whether I should cook supper or order a pizza tonight.", "今夜、夕食を自分で作るべきか、ピザを注文すべきか迷っています。"], ["L3-1", "LESSON 3", "①", "We can use the computer room during our lunch break.", "お昼休みにコンピュータ室を使うことができます。"], ["L3-2", "LESSON 3", "②", "The final exam for our English class may be very difficult.", "英語の期末試験はとても難しいかもしれません。"], ["L3-3", "LESSON 3", "③", "We must wear our school uniform on the school trip.", "修学旅行では制服を着なければなりません。"], ["L3-4", "LESSON 3", "④", "The club meeting should be on Friday, but it might be postponed.", "部活の会議は金曜日になるはずですが、延期されるかもしれません。"], ["L3-5", "LESSON 3", "⑤", "Ms. Kelly has gone to the teachers' room, but she will be back soon.", "ケリー先生は職員室に行っていますが、もうすぐ戻ってくるでしょう。"], ["L3-6", "LESSON 3", "⑥", "Kenta would be the right person for our class representative.", "健太がクラス委員として最適な人物でしょう。"], ["L3-7", "LESSON 3", "⑦", "Though she is not good at math, she got a high score on the test. She must have studied hard.", "彼女は数学が得意ではないのに、テストで高得点を取りました。一生懸命勉強したに違いありません。"], ["L3-8", "LESSON 3", "⑧", "I fell asleep during class. I should have gone to bed earlier last night.", "授業中に眠ってしまいました。昨夜もっと早く寝るべきでした。"], ["GP1-1", "GRAMMAR PLUS 1", "", "My father is always telling the same old jokes.", "父はいつも同じ古い冗談を言っています。"], ["GP1-2", "GRAMMAR PLUS 1", "", "The baseball game was about to start when it began to rain.", "野球の試合が始まろうとしていたとき、雨が降り始めました。"], ["GP1-3", "GRAMMAR PLUS 1", "", "I was on the point of leaving home when the phone rang.", "家を出ようとしていたとき、電話が鳴りました。"], ["GP1-4", "GRAMMAR PLUS 1", "", "There's no telling whether or not I can finish this report on time.", "このレポートを時間内に終えられるかどうか、見当がつきません。"], ["GP1-5", "GRAMMAR PLUS 1", "", "It is no use criticizing his rude behavior.", "彼の失礼な行動を批判しても無駄です。"], ["GP1-6", "GRAMMAR PLUS 1", "", "It is worth seeing that movie.", "その映画は見る価値があります。"], ["GP1-7", "GRAMMAR PLUS 1", "", "That movie is worth seeing.", "その映画は見る価値があります。"], ["GP1-8", "GRAMMAR PLUS 1", "", "I feel like going to a hot spring.", "温泉に行きたい気分です。"], ["GP1-9", "GRAMMAR PLUS 1", "", "On seeing her father, the girl ran up to him and hugged him.", "父親の姿を見るなり、その女の子は駆け寄って抱きつきました。"], ["GP1-10", "GRAMMAR PLUS 1", "", "M "", "They were more disappointed than angry.", "彼らは怒るというよりも落胆していました。"], ["GP4-3", "GRAMMAR PLUS 4", "", "It takes no more than 5 minutes from Ueno to Tokyo by train.", "上野から東京まで電車でわずか5分しかかかりません。"], ["GP4-4", "GRAMMAR PLUS 4", "", "My uncle always gives me no less than 10,000 yen as a New Year's gift.", "叔父はお年玉として必ず1万円以上くれます。"], ["GP4-5", "GRAMMAR PLUS 4", "", "I can't afford a bicycle, much less a motor bike.", "自転車すら買えないのに、バイクはなおさら無理です。"], ["GP4-6", "GRAMMAR PLUS 4", "", "This is a second-rate restaurant at best.", "このレストランは良くてもB級です。"], ["GP4-7", "GRAMMAR PLUS 4", "", "That film director was at his best in the 1990s.", "その映画監督は1990年代が全盛期でした。"], ["GP4-8", "GRAMMAR PLUS 4", "", "What would you do if you were to receive a million dollars?", "100万ドルを受け取るとしたら、あなたはどうしますか？"], ["GP4-9", "GRAMMAR PLUS 4", "", "If you should miss the train, please call me.", "もし電車に乗り遅れたら、私に電話してください。"], ["GP4-10", "GRAMMAR PLUS 4", "", "Were it not for this forest, many animals would lose their habitat.", "この森がなければ、多くの動物がその生息地を失うことになるでしょう。"], ["GP4-11", "GRAMMAR PLUS 4", "", "Had I studied Japanese history harder, I could better enjoy this tour of Kyoto.", "もっと日本史を熱心に勉強していたら、この京都観光をより楽しめたのに。"], ["GP4-12", "GRAMMAR PLUS 4", "", "Every time she remembers her grandmother, she is moved to tears.", "祖母のことを思い出すたびに、彼女は感動して涙を流します。"], ["GP4-13", "GRAMMAR PLUS 4", "", "I had hardly gotten on the train when the doors closed.", "電車に乗ったとたん、ドアが閉まりました。"], ["L13-1", "LESSON 13", "①", "There are more than 20 World Heritage Sites in Japan.", "日本には20か所以上の世界遺産があります。"], ["L13-2", "LESSON 13", "②", "We have several marvelous gardens in our town.", "私たちの町には素晴らしい庭園がいくつかあります。"], ["L13-3", "LESSON 13", "③", "The road along the beach always gets crowded on weekends.", "海岸沿いの道は週末にはいつも混雑します。"], ["L13-4", "LESSON 13", "④", "The view became famous because it appeared in a popular Japanese anime.", "その景色は、人気の日本のアニメに登場したことで有名になりました。"], ["L13-5", "LESSON 13", "⑤", "It takes about two hours to drive from Sapporo to Furano.", "札幌から富良野まで車で約2時間かかります。"], ["L13-6", "LESSON 13", "⑥", "I guess it will cost less than 1,000 yen to rent a bike for a day.", "自転車を1日借りると1,000円未満で済むと思います。"], ["L13-7", "LESSON 13", "⑦", "A lot of people came to understand the uniqueness of the building.", "その建物の独自性を理解するようになった人が大勢いました。"], ["L13-8", "LESSON 13", "⑧", "The number of tourists to our city began to increase in the late 1990s.", "私たちの市への観光客の数は1990年代後半に増え始めました。"], ["L14-1", "LESSON 14", "①", "The doctor made the patient rest in bed for several days.", "医師は患者に数日間ベッドで休むよう命じました。"], ["L14-2", "LESSON 14", "②", "The mother didn't let her daughter go to school without having breakfast.", "母親は娘が朝食を食べずに学校に行くことを許しませんでした。"], ["L14-3", "LESSON 14", "③", "The school got all the students to go for a medical checkup.", "学校は全生徒に健康診断を受けさせました。"], ["L14-4", "LESSON 14", "④", "The city allows its citizens to use the city's sports facilities for free.", "市は市民が市のスポーツ施設を無料で使えるようにしています。"], ["L14-5", "LESSON 14", "⑤", "Though I had an appointment, the clinic had me waiting for 30 minutes.", "予約があったにもかかわらず、診療所は私を30分待たせました。"], ["L14-6", "LESSON 14", "⑥", "The patient had his temperature and blood pressure checked.", "患者は体温と血圧を測ってもらいました。"], ["L14-7", "LESSON 14", "⑦", "I heard a newscaster talk about the average life expectancy of the Japanese.", "ニュースキャスターが日本人の平均寿命について話しているのを聞きました。"], ["L14-8", "LESSON 14", "⑧", "I saw many people jogging in the park this morning.", "今朝、公園でたくさんの人がジョギングしているのを見ました。"], ["L15-1", "LESSON 15", "①", "Few researchers noticed the mistake in the data.", "データの間違いに気づいた研究者はほとんどいませんでした。"], ["L15-2", "LESSON 15", "②", "No children in this world should have to experience hunger.", "世界中のどの子どもも飢えを経験するべきではありません。"], ["L15-3", "LESSON 15", "③", "Reducing inequality will make the world a better place to live.", "不平等を減らすことで、世界はよりよい居場所になるでしょう。"], ["L15-4", "LESSON 15", "④", "Access to education will help children have a brighter future.", "教育へのアクセスは、子どもたちがより明るい未来を持つのに役立ちます。"], ["L15-5", "LESSON 15", "⑤", "Online education enables students in remote areas to take classes.", "オンライン教育により、遠隔地の学生も授業を受けられるようになります。"], ["L15-6", "LESSON 15", "⑥", "Poverty prevents many children from going to school.", "貧困のために学校に行けない子どもが多くいます。"], ["L15-7", "LESSON 15", "⑦", "Japan is supposed to become carbon-neutral by 2050.", "日本は2050年までにカーボンニュートラルになるとされています。"], ["L15-8", "LESSON 15", "⑧", "All companies are required to take responsibility for their products.", "すべての企業は自社製品に責任を持つことが求められています。"], ["S1-1", "SUPPLEMENT 1", "", "Our shop will be closed from December 29th to January 3rd.", "当店は12月29日から1月3日まで休業します。"], ["S1-2", "SUPPLEMENT 1", "", "Her concert is going to be held at the Budokan.", "彼女のコンサートは武道館で開催される予定です。"], ["S1-3", "SUPPLEMENT 1", "", "This job has to be done carefully.", "この仕事は慎重に行う必要があります。"], ["S1-4", "SUPPLEMENT 1", "", "My computer is being repaired now.", "私のコンピュータは今修理中です。"], ["S1-5", "SUPPLEMENT 1", "", "We have been caught in a traffic jam for an hour.", "1時間も渋滞に巻き込まれています。"], ["S1-6", "SUPPLEMENT 1", "", "These cats are taken care of by Mr. and Mrs. Lake.", "これらの猫はレイク夫妻に世話をしてもらっています。"], ["S1-7", "SUPPLEMENT 1", "", "This problem should be dealt with at once.", "この問題はすぐに対処すべきです。"], ["S1-8", "SUPPLEMENT 1", "", "The thief got arrested on the street in Minato Ward last night.", "昨夜、港区の通りで泥棒が逮捕されました。"], ["S1-9", "SUPPLEMENT 1", "", "She was given an important position by the president.", "彼女は社長から重要なポストを与えられました。"], ["S1-10", "SUPPLEMENT 1", "", "An important position was given to her by the president.", "重要なポストが社長から彼女に与えられました。"], ["S1-11", "SUPPLEMENT 1", "", "This bag was bought for me by my aunt.", "このバッグは叔母が私に買ってくれました。"], ["S1-12", "SUPPLEMENT 1", "", "I am called Lil by my classmates.", "私はクラスメートからリルと呼ばれています。"], ["S2-1", "SUPPLEMENT 2", "", "\"Didn't you go to cram school yesterday?\" \"No, I didn't.\"", "「昨日、塾に行かなかったの？」「うん、行かなかったよ。」"], ["S2-2", "SUPPLEMENT 2", "", "Can't you ride a bike?", "自転車に乗れないの？"], ["S2-3", "SUPPLEMENT 2", "", "\"Don't you think this cat is cute?\" \"Yes, I do.\"", "「こ ack in thirty minutes.", "30分で戻ります。"], ["S4-11", "SUPPLEMENT 4", "", "Dan is in love with the girl over there in the white dress.", "ダンはあそこにいる白いドレスを着た女の子に恋をしています。"], ["S4-12", "SUPPLEMENT 4", "", "They are talking about the movie.", "彼らはその映画について話しています。"], ["S4-13", "SUPPLEMENT 4", "", "The expedition team has been wandering about the desert for three days.", "探検隊は3日間砂漠をさまよっています。"], ["S4-14", "SUPPLEMENT 4", "", "It's a ten-minute walk from here to the station.", "ここから駅まで歩いて10分です。"], ["S4-15", "SUPPLEMENT 4", "", "A lot of people die from starvation every year.", "毎年、多くの人が飢えで亡くなっています。"], ["S4-16", "SUPPLEMENT 4", "", "His opinion about the issue is different from mine.", "その問題についての彼の意見は私の意見と異なります。"], ["S4-17", "SUPPLEMENT 4", "", "It was so cold that I thought I would freeze to death.", "とても寒くて、凍え死にそうだと思いました。"], ["S4-18", "SUPPLEMENT 4", "", "My sister left for Australia this morning.", "姉は今朝オーストラリアに向けて出発しました。"], ["S4-19", "SUPPLEMENT 4", "", "What can I do for you?", "何かご用件はありますか？"], ["S4-20", "SUPPLEMENT 4", "", "We've been waiting for Sarah for 15 minutes.", "私たちはサラを15分間待っています。"], ["S4-21", "SUPPLEMENT 4", "", "Sophie was standing by the window looking outside.", "ソフィーは窓の側に立って外を見ていました。"], ["S4-22", "SUPPLEMENT 4", "", "Sam lives in a town near Sydney.", "サムはシドニーの近くの町に住んでいます。"], ["S4-23", "SUPPLEMENT 4", "", "Bill went to the nearest station by bicycle.", "ビルは自転車で一番近い駅に行きました。"], ["S4-24", "SUPPLEMENT 4", "", "I have to make up my mind about that by tomorrow.", "明日までにそのことを決めなければなりません。"], ["S5-1", "SUPPLEMENT 5", "", "At last we reached the top of the mountain.", "ついに私たちは山の頂上に到達しました。"], ["S5-2", "SUPPLEMENT 5", "", "She is a person of importance in the political world.", "彼女は政界で重要な人物です。"], ["S5-3", "SUPPLEMENT 5", "", "Who is that girl walking with Tom?", "トムと一緒に歩いているあの女の子は誰ですか？"], ["S5-4", "SUPPLEMENT 5", "", "That man with gray hair is Dan's father.", "白髪のあの男性はダンの父親です。"], ["S5-5", "SUPPLEMENT 5", "", "I should have brought an umbrella with me.", "傘を持ってくるべきでした。"], ["S5-6", "SUPPLEMENT 5", "", "We must handle these old books with care.", "これらの古い本は丁寧に扱わなければなりません。"], ["S5-7", "SUPPLEMENT 5", "", "I wash my hands with soap as soon as I get home.", "帰宅したらすぐに石鹸で手を洗います。"], ["S5-8", "SUPPLEMENT 5", "", "Our train passed through a long tunnel.", "私たちの電車は長いトンネルを通りました。"], ["S5-9", "SUPPLEMENT 5", "", "Alice wants to travel through Japan.", "アリスは日本を旅したいと思っています。"], ["S5-10", "SUPPLEMENT 5", "", "I was able to sleep soundly through the night.", "夜通し熟睡することができました。"], ["S6-1", "SUPPLEMENT 6", "", "Take this medicine, and you will feel better.", "この薬を飲めば、気分がよくなるでしょう。"], ["S6-2", "SUPPLEMENT 6", "", "Do your best, or you'll regret it.", "最善を尽くさないと、後悔することになります。"], ["S6-3", "SUPPLEMENT 6", "", "I ordered not a hamburger but a cheese burger.", "ハンバーガーではなくチーズバーガーを注文しました。"], ["S6-4", "SUPPLEMENT 6", "", "Lisa plays not only the piano but also the guitar.", "リサはピアノだけでなくギターも弾きます。"], ["S6-5", "SUPPLEMENT 6", "", "Emma came to see you while you were away.", "あなたが不在の間にエマが会いに来ました。"], ["S6-6", "SUPPLEMENT 6", "", "I want to go to the beach next weekend, while Tom wants to stay home.", "私は来週末は海に行きたいですが、トムは家にいたいと思っています。"], ["S6-7", "SUPPLEMENT 6", "", "I'll return this book to you as soon as I finish reading it.", "読み終えたらすぐにこの本を返します。"], ["S6-8", "SUPPLEMENT 6", "", "The moment Lily saw Jim, she called out his name.", "リリーはジムを見たとたん、彼の名前を呼びました。"], ["S6-9", "SUPPLEMENT 6", "", "Once you make a promise, you should never break it.", "一度約束したら、絶対に破ってはなりません。"], ["S6-10", "SUPPLEMENT 6", "", "Now that my grandfather is retired, he spends all his free time reading.", "祖父が引退したので、暇な時間のすべてを読書に費やしています。"], ["S6-11", "SUPPLEMENT 6", "", "As long as you keep trying, you have a chance to achieve your goal.", "努力し続ける限り、目標を達成するチャンスがあります。"], ["S6-12", "SUPPLEMENT 6", "", "As far as I can remember, Ken belonged to the baseball team in high school.", "私が覚えている限り、ケンは高校時代に野球部に所属していました。"], ["S6-13", "SUPPLEMENT 6", "", "Call the police in case you see anyone suspicious in this area.", "この地域で不審者を見かけたら、警察に電話してください。"], ["S6-14", "SUPPLEMENT 6", "", "I had better write down your phone number in case I forget it.", "忘れてしまうといけないので、あなたの電話番号を書き留めておいた方がよいでしょう。"], ["S6-15", "SUPPLEMENT 6", "", "I went to bed early for fear that I would oversleep the next morning.", "翌朝寝過ごすのが怖くて、早めに寝ました。"], ["S7-1", "SUPPLEMENT 7", "", "I do want to go to her concert.", "彼女のコンサートにどうしても行きたいです。"], ["S7-2", "SUPPLEMENT 7", "", "I know the food is good, but you shouldn't eat that much.", "食べ物がおいしいことはわかっていますが、そんなに食べてはいけません。"], ["S7-3", "SUPPLEMENT 7", "", "I didn't know that Kyoto gets this hot.", "京都がこれほど暑いとは知りませんでした。"], ["S7-4", "SUPPLEMENT 7", "", "You don't have to apologize at all.", "まったく謝る必要はありません。"], ["S7-5", "SUPPLEMENT 7", "", "I wasn't moved by the movie in the least.", "私はその映画に少しも感動しませんでした。"], ["S7-6", "SUPPLEMENT 7", "", "Why on earth do you say such things?", "一体なぜそんなことを言うのですか？"], ["S7-7", "SUPPLEMENT 7", "", "What in the world should I do in this situation?", "このような状況で、一体何をすればいいのでしょうか？"], ["S7-8", "SUPPLEMENT 7", "", "Do you know anything at all about that incident?", "あの事件について何か知っていますか？"], ["S7-9", "SUPPLEMENT 7", "", "It is that blue coat that I want to try on.", "私が試着したいのはあの青いコートです。"], ["S7-10", "SUPPLEMENT 7", "", "I want to try that blue coat on.", "私はあの青いコートを試着したいです。"], ["S7-11", "SUPPLEMENT 7", "", "What I want to know is your true feelings.", "私が知りたいのはあなたの本心です。"], ["S7-12", "SUPPLEMENT 7", "", "I want to know your true feelings.", "私はあなたの本心を知りたいです。"], ["S7-13", "SUPPLEMENT 7", "", "All they want to do is live in peace.", "彼らがしたいことはただ平和に生きることです。"], ["S7-14", "SUPPLEMENT 7", "", "All they want to do is to live in peace.", "彼らがしたいことはただ平和に生きることです。"], ["S7-15", "SUPPLEMENT 7", "", "Never have I told you a lie.", "あなたに嘘をついたことは一度もありません。"], ["S7-16", "SUPPLEMENT 7", "", "In that old mansion lives an old man.", "その古い屋敷には老人が住んでいます。"], ["S7-17", "SUPPLEMENT 7", "", "Jim is interested in Japanese temples, and so am I.", "ジムは日本の寺院に興味があり、私もそうです。"], ["S7-18", "SUPPLEMENT 7", "", "My brother can't play baseball, and neither can I.", "弟は野球ができないし、私もできません。"]];

const NOTES={"L1-1": {"grammar_notes": ["「go + Ving」で「〜しに行く」という意味になる口語表現（go jogging, go shopping, go fishing など）。", "to不定詞の副詞的用法（目的）。「stay healthy」で「健康を維持するために」という目的を表す。", "nearby は形容詞として名詞の前に置かれ「近くの」という意味。副詞用法（near = 近くに）と区別する。"], "vocabulary_notes": ["nearby: 「近くの」（形容詞）。副詞のnear/nearbyとの混同に注意。", "stay + 形容詞: 「〜のままでいる」。stay healthy=健康を保つ。"]}, "L1-2": {"grammar_notes": ["現在進行形（be + Ving）。一時的に進行中の動作を表す。look forは進行形にできる動作動詞。", "look for 〜: 「〜を探す」という句動詞。findと違い「探している最中」の意味。", "current は「現在の」という意味の形容詞で、名詞の前に置いて時事的な内容を修飾する。"], "vocabulary_notes": ["look for: 〜を探す。lookingとing形で進行中を表す。", "current: 現在の、最新の。current events(時事問題)などでも使う。"]}, "L1-3": {"grammar_notes": ["過去形（learned）。過去の特定の時点（last week）に起きた動作を表す。", "about は前置詞で「〜について」。learn about 〜で「〜について学ぶ」。", "the life of 〜: 「〜の生涯・人生」。ofは所有・所属を表す。"], "vocabulary_notes": ["learn about: 〜について学ぶ。studyよりも知識を得ることに焦点。", "history class: 歴史の授業。教科名+classで「〜の授業」。"]}, "L1-4": {"grammar_notes": ["現在完了形（have + 過去分詞）の完了用法。alreadyと共起し「すでに〜した」を表す。", "decide の目的語に間接疑問文 what I want to do が続く形（decide + 疑問詞節）。", "in the future: 「将来」。前置詞inは広い時間の範囲を表す。"], "vocabulary_notes": ["already: すでに。完了用法の現在完了とセットで使われる副詞。", "decide: 決める。decide what to do のように疑問詞+to不定詞も可。"]}, "L1-5": {"grammar_notes": ["現在完了形の経験用法。neverと共起し「一度も〜したことがない」を表す。", "about の後は動名詞（living）が続く。前置詞の後は動詞は必ずing形になる。", "foreign country: 「外国」。foreignは「外国の」という形容詞。"], "vocabulary_notes": ["never: 一度も〜ない。経験用法の現在完了で頻出。", "think about Ving: 〜することについて考える。"]}, "L1-6": {"grammar_notes": ["現在完了形の継続用法。sinceは「〜以来」という起点を表す前置詞（または接続詞）。", "have had は have（持つ）の現在完了形。「ずっと持ち続けている」という継続を表す。", "keen interest in 〜: 「〜への強い関心」。keenは「熱心な、強い」という意味の形容詞。"], "vocabulary_notes": ["keen: 熱心な、強い（関心・興味について）。keen interest=強い興味。", "since: 〜以来（起点）。sinceの後には過去の一時点や節が続く。"]}, "L1-7": {"grammar_notes": ["It is 形容詞 to do の形式主語構文。真主語のto不定詞（to study abroad）を後ろに回す。", "I'm sure (that) 〜: 「きっと〜だと思う」。sureの後のthatは省略可能。", "challenging: 「やりがいのある、大変な」という形容詞。動詞challengeの現在分詞形が形容詞化。"], "vocabulary_notes": ["challenging: (努力を要するという意味で)困難な、やりがいのある。", "study abroad: 留学する。abroadは副詞で「海外で」。"]}, "L1-8": {"grammar_notes": ["be going to + 動詞の原形: すでに決めている未来の予定・意志を表す表現。", "study の目的語に学問分野（international relations）を置く用法。", "in college: 「大学で」。collegeは無冠詞で「大学（という制度・場）」を表すことが多い。"], "vocabulary_notes": ["international relations: 国際関係学（学問分野名）。", "be going to: 〜するつもりだ（すでに決めている予定）。"]}, "L2-1": {"grammar_notes": ["It is 形容詞 for A to do の形式主語構文。forの後に意味上の主語（you）を置く。", "natural for A to do: 「Aが〜するのは当然だ」という評価を表す典型パターン。", "be excited about 〜: 「〜にわくわくする」。aboutは感情の対象を導く前置詞。"], "vocabulary_notes": ["natural: 当然の、自然な。It is natural for A to doで頻出。", "be excited about: 〜にわくわくする。excitedは過去分詞由来の感情形容詞。"]}, "L2-2": {"grammar_notes": ["My plan is to do の形で、to不定詞が補語（名詞的用法）として使われている。", "plan for 〜: 「〜のための計画」。forは目的・対象を表す。", "on my computer: 道具を表す前置詞on（媒体・機器の上で、という意味合い）。"], "vocabulary_notes": ["plan for: 〜のための計画。plan to doとの違いに注意。", "shogi: 将棋。日本文化特有の語で英語ではそのまま使われる。"]}, "L2-3": {"grammar_notes": ["動名詞（Planning）が文の主語になる用法。動名詞句全体が主語として扱われる。", "can be + 形容詞: 「〜になりうる」という可能性を表す。", "lots of fun: 「とても楽しいこと」。lots of=a lot of（口語的）。"], "vocabulary_notes": ["planning: 計画すること（動名詞）。動名詞主語は3人称単数扱い。", "lots of fun: とても楽しい。fun は不可算名詞。"]}, "L2-4": {"grammar_notes": ["look forward to Ving: 「〜するのを楽しみにする」。このtoは前置詞なので後ろは動名詞。", "現在進行形が未来の予定を表す用法（look forward to watching）。", "on TV: 「テレビで」。媒体を表す前置詞on。"], "vocabulary_notes": ["look forward to: 〜を楽しみにする。toの後は必ず動名詞(Ving)。", "tennis match: テニスの試合。matchは対戦競技の「試合」。"]}, "L2-5": {"grammar_notes": ["It's up to you to do: 「〜するかどうかはあなた次第だ」という形式主語構文の慣用表現。", "which subject to study: 疑問詞which+名詞+to不定詞の形。「どの教科を勉強すべきか」。", "at home: 「家で」。前置詞atは地点を表す。"], "vocabulary_notes": ["be up to A: Aの決めることだ、A次第である。", "which subject: どの教科。whichは複数の選択肢から選ぶ疑問詞。"]}, "L2-6": {"grammar_notes": ["His decision to do: to不定詞の形容詞的用法で、decisionを修飾している（同格的用法）。", "should + 原形: 「〜のはずだ」という推量・期待を表す助動詞。", "lead to 〜: 「〜につながる」という結果を表す句動詞。"], "vocabulary_notes": ["decision to do: 〜するという決断。名詞+to不定詞の同格用法。", "keep regular hours: 規則正しい生活を送る。keepは「保つ」。"]}, "L2-7": {"grammar_notes": ["The problem is that 〜: 「問題は〜ということだ」。that節が補語になる名詞節。", "there isn't enough 〜: there is構文の否定形。存在の否定を表す。", "enough space for 〜: 「〜のための十分なスペース」。enoughは名詞の前に置く数量形容詞。"], "vocabulary_notes": ["enough: 十分な。enough + 名詞 for 〜で「〜のための十分な…」。", "space: 空間、スペース（不可算名詞）。"]}, "L2-8": {"grammar_notes": ["I'm not sure whether 〜: 「〜かどうか自信がない」。whetherは「〜かどうか」を表す接続詞。", "whether A or B: 「AかBか」という選択を表す典型パターン。", "should + 原形: 「〜すべきか」という義務・当然の意味の助動詞。"], "vocabulary_notes": ["whether ... or ...: 〜か…か。orで2つの選択肢を並べる。", "cook supper: 夕食を作る。supper=dinnerとほぼ同義（やや口語的）。"]}, "L3-1": {"grammar_notes": ["助動詞canは「〜できる」という能力・可能を表す。", "during 〜: 「〜の間に」。特定の期間内の一点を表す前置詞。", "lunch break: 「昼休み」。breakは「休憩」という意味の名詞。"], "vocabulary_notes": ["can: 〜できる（能力・許可）。", "during: 〜の間に。特定の期間名（lunch break等）と共に使う。"]}, "L3-2": {"grammar_notes": ["助動詞mayは「〜かもしれない」という推量（弱い可能性）を表す。", "final exam: 「期末試験」。finalは「最終の」という形容詞。", "veryはmay be difficultのdifficultを強調する副詞。"], "vocabulary_notes": ["may: 〜かもしれない（推量）。", "final exam: 期末試験。中間試験はmidterm exam。"]}, "L3-3": {"grammar_notes": ["助動詞mustは「〜しなければならない」という強い義務を表す。", "wear + 衣類: 「〜を身につけている・着る」。", "school trip: 「修学旅行」。tripは「旅行」の意味の名詞。"], "vocabulary_notes": ["must: 〜しなければならない（強い義務）。", "school uniform: 制服。uniform=（学校などの）制服。"]}, "L3-4": {"grammar_notes": ["shouldは「〜のはずだ」という推量、mightは「〜かもしれない」というmayより弱い推量。", "but でつながれた2つの節が対比・譲歩の関係になっている。", "postpone: 「延期する」という他動詞。ここでは受動態（be postponed）で使われている。"], "vocabulary_notes": ["should: 〜のはずだ（推量）。mustより確信度は低い。", "postpone: 延期する。postpone Ving（動名詞を目的語にとる）も重要。"]}, "L3-5": {"grammar_notes": ["has goneは現在完了形（結果用法）で「行ってしまって今ここにいない」ことを表す。", "助動詞willは「〜だろう」という単純未来の予測を表す。", "be back: 「戻ってくる」。backは副詞で「戻って」という意味。"], "vocabulary_notes": ["have gone to: 〜へ行ってしまった（今はいない）。have been toとの違いに注意。", "teachers' room: 職員室。teacher'sではなくteachers'（複数所有格）。"]}, "L3-6": {"grammar_notes": ["助動詞wouldは仮定・推量に基づく「〜だろう」を表す（控えめな断定）。", "the right person for 〜: 「〜にふさわしい人物」。rightは「適切な」という形容詞。", "class representative: 「クラス委員」。representativeは「代表者」を意味する名詞。"], "vocabulary_notes": ["would: 〜だろう（控えめな推量・willより婉曲）。", "class representative: 学級代表、クラス委員。"]}, "L3-7": {"grammar_notes": ["Though 〜, ...: 「〜だけれども」という譲歩を表す接続詞。", "must have + 過去分詞: 「〜したに違いない」という過去の事柄への強い推量。", "be good at 〜: 「〜が得意だ」。atは能力の対象を表す前置詞。"], "vocabulary_notes": ["must have done: 〜したに違いない（過去への強い推量）。", "get a high score: 高得点を取る。scoreは得点を表す名詞。"]}, "L3-8": {"grammar_notes": ["should have + 過去分詞: 「〜すべきだったのに（実際はしなかった）」という後悔を表す。", "fall asleep: 「眠りに落ちる」という熟語表現（fell asleepは過去形）。", "during class: 「授業中に」。duringは特定の期間の中の一点を表す。"], "vocabulary_notes": ["should have done: 〜すべきだったのに（しなかった、という後悔）。", "fall asleep: 眠りに落ちる。sleepとの違い（fall asleep=眠りに入る動作）。"]}, "GP1-1": {"grammar_notes": ["be always Ving: 進行形が「いつも〜してばかりいる」という非難・呆れのニュアンスを表す用法。", "通常の進行形（一時的動作）とは異なり、習慣的な反復行動への話者の感情がこもる。", "the same old 〜: 「例のいつもの〜」という繰り返しへの皮肉を含む表現。"], "vocabulary_notes": ["be always Ving: いつも〜してばかりいる（非難のニュアンス）。", "the same old joke: 例のいつもの冗談。oldは「使い古された」という意味合い。"]}, "GP1-2": {"grammar_notes": ["be about to do: 「まさに〜しようとしている」という差し迫った未来を表す表現。", "whenは「〜したちょうどそのとき」という意味で、突然の出来事の割り込みを表す。", "beginは自動詞としても使われ、begin to doで「〜し始める」。"], "vocabulary_notes": ["be about to do: まさに〜しようとしている（直前の未来）。", "when: 〜したとき（ここでは「すると」に近い意味合い）。"]}, "GP1-3": {"grammar_notes": ["be on the point of Ving: 「まさに〜しようとしている」でbe about to doとほぼ同義の表現。", "of の後は動名詞（leaving）が続く。前置詞+動名詞の基本パターン。", "when the phone rang: 「そのとき電話が鳴った」という突発的な出来事を表す。"], "vocabulary_notes": ["be on the point of Ving: まさに〜するところだ。be about to doとほぼ同義。", "ring-rang-rung: 鳴る（電話などが）。過去形rangに注意。"]}, "GP1-4": {"grammar_notes": ["There's no Ving: 「〜することはできない」という不可能を表す慣用表現（=It is impossible to do）。", "tell の後にwhether or notが続き「〜かどうか」という間接疑問の意味を持つ。", "on time: 「時間通りに」という熟語。in timeの「間に合って」との違いに注意。"], "vocabulary_notes": ["There's no Ving: 〜することはできない。＝It is impossible to do。", "on time: 時間通りに、定刻に。"]}, "GP1-5": {"grammar_notes": ["It is no use Ving: 「〜しても無駄だ」という慣用表現。useは名詞で「役に立つこと」。", "criticize: 「〜を批判する」という他動詞。", "rude behavior: 「失礼な振る舞い」。rudeは「無礼な」という形容詞。"], "vocabulary_notes": ["It is no use Ving: 〜しても無駄だ。", "criticize: 批判する。名詞形はcriticism。"]}, "GP1-6": {"grammar_notes": ["It is worth Ving: 「〜する価値がある」という形式主語構文の慣用表現。", "worthは形容詞だが、後ろに動名詞をとる特殊な用法を持つ。", "that movie（真主語に近い内容）を目的語としてseeingが受けている。"], "vocabulary_notes": ["worth Ving: 〜する価値がある。worthの後は動名詞。", "It is worth Ving と S is worth Ving の書き換えができる。"]}, "GP1-7": {"grammar_notes": ["S is worth Ving: 「Sは〜する価値がある」という、GP1-6のIt is worth Vingの書き換え形。", "この文では主語thatが実質的にseeingの意味上の目的語も兼ねている点に注意。", "worth の後ろは常に動名詞（Ving）であり、to不定詞は使えない。"], "vocabulary_notes": ["S is worth Ving: Sは〜する価値がある。", "It is worth Ving＝S is worth Vingの書き換え関係を確認。"]}, "GP1-8": {"grammar_notes": ["feel like Ving: 「〜したい気分だ」という願望を表す口語的表現。", "likeはここでは前置詞として使われ、後ろに動名詞をとる。", "hot spring: 「温泉」。springは「泉」を意味する名詞。"], "vocabulary_notes": ["feel like Ving: 〜したい気分だ。likeは前置詞。", "hot spring: 温泉。日本文化に関する頻出語彙。"]}, "GP1-9": {"grammar_notes": ["On Ving, S+V: 「〜するとすぐに」という時を表す分詞構文的表現（=As soon as S+V）。", "run up to 〜: 「〜に駆け寄る」という句動詞。", "and で2つの動作（ran up、hugged）が並列に結ばれている。"], "vocabulary_notes": ["On Ving: 〜するとすぐに。＝As soon as S+V。", "run up to: 〜に駆け寄る。hug: 抱きしめる。"]}, "GP1-10": {"grammar_notes": ["talk A into Ving: 「Aを説得して〜させる」という使役的な意味を持つ句動詞。", "反意表現talk A out of Ving「Aを説得して〜するのをやめさせる」も重要。", "give up Ving: 「〜するのをやめる」。giveの後は動名詞のみ（to不定詞不可）。"], "vocabulary_notes": ["talk A into Ving: Aを説得して〜させる。", "give up Ving: 〜をやめる。give upの目的語は動名詞。"]}, "GP1-11": {"grammar_notes": ["may well do: 「たぶん〜だろう」という、mayより確信度が高い推量表現。", "too 〜 for A: 「Aには〜すぎる」という程度を表す構文。", "too difficult for A: 「Aにとって難しすぎる」。forの後は意味上の主語。"], "vocabulary_notes": ["may well do: たぶん〜だろう（十分な理由のある推量）。", "too ... for A: Aには…すぎる。"]}, "GP1-12": {"grammar_notes": ["might as well do: 「〜した方がよい（他に良い選択肢がないから）」という消極的な提案表現。", "この might は仮定法的な用法で、現実の許可・可能性のmightとは異なる慣用表現。", "a little longer: 「もう少し長く」。littleの比較級longerを修飾するa little。"], "vocabulary_notes": ["might as well do: （他に選択肢がないので）〜した方がよい。", "a little longer: もう少し長く。"]}, "GP1-13": {"grammar_notes": ["have got to do: 「〜しなければならない」というhave to doの口語的・強調的表現。", "'ve got to は主にイギリス英語・口語で使われ、義務を表す。", "catch the train: 「電車に間に合う、乗る」という意味の熟語。"], "vocabulary_notes": ["have got to do: 〜しなければならない（口語的なhave to）。", "catch a train: 電車に（間に合って）乗る。missとの対比で覚える。"]}, "GP1-14": {"grammar_notes": ["would rather do A than do B: 「BするよりむしろAしたい」という選好を表す構文。", "go hungry: 「空腹のままでいる」というgo+形容詞の表現。", "than の後は原形不定詞（eat）が続く点に注意（to不定詞は使わない）。"], "vocabulary_notes": ["would rather A than B: BよりむしろAしたい。", "go hungry: 空腹のままでいる。go+形容詞で状態変化・継続を表す。"]}, "GP1-15": {"grammar_notes": ["cannot help Ving: 「〜せずにはいられない」という慣用表現（=cannot help but do）。", "helpはここで「避ける」に近い意味で使われ、動名詞を目的語にとる。", "laugh at 〜: 「〜を見て（聞いて）笑う」という句動詞。"], "vocabulary_notes": ["cannot help Ving: 〜せずにはいられない。", "laugh at: 〜を見て笑う。atは対象を表す前置詞。"]}, "GP1-16": {"grammar_notes": ["cannot ... too 〜: 「どんなに〜してもしすぎることはない」という強い推奨を表す慣用表現。", "thank A too much: 「Aに感謝しすぎる」の意味だが、cannotと組み合わさり「感謝してもしきれない」となる。", "この構文はcannot be too careful（注意しすぎることはない）などにも応用される。"], "vocabulary_notes": ["cannot ... too much: いくら〜してもしすぎることはない。", "coach: コーチ、指導者。"]}, "L4-1": {"grammar_notes": ["過去形（cleaned up）。過去の一回限りの出来事を述べる基本的な文構造。", "clean up 〜: 「〜をきれいに掃除する」という句動詞。", "historic site: 「史跡」。historic（歴史上重要な）とhistorical（歴史に関する）の違いに注意。"], "vocabulary_notes": ["historic: 歴史的に重要な。historicalとの違い（historic=有名・重要、historical=歴史に関する全般）。", "clean up: 掃除してきれいにする。"]}, "L4-2": {"grammar_notes": ["learn A and gain B: 動詞句が並列に並ぶ等位接続詞andの用法。", "many skills / much experience: 可算名詞skillsと不可算名詞experienceでmany/muchを使い分ける。", "from the volunteer work: 「そのボランティア活動から」という由来・出所を表す前置詞from。"], "vocabulary_notes": ["gain experience: 経験を積む。gainは「（努力して）得る」という意味。", "skill(s): 技能、技術。可算名詞として複数形で使われることが多い。"]}, "L4-3": {"grammar_notes": ["過去分詞difficultとhelpfulが等位接続詞butで対比的に並べられている（形容詞の並列）。", "difficult but helpful: 「難しいがためになる」という譲歩的な対比構造。", "summer math course: 「夏期数学講座」。名詞が連続して複合名詞を作る（summer+math+course）。"], "vocabulary_notes": ["helpful: 役に立つ、ためになる。help+fulの派生語。", "course: 講座、コース。授業・講習という意味。"]}, "L4-4": {"grammar_notes": ["It was necessary for A to do: 形式主語構文（過去形）。「Aが〜する必要があった」。", "necessaryは評価を表す形容詞で、for+意味上の主語+to不定詞のパターンをとる。", "attend: 「〜に出席する」という他動詞（前置詞不要）。attend toとの混同に注意。"], "vocabulary_notes": ["necessary: 必要な。It is necessary for A to doの形で頻出。", "attend: 出席する（他動詞）。attend toは「対処する」の意味になる。"]}, "L4-5": {"grammar_notes": ["過去形found。findの過去形irregular動詞（find-found-found）。", "stolen bicycle: 過去分詞stolenが名詞bicycleを前から修飾する形容詞的用法。", "near the station: 「駅の近くで」。nearは前置詞として場所の近さを表す。"], "vocabulary_notes": ["stolen: 盗まれた（steal の過去分詞）。過去分詞の形容詞用法。", "steal-stole-stolen: 盗む（不規則変化動詞）。"]}, "L4-6": {"grammar_notes": ["keep + Ving: 「〜し続ける」という継続を表す動詞パターン。", "keep talking: 「話し続ける」。keepの後は動名詞のみ（to不定詞不可）。", "upcoming: 「来たる、今度の」という未来を表す形容詞（school festivalを修飾）。"], "vocabulary_notes": ["keep Ving: 〜し続ける。", "upcoming: 来たる、間近に迫った。upcoming eventなどでよく使われる。"]}, "L4-7": {"grammar_notes": ["現在分詞amazingが形容詞化し、名詞performanceを修飾するのではなく補語として使われている。", "amazing（〜させるような）は能動的な意味を持つ現在分詞由来の形容詞。", "on stage: 「舞台で」という場所を表す前置詞句。"], "vocabulary_notes": ["amazing: 素晴らしい、驚くべき（能動的：人を感動させる）。", "performance: 公演、パフォーマンス。"]}, "L4-8": {"grammar_notes": ["過去分詞amazedが感情を表す形容詞として使われ、be動詞の補語になっている。", "be amazed by 〜: 「〜に感動する、驚かされる」という受動的な感情表現。", "L4-7のamazing（能動）とL4-8のamazed（受動）の対比を意識する。"], "vocabulary_notes": ["amazed: 感動した、驚かされた（受動的：人が感じる側）。", "be amazed by/at: 〜に驚く、感動する。"]}, "L5-1": {"grammar_notes": ["self-driving: 現在分詞由来の複合形容詞で「自動運転の」という意味。busを前から修飾。", "full of passengers: 過去分詞的な形容詞fullが後ろにof句を伴いbusを後置修飾。", "go down the street: 「通りを進んでいく」という移動を表す表現。"], "vocabulary_notes": ["self-driving: 自動運転の。self-（自己）+doing形の複合語。", "passenger: 乗客。full of passengers=乗客でいっぱいの。"]}, "L5-2": {"grammar_notes": ["助動詞canを使った疑問文。「〜できますか」という能力・可能性を尋ねる表現。", "a life without 〜: 「〜のない生活」。withoutは「〜なしで」という否定的な前置詞。", "imagine の目的語に名詞句（a life without your smartphone）が続く基本構造。"], "vocabulary_notes": ["imagine: 想像する。imagine + 名詞/動名詞の形で使う。", "without: 〜なしで。withの反意語で否定を表す前置詞。"]}, "L5-3": {"grammar_notes": ["現在分詞teachingがwebsitesを後ろから修飾する後置修飾（現在分詞句）。", "There are 〜: 存在文構文。「〜がある」という事実を述べる基本構文。", "teaching English: 「英語を教えている」という進行中・継続的な性質を表す。"], "vocabulary_notes": ["website: ウェブサイト。", "teach: 教える。ここでは現在分詞として名詞を修飾。"]}, "L5-4": {"grammar_notes": ["過去分詞takenがphotosを後ろから修飾する後置修飾（過去分詞句、受動的意味）。", "taken with this camera: 「このカメラで撮られた」という受動的な意味を表す。", "現在分詞（能動：〜している）と過去分詞（受動：〜される）の後置修飾の対比が重要。"], "vocabulary_notes": ["take a photo: 写真を撮る。過去分詞takenで「撮られた」という意味になる。", "beautiful: 美しい。ここでは文全体の補語。"]}, "L5-5": {"grammar_notes": ["nowadaysは「近ごろは、最近は」という時を表す副詞で、文頭に置かれることが多い。", "online music streaming: 「オンライン音楽ストリーミング」という名詞句が文の主語。", "a popular way to do: 「〜する人気の方法」という名詞+to不定詞（形容詞的用法）。"], "vocabulary_notes": ["nowadays: 近ごろは、最近は。現在の状況の変化を述べるときに使う。", "way to do: 〜する方法。"]}, "L5-6": {"grammar_notes": ["Can I 〜?: 許可を求める疑問文。「〜してもいいですか」。", "electronic dictionary: 「電子辞書」。electronicは「電子の」という形容詞。", "something to look up: 「調べるべき何か」。something+to不定詞（形容詞的用法）。"], "vocabulary_notes": ["look up: （辞書などで）調べる。句動詞として頻出。", "electronic: 電子の。electronic dictionary=電子辞書。"]}, "L5-7": {"grammar_notes": ["be likely to do: 「〜しそうだ」という可能性を表す慣用表現。", "virtual reality: 「バーチャルリアリティ、仮想現実」という複合名詞。", "dramatically: 「劇的に」という副詞。improveを修飾している。"], "vocabulary_notes": ["be likely to do: 〜しそうだ、〜する可能性が高い。", "dramatically: 劇的に、急激に。程度・変化の大きさを強調。"]}, "L5-8": {"grammar_notes": ["be sure to do: 「きっと〜する」という確信を表す慣用表現（be likely to doより確信度が高い）。", "replace: 「〜に取って代わる」という他動詞。", "gasoline-powered: 「ガソリン駆動の」という複合形容詞（過去分詞poweredを含む）。"], "vocabulary_notes": ["be sure to do: きっと〜する（話者の強い確信）。", "replace: 取って代わる。A replace Bで「AがBに取って代わる」。"]}, "L6-1": {"grammar_notes": ["主格の関係代名詞who。先行詞a womanを修飾し、works for the UNという説明を加える。", "work for 〜: 「〜に勤めている」という句動詞。forは所属先を表す。", "the news about 〜: 「〜についてのニュース」。aboutは話題を表す前置詞。"], "vocabulary_notes": ["work for: 〜に勤める、〜のために働く。", "the United Nations: 国連（国際連合）。"]}, "L6-2": {"grammar_notes": ["主格の関係代名詞which（先行詞はThe movie）が、物を先行詞とする制限用法で使われている。", "surely: 「きっと、確実に」という副詞。willの確信度を強める。", "win an award: 「賞を受賞する」という表現。"], "vocabulary_notes": ["a big hit: 大ヒット（作品）。hitは「大当たり」という意味の名詞。", "win an award: 賞を獲得する。"]}, "L6-3": {"grammar_notes": ["目的格の関係代名詞that（先行詞はAn online news article）。関係詞節内でreadの目的語が欠けている。", "この関係代名詞thatは省略可能（I read yesterdayと直接続けても可）。", "fake: 「偽の」という形容詞。fake newsで「フェイクニュース」という複合語になる。"], "vocabulary_notes": ["article: 記事。news articleで「ニュース記事」。", "fake: 偽の、にせの。fake newsは時事的な重要語。"]}, "L6-4": {"grammar_notes": ["非制限用法の関係代名詞who（コンマ+who）。先行詞the prime ministerに補足説明を加える。", "非制限用法は「その人は、というのは〜だが」という追加情報を挿入する（先行詞を限定しない）。", "went to the theater: 「劇場に行った」。theaterは「劇場、映画館」。"], "vocabulary_notes": ["prime minister: 首相。", "on vacation: 休暇中で。前置詞onで状態を表す。"]}, "L6-5": {"grammar_notes": ["非制限用法の関係代名詞which。先行詞は前の文の内容全体（He is said to be...という事実全体）。", "be said to do: 「〜だと言われている」という伝聞を表す慣用表現。", "この非制限whichは「そしてそれは」と訳すのがコツ（先行詞が語ではなく文全体）。"], "vocabulary_notes": ["be said to be: 〜だと言われている。", "one of the 最上級 名詞(複数形): 最も〜な…の一つ。"]}, "L6-6": {"grammar_notes": ["関係副詞when。先行詞the date（時を表す名詞）を修飾し、その中で完全な文が続く。", "would + 原形: 過去から見た未来（時制の一致）を表す。releaseの未来性を表す。", "announce: 「発表する」という他動詞。目的語にthe dateを取る。"], "vocabulary_notes": ["announce: 発表する、公表する。", "release: （映画などを）公開する、発売する。"]}, "L6-7": {"grammar_notes": ["関係副詞where。先行詞the caves（場所を表す名詞）を修飾し、中で完全な文が続く。", "used to do: 「以前は〜したものだ（今はしない）」という過去の習慣を表す。", "tourist spot: 「観光地」。spotは「場所、地点」という意味の名詞。"], "vocabulary_notes": ["used to do: 以前は〜したものだ（現在との対比）。", "tourist spot: 観光スポット。popular tourist spot=人気の観光地。"]}, "L6-8": {"grammar_notes": ["関係副詞why。先行詞the reason（理由を表す名詞）を修飾する。the reason whyはセットで覚える。", "the reason why 〜: 「〜する理由」という頻出パターン（whyは省略されることも多い）。", "report: 「報道する」という他動詞。ここでは過去の否定形didn't reportで使われている。"], "vocabulary_notes": ["the reason why: 〜する理由。whyは省略可能。", "media: メディア、報道機関。集合的に使われることが多い名詞。"]}, "GP2-1": {"grammar_notes": ["a certain person: 「ある人」という不特定の人物を指す表現。certainは「ある特定の」という意味。", "keep bad company: 「悪い仲間とつきあう」という熟語表現。companyは「仲間、交際相手」の意味。", "said that 〜: that節を目的語にとる伝達動詞say（過去形said）。"], "vocabulary_notes": ["a certain 〜: ある〜（不特定の）。", "keep company with: 〜と付き合う。keep bad companyで「悪い仲間とつきあう」。"]}, "GP2-2": {"grammar_notes": ["I'm certain that 〜: 「〜だと確信している」。ここでのcertainは「確信して」という叙述用法の形容詞。", "GP2-1のa certain（限定用法・不特定）との意味・用法の違いに注意。", "be responsible for 〜: 「〜に責任がある」という熟語表現。"], "vocabulary_notes": ["certain: (叙述用法で)確信して。a certain(限定用法)とは意味が異なる。", "be responsible for: 〜に責任がある。"]}, "GP2-3": {"grammar_notes": ["present は名詞の前に置かれる限定用法で「現在の」という意味の形容詞。", "his present email address: 「彼の現在のメールアドレス」という所有格+形容詞+名詞の構造。", "GP2-4のpresent（出席して）との意味・用法の違いがこの2文のポイント。"], "vocabulary_notes": ["present (限定用法): 現在の。名詞の前に置く。", "email address: メールアドレス。"]}, "GP2-4": {"grammar_notes": ["present はbe動詞の補語として使われる叙述用法で「出席して」という意味の形容詞。", "if の代わりにwhetherが使われている（〜かどうか、という間接疑問）。", "GP2-3のpresent（現在の・限定用法）との対比がこの2文のポイント。"], "vocabulary_notes": ["present (叙述用法): 出席している。be present at 〜で「〜に出席している」。", "be present at: 〜に出席している。"]}, "GP2-5": {"grammar_notes": ["関係代名詞what（先行詞を含む関係代名詞、＝the thing which）が使われている。", "what it used to be: 「かつてのそれ（＝故郷の姿）」という定型表現。", "not what it used to be: 「かつての姿ではない」という変化を表す慣用表現。"], "vocabulary_notes": ["what S used to be: かつてのS（の姿）。", "hometown: 故郷、出身地。"]}, "GP2-6": {"grammar_notes": ["what is called 〜: 「いわゆる〜」という慣用表現（＝so-called）。関係代名詞whatを含む。", "この構文はwhat we[you/they] call 〜という形でも表される。", "bookworm: 「本の虫、読書家」という比喩的な名詞。"], "vocabulary_notes": ["what is called: いわゆる。＝so-called。", "bookworm: 本の虫（読書好きな人）。"]}, "GP2-7": {"grammar_notes": ["what is more: 「その上、さらに」という追加を表す挿入的な慣用表現。", "interesting, and what is more, original: 形容詞が2つ、挿入句を挟んで並列されている。", "この表現はmoreoverやfurthermoreとほぼ同じ働きをする。"], "vocabulary_notes": ["what is more: その上、さらに。＝moreover, furthermore。", "original: 独創的な、オリジナルの。"]}, "GP2-8": {"grammar_notes": ["連鎖関係詞節：the girl who I thought was Ann's sister。I thoughtが関係詞節に挿入されている。", "who は関係詞節内でwasの主語として働き、間にI thoughtが挿入された特殊な語順。", "turn out to be 〜: 「結局〜だとわかる」という結果を表す慣用表現。"], "vocabulary_notes": ["連鎖関係詞節: S+think(V)+関係詞...の形で挿入節が入る構造。", "turn out to be: 結局〜だとわかる、〜であることが判明する。"]}, "GP2-9": {"grammar_notes": ["the same 〜 as ...: 「…と同じ〜」という比較表現。asは関係代名詞的に働く。", "as you have は関係詞節に近い働きをし、dreamを先行詞のように修飾する。", "sameを修飾する場合、比較のasは関係代名詞に類似した機能を持つ点に注意。"], "vocabulary_notes": ["the same 〜 as ...: …と同じ〜。", "dream: 夢。ここでは抽象的な「目標・願望」の意味。"]}, "GP2-10": {"grammar_notes": ["as is often the case with A: 「Aにはよくあることだが」という挿入的な慣用表現。", "この as は関係代名詞的に働き、前の文の内容全体を受ける非制限用法に似た性質を持つ。", "fall asleep on 〜: 「〜の上で眠り込む」という表現（GP1参照のfall asleepと同じ熟語）。"], "vocabulary_notes": ["as is often the case with A: Aにはよくあることだが。", "fall asleep: 眠り込む、寝入る。"]}, "L7-1": {"grammar_notes": ["副詞slowlyとpolitelyがandで並列に結ばれ、動詞speaksを修飾している。", "speak to A: 「Aに話しかける」という句動詞（toは相手を表す）。", "host mother: 「ホームステイ先の母親」という複合名詞。"], "vocabulary_notes": ["host mother/father: ホームステイ先の母親・父親。", "politely: 丁寧に。politeの副詞形。"]}, "L7-2": {"grammar_notes": ["非制限用法の関係代名詞who（コンマ+who）。先行詞Joeに補足情報を加えている。", "moved to 〜 and found a job: 過去形の動詞が2つ、andで並列されている（主節の動詞）。", "この文はJoe who speaks Spanish（関係詞節）とmoved...found...（主節）の二重構造。"], "vocabulary_notes": ["move to: 〜に引っ越す。", "find a job: 仕事を見つける。findの過去形found。"]}, "L7-3": {"grammar_notes": ["almost all + 名詞: 「ほぼすべての〜」という数量を表す表現。almostはallを修飾する副詞。", "have to do: 「〜しなければならない」という義務を表すhave toの現在形。", "in Japan: 「日本の」。studentsを修飾する前置詞句（後置修飾）。"], "vocabulary_notes": ["almost all: ほぼすべての。almost every（単数扱い）との違いに注意。", "have to do: 〜しなければならない（客観的な必要性）。"]}, "L7-4": {"grammar_notes": ["助動詞willとcertainlyの組み合わせで「きっと〜するだろう」という強い確信を表す。", "a fluent speaker of 〜: 「〜を流暢に話す人」という名詞句（形容詞fluentが名詞speakerを修飾）。", "becomeの補語に名詞句（a fluent speaker of Chinese）が置かれている。"], "vocabulary_notes": ["fluent: 流暢な。a fluent speaker of 〜で「〜を流暢に話す人」。", "certainly: きっと、確実に。話者の強い確信を表す副詞。"]}, "L7-5": {"grammar_notes": ["部分否定：not all 〜「すべての〜が〜というわけではない」。all自体は否定されない点に注意。", "全体否定（no student）と部分否定（not all students）の違いがこの文の核心。", "take a test: 「試験を受ける」という表現。"], "vocabulary_notes": ["not all: すべてが〜というわけではない（部分否定）。", "take a test: 試験を受ける。"]}, "L7-6": {"grammar_notes": ["準否定語hardly: 「ほとんど〜ない」という程度の低さを表す副詞（notほど強くない否定）。", "could hardly do: 「ほとんど〜できなかった」という過去の能力の限界を表す。", "hardly, scarcely, rarely, seldomなどは準否定語としてまとめて覚える。"], "vocabulary_notes": ["hardly: ほとんど〜ない（準否定語）。notと違い一般動詞の前後に置く。", "understand: 理解する。過去形はunderstood。"]}, "L7-7": {"grammar_notes": ["unfortunatelyは文全体を修飾する副詞（文頭に置かれ、話者の感想を表す）。", "manyは「多くの」という数量形容詞で、可算名詞Hawaiiansを修飾。", "cannot do: 「〜できない」という能力の否定（本来話せるはずが話せない、という含意）。"], "vocabulary_notes": ["unfortunately: 残念ながら。文全体を修飾する副詞（文頭に置かれることが多い）。", "Hawaiian: ハワイの人、ハワイ語。文脈で名詞・形容詞どちらにもなる。"]}, "L7-8": {"grammar_notes": ["動名詞Masteringが文の主語になっている（動名詞主語の用法）。", "howeverは接続副詞で、前文との対比・逆接を表す（文頭に置きコンマで区切る）。", "not impossible: 「不可能ではない」という二重否定的な婉曲表現（実質的には可能性を示唆）。"], "vocabulary_notes": ["master: 習得する、マスターする。masteringで動名詞主語になる。", "however: しかしながら。butより硬い書き言葉的な逆接の副詞。"]}, "L8-1": {"grammar_notes": ["疑問詞whatで始まる疑問文。「何を〜すべきか」という助言・意見を求める表現。", "lead a 〜 life: 「〜な生活を送る」という熟語表現（leadは「送る、営む」の意味）。", "比較級happierとmore meaningfulがandで並列され、lifeを修飾している。"], "vocabulary_notes": ["lead a life: 生活を送る。lead a happy lifeなどの形で頻出。", "meaningful: 意味のある、充実した。meaning+fulの派生語。"]}, "L8-2": {"grammar_notes": ["I'm lucky to do: 「〜できて幸運だ」という感情の原因を表すto不定詞（副詞的用法）。", "have a friend like you: 「あなたのような友人を持つ」。likeは「〜のような」という前置詞。", "veryがluckyを強調する副詞として使われている。"], "vocabulary_notes": ["lucky to do: 〜できて幸運な。感情形容詞+to不定詞の典型パターン。", "like: 〜のような（前置詞）。動詞likeとの混同に注意。"]}, "L8-3": {"grammar_notes": ["関係代名詞whatが導く名詞節（What he said）が文の主語になっている。", "hard to believe: 「信じがたい」という形容詞+to不定詞の表現（tough構文的な用法）。", "この文はIt is hard to believe what he said.とほぼ同義の書き換えが可能。"], "vocabulary_notes": ["What S said: Sが言ったこと（関係代名詞whatの名詞節）。", "hard to believe: 信じがたい。"]}, "L8-4": {"grammar_notes": ["too 〜 to do: 「あまりに〜すぎて…できない」という結果を表す構文。", "この構文はso 〜 that S cannot ...に書き換えられる（The situation is so complicated that we can't explain it.）。", "complicated: 「複雑な」という形容詞。complicate（複雑にする）の過去分詞由来。"], "vocabulary_notes": ["too ... to do: あまりに…すぎて〜できない。", "complicated: 複雑な。simpleの反意語。"]}, "L8-5": {"grammar_notes": ["分詞構文（付帯状況）：feeling happy and satisfied が主節の動作に伴う様子を表す。", "分詞構文は「〜しながら」「そして〜だった」のように主節と同時進行の状況を付け加える。", "satisfiedは過去分詞由来の形容詞で「満足した」という感情を表す（受動的な意味）。"], "vocabulary_notes": ["feeling 〜: 〜を感じながら（分詞構文、付帯状況）。", "satisfied: 満足した。satisfy(満足させる)の過去分詞。"]}, "L8-6": {"grammar_notes": ["分詞構文（受動）：Being stressed outが文頭に置かれ、理由を表している（＝As I was stressed out）。", "受動態の分詞構文はBeing+過去分詞の形をとる（Beingは省略されることもある）。", "stressed out: 「ストレスがたまって」という熟語的な過去分詞形容詞。"], "vocabulary_notes": ["stressed out: ストレスがたまった状態。out は強調的に使われる副詞。", "分詞構文の意味上の主語は主節の主語（I）と一致する。"]}, "L8-7": {"grammar_notes": ["because of 〜: 「〜が理由で」という原因・理由を表す前置詞句（becauseと違い後ろは名詞）。", "popular around the world: 「世界中で人気の」という形容詞+場所を表す前置詞句。", "beautiful melody: 「美しいメロディー」という形容詞+名詞の基本構造。"], "vocabulary_notes": ["because of: 〜のために、〜が理由で（後ろは名詞・名詞句）。becauseとの違いに注意。", "melody: メロディー、旋律。"]}, "L8-8": {"grammar_notes": ["付帯状況のwith構文：with + 名詞 + 現在分詞。「〜が…している状態で」という同時状況を表す。", "with everybody watching me: 「みんなが私を見ている状態で」という背景・理由を表す。", "so + 形容詞: 「とても〜」という程度を強調する副詞so。"], "vocabulary_notes": ["with + O + Ving: Oが〜している状態で（付帯状況構文）。", "nervous: 緊張した。with everybody watching me（理由）と合わせて覚える。"]}, "L9-1": {"grammar_notes": ["接続詞whenが導く副詞節。「〜するとき」という時を表す条件節。", "feel distracted: 「気が散っていると感じる」。feel+形容詞の第2文型的な表現。", "should + 原形: 「〜するとよい」という助言・提案を表す助動詞。"], "vocabulary_notes": ["distracted: 気が散った。distract(気を散らす)の過去分詞由来の形容詞。", "take a deep breath: 深呼吸する。breathは名詞「息」。"]}, "L9-2": {"grammar_notes": ["接続詞beforeが導く副詞節。「〜する前に」という時の前後関係を表す。", "命令文（Think twice）が主節として使われ、助言・忠告を表している。", "think twice: 「よく考える」という熟語（直訳「2回考える」→慎重に考える）。"], "vocabulary_notes": ["think twice: よく考える、熟考する。", "before: 〜する前に（接続詞）。前置詞としても使われる多義語。"]}, "L9-3": {"grammar_notes": ["接続詞becauseが導く副詞節。「〜だから」という理由を表す。", "respect: 「〜を尊敬する」という他動詞。ここでは受動態（is respected相当だがEveryoneが主語のため能動）。", "always: 「いつも」という頻度の副詞がhardworkingを修飾している。"], "vocabulary_notes": ["respect: 尊敬する。名詞としても同形（尊敬、敬意）。", "hardworking: 勤勉な、よく働く。hard+workingの複合形容詞。"]}, "L9-4": {"grammar_notes": ["接続詞ifが導く条件節。「もし〜ならば」という現実的な条件を表す（仮定法ではない直説法）。", "want to be 〜: 「〜になりたい」というbe動詞の補語を伴う不定詞。", "must + 原形: 「〜しなければならない」という必要性を表す助動詞。"], "vocabulary_notes": ["realize: 実現する、（夢を）叶える。「気づく」の意味もあるが、ここでは「実現する」。", "successful: 成功した。success(名詞)の形容詞形。"]}, "L9-5": {"grammar_notes": ["接続詞Althoughが導く副詞節。「〜だけれども」という譲歩を表す（Thoughよりやや硬い）。", "lack: 「〜を欠いている」という他動詞。名詞としても同形で使われる。", "the right personality for 〜: 「〜にふさわしい性格」というforが対象を表す用法。"], "vocabulary_notes": ["lack: 欠いている、不足している（他動詞）。", "personality: 性格、人格。characterと類義だが個性・性格の側面を強調。"]}, "L9-6": {"grammar_notes": ["複合関係代名詞whatever: 「何が〜しようとも」という譲歩を表す副詞節を導く。", "give up Ving: 「〜することをやめる」という動名詞を目的語にとる表現（GP1-10参照）。", "pursue: 「〜を追求する」という他動詞。goalと結びつき目標達成への努力を表す。"], "vocabulary_notes": ["whatever: 何が〜しようとも（複合関係代名詞、譲歩節を導く）。", "pursue a goal: 目標を追求する。pursueは「追い求める」という意味。"]}, "L9-7": {"grammar_notes": ["so that S can[will] do: 「Sが〜できるように」という目的を表す構文。", "keep a diary: 「日記をつける」という熟語表現。", "reflect upon[on] 〜: 「〜を振り返る、熟考する」という句動詞。"], "vocabulary_notes": ["so that S can do: Sが〜できるように（目的）。", "reflect on/upon: 〜を振り返る、熟考する。"]}, "L9-8": {"grammar_notes": ["so 〜 that ...: 「とても〜なので…」という結果を表す構文（GP1回・L8-4のtoo...to構文との書き換え関係）。", "innovative: 「革新的な」という形容詞。innovation（革新）から派生。", "misunderstand: 「〜を誤解する」という他動詞。understandに否定接頭辞misが付いた形。"], "vocabulary_notes": ["so ... that ~: とても…なので〜。結果を表す構文。", "innovative: 革新的な。misunderstand: 誤解する。"]}, "GP3-1": {"grammar_notes": ["and, too: 文末のtooは「〜も」という追加を表す副詞（肯定文で使う。alsoより口語的）。", "I'd like 〜: I would likeの短縮形で「〜が欲しい」という丁寧な依頼・希望表現。", "French friesはアメリカ英語で「フライドポテト」を意味する複合名詞（複数形扱い）。"], "vocabulary_notes": ["I'd like: I would likeの短縮。〜が欲しいです（丁寧な表現）。", "too: 〜も（肯定文の文末で使う）。"]}, "GP3-2": {"grammar_notes": ["否定文の付加：..., and 主語+don't[doesn't] either. 「〜もまた…ない」という否定の同意表現。", "eitherは否定文で使われる「〜も（ない）」という副詞（肯定文のtooと対）。", "green pepper: 「ピーマン」。greenは色の形容詞、pepperは「トウガラシ類」を指す名詞。"], "vocabulary_notes": ["either: 〜も（ない）。否定文の文末で使う（tooの否定版）。", "green pepper: ピーマン。"]}, "GP3-3": {"grammar_notes": ["Me neither.: 「私も〜ない」という、否定文への同意を表す口語的な応答表現。", "neitherは「〜もまた…ない」という意味で、否定の同意を簡潔に表す（Neither have I.の口語省略形）。", "肯定文への同意はMe too.、否定文への同意はMe neither.という対応関係を覚える。"], "vocabulary_notes": ["Me neither.: 私も〜ない（否定文への同意）。⇔ Me too.（肯定文への同意）", "yet: まだ（否定文で「まだ〜ない」の意味）。"]}, "GP3-4": {"grammar_notes": ["分詞構文の否定形：Not + Ving, S+V。notは分詞の直前に置く（分詞構文全体を否定）。", "Not realizing the time = As she did not realize the time（理由を表す分詞構文）。", "be late for 〜: 「〜に遅れる」という熟語表現。"], "vocabulary_notes": ["Not Ving, ...: 〜しないので（分詞構文の否定、notは分詞の前）。", "be late for: 〜に遅れる。"]}, "GP3-5": {"grammar_notes": ["完了形の分詞構文：Not having + 過去分詞。主節の時よりも前の時制であることを示す。", "Not having eaten breakfast = As she had not eaten breakfast（過去完了相当の意味）。", "この構文は「先に起きたことが原因で後の結果が生じた」という時間差のある因果関係を表す。"], "vocabulary_notes": ["Not having done: 〜しなかったので（完了形の分詞構文の否定）。", "get hungry: お腹が空く。get+形容詞で状態変化を表す。"]}, "GP3-6": {"grammar_notes": ["独立分詞構文：意味上の主語（The deadline）が分詞の前に明示される特殊な分詞構文。", "通常の分詞構文は主節と主語が一致するが、独立分詞構文では主語が異なるため明示が必要。", "approach: 「近づく」という自動詞。ここでは現在分詞approachingとして分詞構文を作る。"], "vocabulary_notes": ["独立分詞構文: 意味上の主語が主節と異なる場合、分詞の前にその主語を置く。", "deadline: 締め切り。approach: 近づく。"]}, "GP3-7": {"grammar_notes": ["be to構文（予定）：「〜することになっている」という公式な予定を表す。", "この構文は他にも義務（must相当）・可能（canの受身相当）・運命など複数の意味を持つ。", "meet: 「〜と会談する」という他動詞。ここでは公式な会合を意味する。"], "vocabulary_notes": ["be to do (予定): 〜することになっている。公式な予定・スケジュールを表す。", "the U.S. President: アメリカ大統領。"]}, "GP3-8": {"grammar_notes": ["be to構文（義務）：「〜されるべきだ」というmust/shouldに近い義務を表す（ここでは受動態be to be taken）。", "be to構文が受動態と組み合わさりis to be taken（服用されるべきだ）となっている。", "after each meal: 「毎食後に」という頻度・タイミングを表す前置詞句。"], "vocabulary_notes": ["be to do (義務): 〜すべきである。指示・規則を表す文脈で使われる。", "medicine: 薬。take medicineで「薬を飲む」という動詞との組み合わせ。"]}, "GP3-9": {"grammar_notes": ["be to構文（可能）：「〜されることができる」という可能性を表す（ここでは否定でnowhereと共起）。", "nowhere to be found: 「どこにも見つからない」という慣用的な表現（be動詞+to不定詞の受動）。", "この構文はcannot be foundとほぼ同じ意味を表す。"], "vocabulary_notes": ["be to do (可能): 〜されうる。多くの場合否定文で使われる。", "nowhere: どこにも〜ない。場所を表す否定の副詞。"]}, "L10-1": {"grammar_notes": ["同等比較：as + 形容詞/副詞 + as 〜。「〜と同じくらい…」という同程度を表す比較表現。", "that of Germany: thatは前出の名詞（the area）の反復を避ける代名詞（＝the area of Germany）。", "almost: 「ほぼ」という程度を弱める副詞。as largeを修飾している。"], "vocabulary_notes": ["as ... as ~: ~と同じくらい…（同等比較）。", "that of 〜: 〜のそれ（前出名詞の反復を避ける代名詞that）。"]}, "L10-2": {"grammar_notes": ["倍数表現：twice as 〜 as ...。「…の2倍〜」という倍数を表す比較表現。", "the number of 〜: 「〜の数」という主語を作る表現（数そのものに焦点）。", "that of 10 years ago: 「10年前のそれ（＝数）」という省略された比較対象。"], "vocabulary_notes": ["twice as ... as ~: ~の2倍…。3倍はthree times as ... as。", "inbound tourist: 訪日外国人観光客。inboundは「入ってくる、訪日の」という意味。"]}, "L10-3": {"grammar_notes": ["比較級better than 〜: 「〜より良い」という優劣を表す基本の比較級構文。", "like A better than B: 「BよりAが好きだ」という好みを表す典型パターン。", "green tea / black tea: 「緑茶」「紅茶」という日本文化と西洋文化の対比語彙。"], "vocabulary_notes": ["like A better than B: BよりAが好き。", "green tea: 緑茶。black tea: 紅茶。"]}, "L10-4": {"grammar_notes": ["比較級の強調：much + 比較級。muchは比較級を強調する副詞（veryは使えない点に注意）。", "more eco-friendly than 〜: 「〜よりエコな」という3音節以上の形容詞のmore型比較級。", "eco-friendly: 「環境に優しい」という複合形容詞（eco+friendly）。"], "vocabulary_notes": ["much + 比較級: はるかに〜。比較級の強調にはmuch, far, evenなどを使う。", "eco-friendly: 環境に優しい。"]}, "L10-5": {"grammar_notes": ["最上級：the most popular 〜。3音節以上の形容詞はmost型の最上級を使う。", "or: ここでは「つまり、すなわち」という言い換えを表す等位接続詞（＝that is）。", "deep-fried: 「油で揚げた」という過去分詞由来の複合形容詞。"], "vocabulary_notes": ["or: つまり、すなわち（言い換えのor）。", "deep-fried: 油で揚げた。tonkatsu, or deep-fried porkのように同格的に使われる。"]}, "L10-6": {"grammar_notes": ["one of the 最上級 + 複数名詞: 「最も〜な…の一つ」という頻出パターン（GP2-6参照の構文に類似）。", "healthiest: healthy（y語尾）の最上級はyをiに変えてestを付ける（healthiest）。", "in the world: 「世界で」という比較の範囲を示す前置詞句。"], "vocabulary_notes": ["one of the ~est + 複数名詞: 最も〜な…の一つ。", "washoku: 和食。日本文化語彙として英語にもそのまま定着している。"]}, "L10-7": {"grammar_notes": ["最上級相当表現：No other 〜 ... 比較級 than A。「Aより〜な他の…はない」＝Aが最上級であることを表す。", "この構文はMt. Fuji is the highest mountain in Japan.と同じ意味を、比較級を使って表す高度な表現。", "no other: 「他のどの〜も…ない」という全否定を表す表現。"], "vocabulary_notes": ["No other 〜 ... 比較級 than A: Aより〜な他の…はない（最上級の書き換え表現）。", "mountain: 山。Mt. Fuji=富士山。"]}, "L10-8": {"grammar_notes": ["比較級の反復：more and more 〜。「ますます多くの〜」という変化の進行を表す表現。", "be interested in 〜: 「〜に興味がある」という熟語表現（受動態由来の形容詞用法）。", "traditional culture: 「伝統文化」という形容詞+名詞の基本構造。"], "vocabulary_notes": ["more and more: ますます多くの。比較級を繰り返して変化・増加を強調。", "be interested in: 〜に興味がある。"]}, "L11-1": {"grammar_notes": ["仮定法過去：If S+過去形, S+would+原形。「もし〜なら…なのに」という現在の事実に反する仮定。", "if節の動詞は過去形（had）だが、意味は現在のことを表す点が仮定法の核心。", "look up 〜 online: 「〜をオンラインで調べる」という句動詞+副詞句。"], "vocabulary_notes": ["仮定法過去: 現在の事実に反する仮定。if節は過去形、主節はwould/could/might+原形。", "look up: （辞書やネットで）調べる。"]}, "L11-2": {"grammar_notes": ["仮定法過去が疑問文の中に組み込まれた形：Do you think it would be great if 〜。", "if AI could do: 「もしAIが〜できたら」という現在の事実に反する仮定を表すif節。", "do all our work for us: 「私たちのために全ての仕事をする」という熟語的表現。"], "vocabulary_notes": ["仮定法過去(疑問文): 現在の事実に反する仮定を尋ねる形。", "do work for A: Aのために仕事をする。"]}, "L11-3": {"grammar_notes": ["仮定法過去完了：If S+had+過去分詞, S+could have+過去分詞。「もし〜だったら…できたのに」という過去の事実に反する仮定。", "if節（had used）と主節（could have finished）の両方が過去の事柄を指す点が仮定法過去との違い。", "sooner: soon（早く）の比較級。「もっと早く」という程度を表す。"], "vocabulary_notes": ["仮定法過去完了: 過去の事実に反する仮定。if節はhad+過去分詞、主節はwould/could have+過去分詞。", "sooner: もっと早く（soonの比較級）。"]}, "L11-4": {"grammar_notes": ["仮定法過去完了：If nuclear weapons had not been developed, ...。ifの中が受動態の過去完了になっている。", "would be（原形のbe）: 主節がwould+原形になっている点に注意（would have beenではない＝「今頃は」という現在への帰結）。", "この文は「過去の事実に反する仮定」＋「現在の結果」という混合型の仮定法（過去完了if＋現在への帰結）。"], "vocabulary_notes": ["混合仮定法: if節は過去完了（過去の事実に反する）、主節は過去形（現在への帰結）。", "nuclear weapon: 核兵器。develop: 開発する。"]}, "L11-5": {"grammar_notes": ["I wish + 仮定法過去: 「〜であればいいのに」という現在の事実に反する願望を表す。", "wishの後は過去形（had）が続くが、意味は現在の願望を表す点がifと同じ発想。", "right now: 「今すぐに」という強調的な時を表す副詞句。"], "vocabulary_notes": ["I wish + 仮定法過去: 〜であればいいのに（現在の事実に反する願望）。", "global warming: 地球温暖化。stop 〜で「〜を止める」。"]}, "L11-6": {"grammar_notes": ["I wish + 仮定法過去完了: 「〜だったらよかったのに」という過去の事実に反する後悔を表す。", "had had: haveの過去完了形（have-had-had）。同じ単語が連続する点に注意。", "when I was young: 「若い頃」という過去の時点を明示する副詞節。"], "vocabulary_notes": ["I wish + 仮定法過去完了: 〜だったらよかったのに（過去への後悔）。", "vision for the future: 将来への展望・ビジョン。"]}, "L11-7": {"grammar_notes": ["It's time (that) S+過去形: 「もう〜する時間だ」という、すべきなのにまだしていないことへの言及。", "この過去形は仮定法過去の一種で、実際には過去の意味ではなく「今すぐにでも」という含意を持つ。", "think globally and act locally: 「地球規模で考え、地域に根ざして行動する」という有名な標語的表現。"], "vocabulary_notes": ["It's time S+過去形: もう〜する時間だ（仮定法的用法）。", "globally / locally: 地球規模で／地域的に。副詞のペアで対比。"]}, "L11-8": {"grammar_notes": ["仮定法のwithout: 「〜がなければ」という条件を表す（＝if it were not for 〜）。", "What would S be like: 「Sはどのようなものだろうか」という様子を尋ねる仮定法の疑問文。", "without smartphones が実質的にif節の役割を果たしている点が重要。"], "vocabulary_notes": ["without: もし〜がなければ（仮定法のif節の代用）。", "What would S be like?: Sはどのようなものだろうか。"]}, "L12-1": {"grammar_notes": ["提案・要求・命令のthat節：insist that S+（should）+原形。動詞insistの後のthat節は原形（仮定法現在）を使う。", "この用法はinsist, suggest, demand, request, orderなどの動詞で共通するルール。", "take action: 「行動を起こす」という熟語表現。"], "vocabulary_notes": ["提案・要求のthat節: S+(should)+原形。insist, suggestなどの後で使う特殊なルール。", "take action: 行動を起こす。promote: 促進する。"]}, "L12-2": {"grammar_notes": ["重要性を表す形容詞のthat節：It's important that S+（should）+原形。仮定法現在のもう一つの典型パターン。", "important, necessary, essentialなどの評価形容詞の後のthat節でも同じルールが適用される。", "religious beliefs: 「宗教的信念」という形容詞+名詞の組み合わせ。"], "vocabulary_notes": ["It's important that S+(should)+原形: 〜することが重要だ（仮定法現在）。", "religious belief: 宗教的信念。"]}, "L12-3": {"grammar_notes": ["think that 〜: 「〜だと思う」という意見を表す一般的なthat節（L12-1, 12-2とは異なり、こちらは直説法）。", "in order to do: 「〜するために」という目的を強調するto不定詞の表現。", "avoid: 「〜を避ける」という他動詞。動名詞を目的語にとる動詞としても重要。"], "vocabulary_notes": ["in order to do: 〜するために（目的を明確にする表現）。", "conflict: 対立、衝突。avoid conflictsで「対立を避ける」。"]}, "L12-4": {"grammar_notes": ["時制の一致：It seemed that S had+過去分詞。主節が過去形の場合、that節はさらに過去の過去完了になる。", "It seems that 〜（現在）がIt seemed that S had done（過去）に変化する時制の一致の典型例。", "from abroad: 「海外からの」という前置詞句がstudentsを後置修飾している。"], "vocabulary_notes": ["時制の一致: 主節が過去形のとき、that節も一つ過去にずれる（had+過去分詞など）。", "from abroad: 海外から（の）。"]}, "L12-5": {"grammar_notes": ["直接話法：said to 人, '発言内容'。発言をそのままかぎ括弧で引用する話法。", "この文はL12-6の間接話法（told 人 that ...）と対になっている（話法の書き換え）。", "an article on 〜: 「〜に関する記事」というonが話題を表す前置詞として使われている。"], "vocabulary_notes": ["直接話法: 発言をそのまま引用符で示す。say to 人, '〜'の形。", "diversity: 多様性。article on diversity=多様性に関する記事。"]}, "L12-6": {"grammar_notes": ["間接話法：told 人 that S had+過去分詞。直接話法から間接話法への書き換えで時制・人称・時の表現が変化する。", "L12-5のyesterday（昨日）がL12-6ではthe day before（その前日）に変化している点が話法変換の重要ポイント。", "sheの人称・時制が話者視点に合わせて変わる（sayからtellへの動詞変化も重要）。"], "vocabulary_notes": ["間接話法: 発言内容をthat節で伝える。tell 人 that S+Vの形。", "the day before: その前日（yesterdayの話法変換形）。"]}, "L12-7": {"grammar_notes": ["強調構文：It was not until A that S+V。「Aして初めて〜した」という時を強調する構文。", "not until A: 「Aするまで〜ない」＝「Aして初めて」という意味の重要表現。", "この構文は元の文Not until recently did I realize...の書き換えとしても理解できる。"], "vocabulary_notes": ["It is not until A that S+V: Aして初めて〜する（強調構文）。", "social welfare: 社会福祉。realize: 認識する、悟る。"]}, "L12-8": {"grammar_notes": ["It won't be long before S+V: 「間もなく〜するだろう」という近い未来を表す慣用表現。", "beforeは「〜する前に」という接続詞だが、この構文では「間もなく」という時間の近さを表す。", "start a program: 「プログラムを開始する」という表現。"], "vocabulary_notes": ["It won't be long before S+V: 間もなく〜するだろう。", "diversity program: 多様性推進プログラム。"]}, "GP4-1": {"grammar_notes": ["all the more 〜 for ...: 「…のためにいっそう〜」という理由による程度の強調表現。", "forはここで理由を表す前置詞として使われている（becauseに近い意味）。", "huge cost: 「莫大な費用」というhugeが強調する名詞句。"], "vocabulary_notes": ["all the more 〜 for ...: …のためにいっそう〜。forは理由を表す。", "huge: 巨大な、莫大な。"]}, "GP4-2": {"grammar_notes": ["more A than B: 「BというよりむしろA」という性質の比較を表す表現（AとBは同じ人・物についての形容詞）。", "この構文は程度の比較ではなく、2つの性質のどちらがより当てはまるかを表す点が特殊。", "disappointed / angry: どちらも感情を表す過去分詞由来の形容詞。"], "vocabulary_notes": ["more A than B (性質の対比): BというよりむしろA。", "disappointed: 落胆した。"]}, "GP4-3": {"grammar_notes": ["no more than 〜: 「わずか〜しかない」という少なさを強調する表現（＝only）。", "not more than（〜以下）との意味の違いに注意（no more thanは主観的に「少ない」と評価）。", "It takes 時間 from A to B: 「AからBまで（時間が）かかる」という所要時間を表す構文。"], "vocabulary_notes": ["no more than: わずか〜しかない（少なさの強調、＝only）。", "It takes 時間: （時間が）かかる。"]}, "GP4-4": {"grammar_notes": ["no less than 〜: 「〜も（多く）」という多さを強調する表現（＝as much/many as）。", "not less than（〜以上）との意味の違いに注意（no less thanは主観的に「多い」と評価）。", "as a New Year's gift: 「お年玉として」という前置詞asが「〜として」の役割を果たす。"], "vocabulary_notes": ["no less than: 〜も（多さの強調、＝as much/many as）。", "New Year's gift: お年玉、正月の贈り物。"]}, "GP4-5": {"grammar_notes": ["much less 〜: 「まして〜ない」という否定文に続けて、より程度の強いことを否定する表現。", "この構文は必ず前に否定文が来て、much lessの後にはさらに困難・大きな事柄が続く。", "afford: 「〜する余裕がある」という他動詞（金銭的・時間的余裕を表す）。"], "vocabulary_notes": ["much less: まして〜ない。否定文の後に続けて使う。", "afford: 〜の余裕がある。can't affordで「〜を買う余裕がない」。"]}, "GP4-6": {"grammar_notes": ["at best: 「よくても、せいぜい」という最大限の評価を表す副詞句。", "second-rate: 「二流の」という複合形容詞（rate=等級、second=第二の）。", "この表現はfirst-rate（一流の）と対比して覚えると理解しやすい。"], "vocabulary_notes": ["at best: よくても、せいぜい。", "second-rate: 二流の。first-rate(一流の)との対比で覚える。"]}, "GP4-7": {"grammar_notes": ["at one's best: 「最盛期に、絶好調で」という慣用表現（GP4-6のat bestとは意味が異なる点に注意）。", "at bestとat one's bestの違い：前者は「せいぜい」、後者は所有格を伴い「全盛期に」。", "in the 1990s: 「1990年代に」という年代を表す前置詞句（数字+sで年代を表す）。"], "vocabulary_notes": ["at one's best: 全盛期に、絶好調で。at best（せいぜい）との違いに注意。", "film director: 映画監督。"]}, "GP4-8": {"grammar_notes": ["仮定法未来：If S were to do, S+would+原形。実現可能性が非常に低い、または純粋に仮定的な未来を表す。", "were toはあらゆる人称でwereを使う（仮定法特有の語法）。", "a million dollars: 「100万ドル」という具体的な金額を表す数詞+単位。"], "vocabulary_notes": ["If S were to do: もし（万一）〜するとしたら（仮定法未来、実現可能性の低い仮定）。", "receive: 受け取る。"]}, "GP4-9": {"grammar_notes": ["仮定法未来：If S should do, ...。GP4-8のwere toより実現可能性がやや高い、起こるかもしれない仮定を表す。", "shouldを使う仮定法未来は主節に命令文や助動詞現在形が使われることが多い（過去形のwouldに限らない）。", "この文の主節Please call meは命令文であり、仮定法特有の帰結節ではない点が特徴的。"], "vocabulary_notes": ["If S should do: もし（万一）〜したら（仮定法未来、should使用）。", "miss the train: 電車に乗り遅れる。"]}, "GP4-10": {"grammar_notes": ["倒置による仮定法：Were it not for 〜, ...（＝If it were not for 〜）。ifを省略しwereを主語の前に出す倒置形。", "it were not for 〜: 「〜がなければ」という仮定法過去の重要表現（現在の事実に反する仮定）。", "lose their habitat: 「生息地を失う」というhabitat（生息地）を目的語にとる表現。"], "vocabulary_notes": ["Were it not for 〜: 〜がなければ（If it were not forの倒置形）。", "habitat: 生息地。"]}, "GP4-11": {"grammar_notes": ["倒置による仮定法過去完了：Had I studied 〜（＝If I had studied 〜）。ifを省略しhadを主語の前に出す倒置形。", "この倒置はifを使う仮定法過去完了と全く同じ意味を持ち、書き言葉でよく使われるやや硬い表現。", "better enjoy: 「より一層楽しむ」というbetterが動詞enjoyを修飾する副詞的用法。"], "vocabulary_notes": ["Had S+過去分詞: もし〜だったら（If S had+過去分詞の倒置形）。", "Japanese history: 日本史。tour of Kyoto: 京都観光。"]}, "GP4-12": {"grammar_notes": ["every time S+V: 「〜するたびに」という接続詞的に働く名詞句（wheneverに近い意味）。", "be moved to tears: 「感動して涙を流す」という受動態の慣用表現（moveは「感動させる」という他動詞）。", "remember: 「〜を思い出す」という他動詞。grandmotherを目的語にとる。"], "vocabulary_notes": ["every time S+V: 〜するたびに（接続詞的な名詞句）。", "be moved to tears: 感動して涙を流す。"]}, "GP4-13": {"grammar_notes": ["hardly ... when〜: 「…するとすぐに〜した」という、ほぼ同時に起きた出来事を表す構文。", "主節に過去完了（had hardly gotten）、when節に過去形（closed）を使うのが典型パターン。", "この構文はNo sooner had S+過去分詞 than S+過去形と書き換えられる（倒置形も重要）。"], "vocabulary_notes": ["hardly ... when ~: …するとすぐに〜した。主節は過去完了、when節は過去形。", "get on: （電車などに）乗る。"]}, "L13-1": {"grammar_notes": ["There are + 複数名詞: 「〜がある」という存在文の複数形バージョン。", "more than 〜: 「〜以上」という数量を表す表現（overとほぼ同義）。", "World Heritage Site: 「世界遺産」という複合名詞（Site=場所、遺産登録地）。"], "vocabulary_notes": ["more than: 〜以上、〜より多い。", "World Heritage Site: 世界遺産（登録地）。"]}, "L13-2": {"grammar_notes": ["We have 〜: haveを使った存在・所有の表現（There are 〜の書き換えとしても機能する）。", "several: 「いくつかの」という数量形容詞（3つ以上、多くはない数を表す）。", "marvelous: 「素晴らしい」という強い賞賛を表す形容詞。"], "vocabulary_notes": ["several: いくつかの（3つ以上の複数）。", "marvelous: 素晴らしい、驚くべき。"]}, "L13-3": {"grammar_notes": ["get + 形容詞: 「〜になる」という状態変化を表す（become, getの使い分けに注意）。", "along the beach: 「海岸沿いの」という前置詞句がroadを後置修飾している。", "always: 頻度を表す副詞で、習慣的な事実（現在形）と共に使われている。"], "vocabulary_notes": ["get crowded: 混雑する。get+形容詞で状態変化を表す。", "along: 〜に沿って。along the beach=海岸沿いに。"]}, "L13-4": {"grammar_notes": ["became famous because 〜: 「〜という理由で有名になった」という因果関係を表す文構造。", "appear in 〜: 「〜に登場する、出てくる」という句動詞。", "popular Japanese anime: 「人気の日本アニメ」という形容詞が連続して名詞を修飾する構造。"], "vocabulary_notes": ["appear in: 〜に登場する、出てくる。", "anime: アニメ。日本文化語彙として英語に定着している。"]}, "L13-5": {"grammar_notes": ["It takes 時間 to do: 「〜するのに（時間が）かかる」という所要時間を表す形式主語構文。", "この構文はGP4-3のIt takes 時間 from A to Bと同系統の表現（fromAtoBの部分がto doに置き換わる）。", "drive from A to B: 「AからBまで運転する」という移動手段を表す動詞句。"], "vocabulary_notes": ["It takes 時間 to do: 〜するのに（時間が）かかる。", "drive from A to B: AからBまで車で行く。"]}, "L13-6": {"grammar_notes": ["I guess (that) 〜: 「〜だと思う」という控えめな推量を表す口語的表現。", "It will cost 金額 to do: 「〜するのに（費用が）かかるだろう」という所要費用を表す構文（costはtakeの費用版）。", "less than 〜: 「〜未満」という数量の上限を表す表現。"], "vocabulary_notes": ["cost: （費用が）かかる。It costs 金額 to doの形。", "less than: 〜未満、〜より少ない。"]}, "L13-7": {"grammar_notes": ["come to do: 「〜するようになる」という変化・過程を表す不定詞の用法。", "この構文はbecomeよりも「徐々にそうなっていく」という過程のニュアンスが強い。", "uniqueness: 「独自性、独特さ」という抽象名詞（unique+ness）。"], "vocabulary_notes": ["come to do: 〜するようになる（徐々にそうなる過程）。", "uniqueness: 独自性。uniqueの名詞形。"]}, "L13-8": {"grammar_notes": ["begin to do: 「〜し始める」という開始を表す不定詞（begin Vingとほぼ同義）。", "in the late 1990s: 「1990年代後半に」という年代の中の時期を細かく表す表現。", "the number of tourists: 「観光客の数」という主語を作る表現（L10-2のthe number ofと同じ用法）。"], "vocabulary_notes": ["in the late 1990s: 1990年代後半に。early/mid/lateで年代の時期を細分化。", "increase: 増加する（自動詞）。反意語はdecrease。"]}, "L14-1": {"grammar_notes": ["使役動詞make + O + 原形: 「Oに（強制的に）〜させる」という強い使役を表す。", "restは自動詞「休む」で、原形不定詞として使われている（toは付けない）。", "for several days: 「数日間」という期間を表す前置詞句（forは継続期間を表す）。"], "vocabulary_notes": ["make + O + 原形: Oに〜させる（強制的な使役）。", "rest: 休む（自動詞）。名詞としても同形。"]}, "L14-2": {"grammar_notes": ["使役動詞let + O + 原形: 「Oが〜するのを許す」という許可を表す使役（makeより強制力が弱い）。", "この文は否定形（didn't let）で「〜させなかった」という許可しなかったことを表す。", "without Ving: 「〜せずに」という否定的な付帯状況を表す前置詞句。"], "vocabulary_notes": ["let + O + 原形: Oが〜するのを許す（許可の使役）。", "without Ving: 〜せずに。"]}, "L14-3": {"grammar_notes": ["使役動詞get + O + to do: 「Oに〜させる、してもらう」という説得を伴う使役（原形ではなくto不定詞を使う点がmake/letと異なる）。", "get, make, letの使役動詞の後の形（get はto do、make/letは原形）の違いがこのレッスンの核心。", "go for a medical checkup: 「健康診断を受けに行く」という熟語表現。"], "vocabulary_notes": ["get + O + to do: Oに〜させる、してもらう（説得的な使役、to不定詞を使う）。", "medical checkup: 健康診断。"]}, "L14-4": {"grammar_notes": ["allow + O + to do: 「Oが〜することを許可する」という許可を表す動詞（letのフォーマル版）。", "allowはlet+O+原形とほぼ同じ意味だが、to不定詞を使う点と、よりフォーマルな響きを持つ点が異なる。", "for free: 「無料で」という熟語表現（forは代償・対価を表す前置詞）。"], "vocabulary_notes": ["allow + O + to do: Oが〜することを許可する。", "for free: 無料で。＝for nothing, free of charge。"]}, "L14-5": {"grammar_notes": ["使役動詞have + O + Ving: 「Oに〜させておく（させたままにする）」という状態の持続を表す使役。", "have + O + 原形（してもらう）と have + O + Ving（させたままにする）の意味の違いに注意。", "though: 「〜だけれども」という譲歩の接続詞（Althoughよりやや口語的）。"], "vocabulary_notes": ["have + O + Ving: Oに〜させておく（状態の持続、しばしば迷惑な意味合い）。", "appointment: 予約、約束。"]}, "L14-6": {"grammar_notes": ["使役動詞have + O + 過去分詞: 「Oを〜してもらう」という受動的な使役（Oが動作を受ける）。", "haveの後の目的語（his temperature and blood pressure）が「される側」であることを示す過去分詞checked。", "この構文はhave + O + Ving（させておく）、have + O + 原形（してもらう＝O自身が行う）との使い分けが重要。"], "vocabulary_notes": ["have + O + 過去分詞: Oを〜してもらう（受動的な使役、Oは動作を受ける側）。", "blood pressure: 血圧。temperature: 体温。"]}, "L14-7": {"grammar_notes": ["知覚動詞hear + O + 原形: 「Oが〜するのを聞く」という一部始終・完結した動作を表す知覚動詞構文。", "知覚動詞（see, hear, feelなど）+O+原形は、O+Ving（進行中）との使い分けが重要。", "life expectancy: 「平均寿命」という統計用語的な複合名詞。"], "vocabulary_notes": ["知覚動詞 + O + 原形: Oが〜するのを聞く・見る（一部始終、完結した動作）。", "life expectancy: 平均寿命。"]}, "L14-8": {"grammar_notes": ["知覚動詞see + O + Ving: 「Oが〜しているのを見る」という進行中の動作を表す知覚動詞構文。", "L14-7のhear+O+原形（完結した動作）とL14-8のsee+O+Ving（進行中の動作）の対比が重要。", "この文はI saw people who were jogging.とほぼ同義に書き換えられる。"], "vocabulary_notes": ["知覚動詞 + O + Ving: Oが〜しているのを見る（進行中の動作）。", "jog: ジョギングする。go jogging（L1-1）との関連。"]}, "L15-1": {"grammar_notes": ["few + 可算名詞複数形: 「ほとんど〜ない」という否定的な意味を持つ数量形容詞（a fewとの違いに注意）。", "この文は主語がfewを含むため、実質的に否定文の意味を持つ（Almost no researchers noticed...）。", "notice: 「〜に気づく」という他動詞。findと違い、意図せず目にとまる意味合いが強い。"], "vocabulary_notes": ["few + 複数名詞: ほとんど〜ない（否定的）。a few（少しはある、肯定的）との対比。", "notice: 気づく。"]}, "L15-2": {"grammar_notes": ["no + 名詞: 「どの〜も…ない」という全否定を表す限定詞（not anyとほぼ同義だがより強調的）。", "should have to do: 「〜しなければならないはずだ」というshouldとhave toが組み合わさった表現。", "experience hunger: 「飢えを経験する」というexperienceを他動詞として使う表現。"], "vocabulary_notes": ["no + 名詞: どの〜も…ない（全否定）。", "hunger: 飢え、空腹（不可算名詞）。experience hunger=飢えを経験する。"]}, "L15-3": {"grammar_notes": ["動名詞主語＋make+O+C（SVOC）: Reducing inequalityが主語、makeがV、the worldがO、a better placeがCの構造。", "make + O + C: 「OをCにする」という無生物主語構文の典型パターン。", "to live: 「住むための」という不定詞がplaceを修飾する形容詞的用法。"], "vocabulary_notes": ["動名詞主語 + make + O + C: 〜することがOをCにする（無生物主語構文）。", "inequality: 不平等。reduceの目的語。"]}, "L15-4": {"grammar_notes": ["無生物主語 + help + O + 原形: 「〜がOが…するのを助ける」という無生物主語構文（toは省略可能）。", "access to 〜: 「〜へのアクセス、利用機会」というaccessが名詞として使われる表現。", "have a brighter future: 「より明るい未来を持つ」というbrighter（bright比較級）がfutureを修飾。"], "vocabulary_notes": ["help + O + (to) 原形: Oが〜するのを助ける。toは省略可能。", "access to: 〜へのアクセス、利用の機会。"]}, "L15-5": {"grammar_notes": ["無生物主語 + enable + O + to do: 「〜がOに…することを可能にする」という無生物主語構文。", "enableはallowと似ているが「可能にする」という積極的なニュアンスを持つ点が特徴。", "remote areas: 「遠隔地」という形容詞remoteが場所を修飾している。"], "vocabulary_notes": ["enable + O + to do: Oが〜することを可能にする。", "remote area: 遠隔地、へき地。"]}, "L15-6": {"grammar_notes": ["無生物主語 + prevent + O + from Ving: 「〜がOが…するのを妨げる」という無生物主語構文（fromの後は動名詞）。", "preventはstop, keepと同系統でfrom Vingを伴う動詞群として覚えると効率的。", "poverty: 「貧困」という抽象名詞が文の主語になっている。"], "vocabulary_notes": ["prevent + O + from Ving: Oが〜するのを妨げる。stop/keep + O + from Vingも同系統。", "poverty: 貧困。"]}, "L15-7": {"grammar_notes": ["be supposed to do: 「〜することになっている」という予定・義務を表す慣用表現。", "carbon-neutral: 「カーボンニュートラルの」という環境用語の複合形容詞。", "by 2050: 「2050年までに」という期限を表す前置詞by。"], "vocabulary_notes": ["be supposed to do: 〜することになっている（予定・規則・期待）。", "carbon-neutral: 炭素中立の。by: 〜までに（期限）。"]}, "L15-8": {"grammar_notes": ["be required to do: 「〜することを求められている」という義務を表す受動態の慣用表現。", "require A to do: 「Aに〜することを要求する」の受動態版（A is required to do）。", "take responsibility for 〜: 「〜に責任を持つ」という熟語表現。"], "vocabulary_notes": ["be required to do: 〜することを求められている。requireの受動態。", "take responsibility for: 〜に責任を持つ。"]}, "S1-1": {"grammar_notes": ["未来の受動態：will be + 過去分詞。「〜されるだろう」という未来の受け身の状態を表す。", "from A to B: 「AからBまで」という期間の始点と終点を表す前置詞のペア。", "closeは他動詞「閉める」だが、ここでは受動態be closedで「閉まっている」という状態を表す。"], "vocabulary_notes": ["will be + 過去分詞: 〜されるだろう（未来の受動態）。", "from A to B: AからBまで（期間）。"]}, "S1-2": {"grammar_notes": ["be going to + 受動態: be going to be + 過去分詞。「〜される予定だ」という近い未来の受け身。", "holdは「（イベントを）開催する」という他動詞。ここでは受動態be heldで「開催される」。", "the Budokan: 「武道館」という固有名詞（東京の有名なイベント会場）。"], "vocabulary_notes": ["be going to be + 過去分詞: 〜される予定だ。", "hold - held - held: 開催する。be heldで「開催される」。"]}, "S1-3": {"grammar_notes": ["助動詞を含む受動態：have to be + 過去分詞。「〜されなければならない」という義務の受け身。", "carefully: 「慎重に、注意深く」というcareful（形容詞）の副詞形。", "この構文はhave to do（能動）とbe doneの受動態が組み合わさった形。"], "vocabulary_notes": ["have to be + 過去分詞: 〜されなければならない。", "carefully: 慎重に。careful+lyの副詞形。"]}, "S1-4": {"grammar_notes": ["進行形の受動態：be being + 過去分詞。「（今）〜されている最中だ」という進行中の受け身を表す。", "通常の受動態（is repaired＝修理される、状態）と進行形受動態（is being repaired＝修理されている最中）の違いに注意。", "repair: 「〜を修理する」という他動詞。"], "vocabulary_notes": ["be being + 過去分詞: 〜されている最中だ（進行形の受動態）。", "repair: 修理する。"]}, "S1-5": {"grammar_notes": ["完了形の受動態：have been + 過去分詞。「（ずっと）〜され続けている」という継続的な受け身を表す。", "be caught in a traffic jam: 「渋滞に巻き込まれる」という熟語的な受動態表現。", "for an hour: 「1時間」という継続期間を表す前置詞句（現在完了と共起）。"], "vocabulary_notes": ["have been + 過去分詞: 〜され続けている（完了形の受動態）。", "be caught in a traffic jam: 渋滞に巻き込まれる。"]}, "S1-6": {"grammar_notes": ["群動詞の受動態：take care of（世話をする）という句動詞がそのままの語順で受動態になる。", "群動詞を受動態にする際は、動詞部分をbe+過去分詞にし、前置詞はそのまま残す（take care of→be taken care of）。", "by Mr. and Mrs. Lake: 「レイク夫妻によって」という行為者を示すby句。"], "vocabulary_notes": ["群動詞の受動態: take care of→be taken care of のように前置詞を残したまま受動態にする。", "Mr. and Mrs. 〜: 〜夫妻。"]}, "S1-7": {"grammar_notes": ["群動詞＋助動詞の受動態：should be dealt with。deal with（対処する）が助動詞shouldを伴い受動態になる。", "deal with 〜: 「〜に対処する」という句動詞。受動態にしてもwithは残る（S1-6と同じパターン）。", "at once: 「すぐに、直ちに」という熟語表現（immediatelyとほぼ同義）。"], "vocabulary_notes": ["deal with → be dealt with: 対処される（群動詞の受動態）。", "at once: すぐに、直ちに。"]}, "S1-8": {"grammar_notes": ["get + 過去分詞: 「〜される」というbe+過去分詞の口語的な代用表現（getを使う受動態）。", "get arrestedのようにgetを使う受動態は、突発的・望ましくない出来事に使われることが多い。", "on the street: 「路上で」という場所を表す前置詞句。"], "vocabulary_notes": ["get + 過去分詞: 〜される（口語的な受動態、getを使う）。突発的な出来事に多い。", "thief: 泥棒。arrest: 逮捕する。"]}, "S1-9": {"grammar_notes": ["SVOO文型の受動態（間接目的語が主語）：She was given 〜 by the president。giveの間接目的語（her）が主語になった形。", "第4文型（give O1 O2）を受動態にする場合、O1（人）またはO2（物）のどちらも主語にできる。", "important position: 「重要な地位、役職」という形容詞+名詞の組み合わせ。"], "vocabulary_notes": ["SVOOの受動態(間接目的語が主語): 人+be given+物（〜が与えられる）。", "position: 地位
