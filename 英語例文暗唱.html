、職。"]}, "S1-10": {"grammar_notes": ["SVOO文型の受動態（直接目的語が主語）：An important position was given to her。giveの直接目的語（物）が主語になった形。", "S1-9との書き換え関係：人が主語（was given 物）⇔ 物が主語（was given to 人）で前置詞toが必要になる点に注意。", "この2文（S1-9とS1-10）はSVOOの受動態の2パターンを対比的に学ぶための典型例。"], "vocabulary_notes": ["SVOOの受動態(直接目的語が主語): 物+be given to+人。toが必要になる点に注意。", "give A to B: AをBに与える。"]}, "S1-11": {"grammar_notes": ["buy型の受動態：buy A for B（BのためにAを買う）のAが主語になった受動態。前置詞はforになる。", "give型（to）とbuy型（for）で、受動態にしたときの前置詞が異なる点が重要な区別。", "buy, make, cook, get などの動詞はforを使う点をまとめて覚える。"], "vocabulary_notes": ["buy A for B の受動態: A is bought for B（forを使う点がgive型と異なる）。", "aunt: おば。"]}, "S1-12": {"grammar_notes": ["call型の受動態（SVOC）：call O C（OをCと呼ぶ）のOが主語になった受動態。I am called 〜で「私は〜と呼ばれている」。", "SVOCの受動態はO=Cの関係を保ったまま、Oを主語にしてbe動詞+過去分詞+Cという形にする。", "by my classmates: 「クラスメートによって」という行為者を示すby句。"], "vocabulary_notes": ["call O C の受動態: O is called C（OはCと呼ばれる）。", "classmate: クラスメート、同級生。"]}, "S2-1": {"grammar_notes": ["否定疑問文：Didn't you 〜?。「〜しなかったのですか」という確認・驚きを表す疑問文。", "否定疑問文への答え方は日本語と逆になる点が重要：事実がNoなら英語でもNo（行かなかった→No, I didn't）。", "cram school: 「塾」という日本の教育制度に特有の複合名詞。"], "vocabulary_notes": ["否定疑問文の答え方: 事実に基づきYes/Noを答える（日本語の「はい/いいえ」と対応が逆になることがある）。", "cram school: 塾、予備校。"]}, "S2-2": {"grammar_notes": ["否定疑問文（助動詞can）：Can't you 〜?。「〜できないのですか」という確認・驚きを表す疑問文。", "この文もS2-1と同様、答えるときは事実に基づいてYes/Noを判断する（できるならYes, できないならNo）。", "ride a bike: 「自転車に乗る」という動詞+目的語の基本表現。"], "vocabulary_notes": ["Can't you 〜?: 〜できないのですか（否定疑問文）。", "ride a bike: 自転車に乗る。"]}, "S2-3": {"grammar_notes": ["否定疑問文（意見を求める）：Don't you think 〜?。「〜だと思いませんか」という同意を求める丁寧な疑問表現。", "Yes, I do.は「思う」という肯定を表す（日本語の「はい」とは対応が逆転する典型例）。", "cute: 「かわいい」という形容詞。thisが指示形容詞としてcatを修飾している。"], "vocabulary_notes": ["Don't you think 〜?: 〜だと思いませんか（同意を求める表現）。", "cute: かわいい。"]}, "S2-4": {"grammar_notes": ["付加疑問文（肯定文+否定の付加疑問）：〜, isn't she?。肯定文の後に否定の短縮形を付けて確認する。", "付加疑問文のルール：肯定文には否定の付加疑問、否定文には肯定の付加疑問を付ける。", "答え方は普通の疑問文と同じで、事実に基づきYes/Noを判断する。"], "vocabulary_notes": ["付加疑問文(肯定文): 肯定文+否定の短縮形?。確認・同意を求める。", "sister: 姉、妹。文脈で年上・年下どちらもありうる。"]}, "S2-5": {"grammar_notes": ["付加疑問文（否定文+肯定の付加疑問）：〜, does he?。否定文の後に肯定形を付けて確認する（S2-4と逆パターン）。", "Well, no, he doesn't.のように、答えの前にWellを置くことで婉曲・ためらいのニュアンスを加えられる。", "sing well: 「上手に歌う」という動詞+副詞の基本構造。"], "vocabulary_notes": ["付加疑問文(否定文): 否定文+肯定の短縮形?。", "well (副詞): 上手に、うまく。形容詞のgoodと対応。"]}, "S2-6": {"grammar_notes": ["間接疑問文：don't know what 〜。疑問詞whatが導く名詞節がknowの目的語になっている。", "間接疑問文の語順は「疑問詞+主語+動詞」（普通の疑問文のような倒置は起きない）。", "talk about 〜: 「〜について話す」という句動詞。areが進行形のbe動詞として使われている。"], "vocabulary_notes": ["間接疑問文: 疑問詞+S+Vの語順（疑問文の倒置をしない）。", "talk about: 〜について話す。"]}, "S2-7": {"grammar_notes": ["間接疑問文（whether）：know whether 〜。「〜かどうか」を表すwhetherが導く名詞節。", "whetherはyes/no疑問文を間接疑問文にする際に使われる（疑問詞のない疑問文の場合）。", "attend the meeting: 「会議に出席する」という他動詞attendを使った表現（L4-4のattendと同じ用法）。"], "vocabulary_notes": ["whether 〜 (or not): 〜かどうか。間接疑問文でyes/no疑問を表す際に使う。", "attend a meeting: 会議に出席する。"]}, "S2-8": {"grammar_notes": ["間接疑問文（if）：know if 〜。S2-7のwhetherと同じ「〜かどうか」の意味だが、ifはより口語的な代用表現。", "whetherとifの違い：whetherはor notを直後に置ける、名詞節の主語になれるなど用法が広い。ifは口語的。", "この2文（S2-7とS2-8）はほぼ同義だが、フォーマルさの違いを示す対比例として重要。"], "vocabulary_notes": ["if 〜: 〜かどうか（口語的、whetherの代用）。名詞節主語には使えない点に注意。", "S2-7のwhetherとの書き換え関係を確認。"]}, "S2-9": {"grammar_notes": ["疑問詞+do you think+S+V?: 「〜だと思いますか」という意見を尋ねる疑問文の特殊語順。", "この構文はDo you think what that boy is looking for?という誤った語順にならない点が最大の注意点（whatが文頭に出る）。", "look for: 「〜を探す」という句動詞（L1-2でも既出）。"], "vocabulary_notes": ["疑問詞+do you think+S+V?: 〜だと思いますか。疑問詞が文頭に出る特殊語順。", "look for: 〜を探す。"]}, "S2-10": {"grammar_notes": ["What is A like?: 「Aはどのような人（もの）ですか」という様子・性質を尋ねる疑問文。", "likeはここで前置詞「〜のような」として使われ、howと混同しないよう注意（Howは状態・調子を尋ねる）。", "new English teacher: 「新しい英語の先生」という形容詞が連続して名詞を修飾する構造。"], "vocabulary_notes": ["What is A like?: Aはどのような人（もの）ですか。likeは前置詞。", "How is A?（調子・状態）との違いに注意。"]}, "S2-11": {"grammar_notes": ["What ... for?: 「何のために〜」という目的を尋ねる疑問文（Why より具体的な目的を尋ねるニュアンス）。", "forは文末に置かれ、「何の目的で」という意味を表す前置詞（前置詞の残留）。", "city hall: 「市役所」という複合名詞。"], "vocabulary_notes": ["What ... for?: 何のために〜。目的を尋ねる（forが文末に残る）。", "city hall: 市役所。"]}, "S2-12": {"grammar_notes": ["How do you feel about 〜?: 「〜についてどう感じますか」という感想・意見を尋ねる疑問文。", "feel aboutは主観的な感情・印象を尋ねるのに対し、S2-13のthink aboutは意見・考えを尋ねる（ニュアンスの違い）。", "latest: 「最新の」という形容詞（lateの最上級由来）。"], "vocabulary_notes": ["How do you feel about 〜?: 〜についてどう感じますか（感想）。", "latest: 最新の。"]}, "S2-13": {"grammar_notes": ["What do you think about 〜?: 「〜についてどう思いますか」という意見を尋ねる疑問文。", "S2-12のHow do you feel about（感情）とS2-13のWhat do you think about（意見・考え）の違いを対比して覚える。", "この構文でHowではなくWhatを使う点（think の内容を尋ねるためwhat）が重要な誤りやすいポイント。"], "vocabulary_notes": ["What do you think about 〜?: 〜についてどう思いますか（意見）。", "S2-12のHow do you feelとの意味・語法の違いを確認。"]}, "S2-14": {"grammar_notes": ["How come + S + V?: 「なぜ〜なのか」という理由を尋ねる口語的な疑問文（whyよりくだけた表現）。", "How comeの後は疑問文の倒置をせず、普通の平叙文の語順（S+V）が続く点がwhyとの文法的な違い。", "in a hurry: 「急いで」という熟語表現（hurryは名詞「急ぎ」）。"], "vocabulary_notes": ["How come+S+V?: なぜ〜なのか（口語的、倒置しない）。Why+疑問文の倒置形との違いに注意。", "in a hurry: 急いで。"]}, "S3-1": {"grammar_notes": ["no longer 〜: 「もはや〜ない」という状態の変化を表す否定表現（not 〜 any longerと同義）。", "believe in 〜: 「〜の存在を信じる」というinが対象の存在への信頼を表す前置詞。", "この文はMy brother doesn't believe in Santa Claus any longer.と書き換え可能。"], "vocabulary_notes": ["no longer: もはや〜ない。＝not ... any longer/anymore。", "believe in: （存在などを）信じる。believe（言うことを信じる）との違いに注意。"]}, "S3-2": {"grammar_notes": ["by no means: 「決して〜ない」という強い否定を表す慣用句（notを使わずに否定を表す）。", "この表現は文中に挿入され、satisfiedを強く否定する働きをする（never, not at allに近い強さ）。", "be satisfied with 〜: 「〜に満足している」という熟語表現。"], "vocabulary_notes": ["by no means: 決して〜ない（強い否定）。", "be satisfied with: 〜に満足している。"]}, "S3-3": {"grammar_notes": ["fail to do: 「〜し損なう、できない」という否定的な意味を持つto不定詞を伴う動詞。", "この表現は実質的にdidn't 原形と同じ意味を持つが、より「努力したができなかった」という含意がある。", "adequately: 「十分に、適切に」というadequate（形容詞）の副詞形。"], "vocabulary_notes": ["fail to do: 〜し損なう（否定的意味の動詞、実質的な否定表現）。", "adequately: 十分に、適切に。"]}, "S3-4": {"grammar_notes": ["never fail to do: 「必ず〜する」という二重否定的な強い肯定表現（S3-3のfail toの否定形）。", "この構文はalwaysとほぼ同じ意味を持つが、「欠かさず必ず」という強調的なニュアンスがある。", "grandparents: 「祖父母」というgrandparent（単数）の複数形。"], "vocabulary_notes": ["never fail to do: 必ず〜する（二重否定で強い肯定を表す）。", "grandparents: 祖父母。"]}, "S3-5": {"grammar_notes": ["far from 〜: 「決して〜ではない」という強い否定を表す慣用句（fromの後は形容詞・名詞・動名詞）。", "この表現はnot 〜 at allに近い強さの否定を、farという距離感で比喩的に表している。", "confidence in one's ability to do: 「〜する能力への自信」という抽象名詞の組み合わせ。"], "vocabulary_notes": ["far from: 決して〜ではない（強い否定、距離の比喩）。", "confident in: 〜に自信がある。"]}, "S3-6": {"grammar_notes": ["free from 〜: 「〜がない、〜を免れている」という否定的な性質の欠如を表す慣用句。", "S3-5のfar from（否定を強調）とS3-6のfree from（〜がない状態）は形が似ているが意味が異なる点に注意。", "racial prejudice: 「人種的偏見」という形容詞+名詞の組み合わせ。"], "vocabulary_notes": ["free from: 〜がない、〜を免れている。", "prejudice: 偏見。racial prejudice=人種的偏見。"]}, "S3-7": {"grammar_notes": ["nothing but 〜: 「〜だけ、〜以外の何物でもない」という限定を表す慣用句（＝only）。", "butはここで「〜を除いて」という前置詞的な意味で使われている（否定語nothingと組み合わさる）。", "this kind of 〜: 「この種の〜」という種類を表す表現。"], "vocabulary_notes": ["nothing but: 〜だけ、〜以外の何物でもない（＝only）。", "kind of: 種類の。this kind of 〜=この種の〜。"]}, "S3-8": {"grammar_notes": ["do nothing but do: 「〜してばかりいる」という限定・非難を表す慣用句（butの後は原形不定詞）。", "S3-7のnothing but+名詞とS3-8のdo nothing but+原形の構造の違いに注意（butの後の品詞が異なる）。", "all day: 「一日中」という時間の長さを表す副詞句。"], "vocabulary_notes": ["do nothing but do: 〜してばかりいる。butの後は原形（to不定詞ではない）。", "all day: 一日中。"]}, "S3-9": {"grammar_notes": ["have no choice but to do: 「〜するしかない」という他に選択肢がないことを表す慣用句。", "この構文のbutの後はto不定詞になる点がS3-8（do nothing but+原形）と異なる。", "admit one's mistake: 「自分の間違いを認める」というadmitを使った表現。"], "vocabulary_notes": ["have no choice but to do: 〜するしかない。butの後はto不定詞。", "admit: 認める。mistake: 間違い、失敗。"]}, "S3-10": {"grammar_notes": ["find oneself Ving: 「気づいたら〜していた」という無意識の状態への気づきを表す慣用表現。", "この構文は主語が意図せずにその状態になっていたことを表す（find+O+Ving のSVOC構造）。", "living room floor: 「リビングの床」という名詞が連続する複合的な名詞句。"], "vocabulary_notes": ["find oneself Ving: 気づいたら〜していた（無意識の状態への気づき）。", "floor: 床。living room floor=リビングの床。"]}, "S3-11": {"grammar_notes": ["myself: 再帰代名詞の強調用法。「自分自身で」という強調を表し、省略可能（doとhousework の間に置くことも可能）。", "most of the 〜: 「〜のほとんど」という部分を表す表現（ofの後は特定された名詞）。", "housework: 「家事」という不可算名詞（housework、homeworkと混同しないよう注意）。"], "vocabulary_notes": ["myself (強調用法): 自分自身で。再帰代名詞が動作主を強調する用法。", "housework: 家事（不可算名詞）。homework（宿題）との混同に注意。"]}, "S3-12": {"grammar_notes": ["one: 前出の不特定の名詞（a vacuum cleaner）を指す代名詞。同じ種類の別の物を指す（it との違いに注意）。", "a new one: 「新しいもの（＝新しい掃除機）」というoneが名詞の反復を避ける代名詞として機能。", "work: ここでは「（機械が）作動する」という自動詞として使われている。"], "vocabulary_notes": ["one (代名詞): 前出の名詞と同種の不特定なもの。it（同一の物）との違いに注意。", "work (自動詞): 作動する、機能する。doesn't work=故障している。"]}, "S3-13": {"grammar_notes": ["these / those: 「これらの／あれらの」という指示形容詞。話し手からの近さ・遠さで使い分ける。", "ones: 前出の複数名詞（black socks）を指す代名詞（socksの反復を避ける）。", "colorful: 「色とりどりの、カラフルな」というcolor+fulの派生形容詞。"], "vocabulary_notes": ["ones (代名詞複数形): 前出の複数名詞を指す。socks→ones。", "colorful: 色とりどりの。"]}, "S3-14": {"grammar_notes": ["another: 「別のもの（不特定の、もう一つ）」という代名詞。theとの違いに注意（otherは形容詞、anotherは代名詞にも使える）。", "fit: 「（サイズが）合う」という自動詞。fit A wellで「Aにぴったり合う」。", "try on: 「試着する」という句動詞（onは「身につける」という状態を表す）。"], "vocabulary_notes": ["another: 別の一つ（不特定）。", "try on: 試着する。"]}, "S3-15": {"grammar_notes": ["one ... the other ...: 「一方は〜、もう一方は…」という2つのうちの対比を表す代名詞表現。", "2人（2つ）の場合はone / the other（残りは1つだけなのでtheで特定される）。", "foreign student: 「留学生」という複合名詞（外国から来た学生）。"], "vocabulary_notes": ["one ... the other ...: (2つのうち)一方は〜、もう一方は…。", "foreign student: 留学生。"]}, "S3-16": {"grammar_notes": ["one ... the others ...: 「一人は〜、残りは…」という3人以上のうちの対比を表す代名詞表現。", "3人以上の場合はone / the others（残りが複数になるためothersは複数形＋the）。", "S3-15（2人：the other）とS3-16（3人以上：the others）の対比が学習のポイント。"], "vocabulary_notes": ["one ... the others ...: (3人以上のうち)一人は〜、残りは…。", "S3-15のthe other(単数)との使い分けを確認。"]}, "S4-1": {"grammar_notes": ["arrive at 〜: 「〜に到着する」という句動詞。狭い場所・地点にはat、広い場所にはinを使う。", "will + 原形: 単純未来を表す助動詞。予定された未来の到着時刻を述べている。", "10:30 am: 「午前10時30分」という時刻表現（amは午前を表す）。"], "vocabulary_notes": ["arrive at: 〜に到着する（狭い地点）。arrive in（広い場所）との使い分け。", "am/pm: 午前/午後。時刻の後に付ける略語。"]}, "S4-2": {"grammar_notes": ["look up at 〜: 「〜を見上げる」という句動詞（upが「上へ」という方向を示す）。", "過去進行形（was looking）が過去のある時点での動作の継続を表す。", "in the tree: 「木にいる」という位置を表す前置詞句（on the treeとの違いに注意：inは木の中・枝の間）。"], "vocabulary_notes": ["look up at: 〜を見上げる。", "in the tree / on the tree: 木の中に（枝葉の間）／木の表面に、の違い。"]}, "S4-3": {"grammar_notes": ["be surprised at 〜: 「〜に驚く」という感情を表す熟語表現（atは驚きの原因を表す）。", "sudden visit: 「突然の訪問」という形容詞+名詞の組み合わせ。", "one's: 所有格。my uncle's visitのように「〜の」という所有・所属を表す。"], "vocabulary_notes": ["be surprised at: 〜に驚く。", "sudden: 突然の。"]}, "S4-4": {"grammar_notes": ["must be 〜: 「きっと〜に違いない」という現在の事柄への強い推量を表す助動詞。", "at work: 「職場で、勤務中で」という熟語表現（workは無冠詞で「仕事という場・状態」を表す）。", "now: 「今」という現在の一時点を明示する副詞。mustの推量が現在の状況について述べていることを示す。"], "vocabulary_notes": ["must be: きっと〜に違いない（現在の強い推量）。", "at work: 職場で、仕事中で。"]}, "S4-5": {"grammar_notes": ["notice: 「〜に気づく」という他動詞（L15-1のnoticeと同じ動詞）。", "on Sunday morning: 「日曜日の朝に」という特定の日の一時点を表す前置詞on。", "stain: 「シミ、汚れ」という名詞。ceiling（天井）と組み合わさっている。"], "vocabulary_notes": ["notice: 気づく。", "stain: シミ、汚れ。ceiling: 天井。"]}, "S4-6": {"grammar_notes": ["in the morning: 「午前中に、朝に」という時間帯を表す前置詞句（onは特定の日、inは一般的な時間帯）。", "be busy: 「忙しい」という形容詞を使った状態を表す表現。", "この文は時を表す前置詞のin（広い時間帯）とon（特定の日）の使い分けの好例。"], "vocabulary_notes": ["in the morning: 午前中に、朝に（時間帯）。", "busy: 忙しい。be busy Vingで「〜するのに忙しい」も重要表現。"]}, "S4-7": {"grammar_notes": ["depend on 〜: 「〜に頼る、依存する」という句動詞（rely onとほぼ同義）。", "a lot: 「大いに、たくさん」という副詞的な用法（文末に置かれ動詞dependsを修飾）。", "wife: 「妻」という名詞。his wifeで所有格が使われている。"], "vocabulary_notes": ["depend on: 〜に頼る、依存する。＝rely on。", "a lot (副詞): 大いに。文末で動詞を修飾する副詞的用法。"]}, "S4-8": {"grammar_notes": ["未来の受動態：will be + 過去分詞（S1-1と同じ構造）。「〜される予定だ」という未来の受け身。", "broadcast: 「放送する」という他動詞。過去分詞も同形broadcast（不規則動詞）。", "on the internet: 「インターネットで」という媒体を表す前置詞on。"], "vocabulary_notes": ["broadcast: 放送する。原形・過去形・過去分詞すべてbroadcast（不規則動詞）。", "on the internet: インターネットで。媒体を表す前置詞on。"]}, "S4-9": {"grammar_notes": ["in + 年: 「〜年に」という年を表す前置詞in（広い時間の範囲を表す代表例）。", "過去形lived: 過去のある時点における継続的な状態（居住）を表す。", "Saga: 「佐賀」という日本の地名（固有名詞）。"], "vocabulary_notes": ["in + 年: 〜年に。年・月など広い時間にはinを使う。", "live in: 〜に住む。"]}, "S4-10": {"grammar_notes": ["未来を表すbe動詞現在形：I'll be back。will+beの短縮形'llが使われている。", "in + 時間: 「〜後に」という未来の一定時間経過後を表す前置詞in（afterとの違いに注意）。", "thirty minutes: 「30分」という時間の長さを表す数詞+単位。"], "vocabulary_notes": ["in + 時間: 〜後に（未来の時点）。afterとの使い分けに注意。", "be back: 戻ってくる。"]}, "S4-11": {"grammar_notes": ["be in love with 〜: 「〜に恋をしている」という熟語表現（inは状態の中にいることを表す）。", "over there: 「あそこに」という場所を強調する副詞句。", "in the white dress: 「白いドレスを着た」という服装を表す前置詞句（後置修飾）。"], "vocabulary_notes": ["be in love with: 〜に恋をしている。", "in + 衣服: 〜を着て。the girl in the white dress=白いドレスを着た女の子。"]}, "S4-12": {"grammar_notes": ["talk about 〜: 「〜について話す」という句動詞（S2-6でも既出）。", "現在進行形（are talking）が、今まさに進行中の会話を表している。", "movie: 「映画」という名詞。theが特定の映画を指している。"], "vocabulary_notes": ["talk about: 〜について話す。", "現在進行形: 今まさに進行中の動作を表す。"]}, "S4-13": {"grammar_notes": ["現在完了進行形：have been + Ving。「ずっと〜し続けている」という動作の継続を強調する時制。", "wander about 〜: 「〜をさまよう」という句動詞（aboutは「あちこち」という意味）。", "for three days: 「3日間」という継続期間を表す前置詞句（現在完了（進行）形と共起）。"], "vocabulary_notes": ["have been Ving: ずっと〜し続けている（現在完了進行形、動作の継続を強調）。", "wander about: あちこちさまよう。"]}, "S4-14": {"grammar_notes": ["It's a 時間-minute walk from A to B: 「AからBまで歩いて〜分だ」という所要時間を表す慣用構文。", "ten-minuteはハイフンで結ばれた複合形容詞（数詞+単位がハイフンでつながると単数形になる点に注意）。", "この構文はIt takes ten minutes to walk from here to the station.とほぼ同義に書き換え可能。"], "vocabulary_notes": ["It's a 数-単位 walk: 歩いて〜だ。複合形容詞はハイフンでつなぎ単数形にする。", "ten-minute walk: 徒歩10分。"]}, "S4-15": {"grammar_notes": ["die from[of] 〜: 「〜が原因で死ぬ」という句動詞（外的要因にはfrom、病気などにはofを使う傾向）。", "starvation: 「餓死、飢餓」というstarve（飢える）の名詞形。", "every year: 「毎年」という頻度を表す副詞句。現在形（die）と共起し習慣的・一般的事実を表す。"], "vocabulary_notes": ["die from/of: 〜が原因で死ぬ。", "starvation: 餓死、飢餓。"]}, "S4-16": {"grammar_notes": ["be different from 〜: 「〜と異なる」という比較を表す熟語表現（fromが比較対象を導く）。", "mine: 所有代名詞。「私の意見（my opinion）」を指し、名詞の反復を避けている。", "opinion about 〜: 「〜についての意見」というaboutが話題を表す前置詞。"], "vocabulary_notes": ["be different from: 〜と異なる。", "mine: 私のもの（所有代名詞）。my opinionの代用。"]}, "S4-17": {"grammar_notes": ["so 〜 that ...: 「とても〜なので…」という結果を表す構文（L9-8で既出のso...that構文）。", "would: 「〜だろう」という仮定的な推量を表す助動詞（ここでは仮定法的なニュアンスを含む）。", "freeze to death: 「凍え死ぬ」というto death（死に至るまで）を使った程度・結果を表す表現。"], "vocabulary_notes": ["freeze to death: 凍え死ぬ。to deathは「死ぬまで」という結果を表す。", "so ... that ~: とても…なので〜（結果構文）。"]}, "S4-18": {"grammar_notes": ["leave for 〜: 「〜に向けて出発する」という句動詞（forが目的地を表す）。", "leave forとarrive atの対比：出発点の前置詞と到着点の前置詞の使い分けを意識する。", "this morning: 「今朝」という時を表す副詞句（前置詞なしで使われる時間表現の代表例）。"], "vocabulary_notes": ["leave for: 〜に向けて出発する。", "this morning: 今朝。前置詞なしで副詞的に使う。"]}, "S4-19": {"grammar_notes": ["What can I do for you?: 「何かご用件はありますか」という接客・申し出の定型表現。", "forは「〜のために」という利益・対象を表す前置詞。", "この表現は店員が客に対して使う典型的な決まり文句として覚える。"], "vocabulary_notes": ["What can I do for you?: 何かご用件は？（接客での定型的な申し出表現）。", "for: 〜のために（利益・対象）。"]}, "S4-20": {"grammar_notes": ["現在完了進行形：have been Ving（S4-13と同じ構造）。「ずっと〜し続けている」という継続を強調。", "wait for 〜: 「〜を待つ」という句動詞。", "for 15 minutes: 「15分間」という継続時間を表す前置詞句。"], "vocabulary_notes": ["have been Ving + for 時間: 〜し続けている（継続時間の強調）。", "wait for: 〜を待つ。"]}, "S4-21": {"grammar_notes": ["過去進行形（was standing）と分詞構文的な付帯状況（looking outside）が組み合わさった文。", "looking outside は分詞構文で、standingという動作に伴う様子を追加的に描写している。", "by the window: 「窓のそばに」という位置を表す前置詞by（近接を表す）。"], "vocabulary_notes": ["by: 〜のそばに（近接を表す前置詞）。", "looking outside: 外を見ながら（分詞構文、付帯状況）。"]}, "S4-22": {"grammar_notes": ["live in 〜: 「〜に住んでいる」という現在形の一般的事実を表す表現。", "near 〜: 「〜の近くの」という前置詞（形容詞的にtownを後置修飾）。", "Sydney: 「シドニー」というオーストラリアの都市名（固有名詞）。"], "vocabulary_notes": ["live in: 〜に住む。", "near: 〜の近くの、近くに。"]}, "S4-23": {"grammar_notes": ["go to 〜 by 交通手段: 「〜へ（交通手段）で行く」という移動の手段を表す前置詞by。", "by bicycle: 交通手段を表すbyの後は無冠詞（by car, by trainなども同様）。", "the nearest station: 「一番近い駅」というnear の最上級nearestを使った表現。"], "vocabulary_notes": ["by + 交通手段: 〜で（交通手段、無冠詞）。", "nearest: 一番近い（nearの最上級）。"]}, "S4-24": {"grammar_notes": ["make up one's mind: 「決心する」という熟語表現（decideとほぼ同義）。", "about that: 「そのことについて」というaboutが対象を表す前置詞。", "by tomorrow: 「明日までに」という期限を表す前置詞by（S4-23とは異なる用法のby）。"], "vocabulary_notes": ["make up one's mind: 決心する。＝decide。", "by + 期限: 〜までに（期限）。"]}, "S5-1": {"grammar_notes": ["at last: 「ついに、とうとう」という長い時間・努力の末の到達を表す副詞句（finallyに近い）。", "reach: 「〜に到達する」という他動詞（前置詞不要、arrive atと違う点に注意）。", "the top of 〜: 「〜の頂上」という位置を表す名詞句。"], "vocabulary_notes": ["at last: ついに、とうとう。", "reach: 〜に到達する（他動詞、前置詞不要）。arrive at/inとの違いに注意。"]}, "S5-2": {"grammar_notes": ["a person of importance: 「重要な人物」というof+抽象名詞が形容詞的に働く表現（＝an important person）。", "of+抽象名詞（of importance, of value, of useなど）は形容詞句として名詞を修飾する典型パターン。", "political world: 「政界」という形容詞+名詞の組み合わせ。"], "vocabulary_notes": ["of + 抽象名詞: 〜な（形容詞句）。a person of importance=重要な人物。", "political world: 政界。"]}, "S5-3": {"grammar_notes": ["現在分詞walking with Tomが後ろからthat girlを修飾する後置修飾（現在分詞句、能動的意味）。", "疑問詞whoが主語として使われ、be動詞isと呼応している（Who is 〜?の疑問文構造）。", "walk with 〜: 「〜と一緒に歩く」という前置詞withが同伴を表す。"], "vocabulary_notes": ["現在分詞の後置修飾: 名詞+Ving+〜（〜している名詞）。", "walk with: 〜と一緒に歩く。"]}, "S5-4": {"grammar_notes": ["with + 名詞: 「〜を持った、〜のある」という所有・特徴を表す前置詞句（後置修飾として機能）。", "with gray hair: 「白髪の」という身体的特徴を表す表現（人を描写する定番パターン）。", "that man with gray hair: thatが指示形容詞、with gray hairが後置修飾という二重構造。"], "vocabulary_notes": ["with + 特徴: 〜を持った、〜のある（外見的特徴の描写）。", "gray hair: 白髪、グレーの髪。"]}, "S5-5": {"grammar_notes": ["should have + 過去分詞: 「〜すべきだったのに」という過去への後悔を表す（L3-8で既出の構文）。", "bring: 「持ってくる」という他動詞（bring-brought-broughtの不規則変化）。", "with me: 「自分と一緒に、持って」という所有・携帯を表す前置詞句。"], "vocabulary_notes": ["should have done: 〜すべきだったのに（過去への後悔）。", "bring - brought - brought: 持ってくる。"]}, "S5-6": {"grammar_notes": ["with care: 「注意して、丁寧に」というwith+抽象名詞が副詞的に働く表現（＝carefully）。", "S5-2のof+抽象名詞（形容詞的）とS5-6のwith+抽象名詞（副詞的）の違いに注意。", "handle: 「〜を扱う」という他動詞。"], "vocabulary_notes": ["with + 抽象名詞: 〜して（副詞的、＝carefully等）。with care=注意して。", "handle: 扱う、取り扱う。"]}, "S5-7": {"grammar_notes": ["with soap: 「石鹸で」という道具・手段を表す前置詞with。", "as soon as 〜: 「〜するとすぐに」という時を表す接続詞（GP1-9のOn Vingとほぼ同義）。", "get home: 「帰宅する」というget+副詞的な用法（帰宅という状態への到達）。"], "vocabulary_notes": ["with + 道具: 〜で、〜を使って（手段）。", "as soon as: 〜するとすぐに。"]}, "S5-8": {"grammar_notes": ["pass through 〜: 「〜を通り抜ける」という句動詞（throughが「中を通って」という方向・経路を表す）。", "throughは「一方から入り他方へ抜ける」という通過の経路を表す前置詞の基本イメージ。", "long tunnel: 「長いトンネル」という形容詞+名詞の基本構造。"], "vocabulary_notes": ["pass through: 〜を通り抜ける。throughは通過の経路を表す。", "tunnel: トンネル。"]}, "S5-9": {"grammar_notes": ["travel through 〜: 「〜を（あちこち）旅する」という句動詞（throughが広い範囲の移動を表す）。", "S5-8のpass through（一方向に通過）とS5-9のtravel through（各地を巡る）のニュアンスの違いに注意。", "want to do: 「〜したい」という願望を表す基本表現。"], "vocabulary_notes": ["travel through: （国内を）あちこち旅する。", "want to do: 〜したい。"]}, "S5-10": {"grammar_notes": ["through the night: 「一晩中」というthroughが「始めから終わりまでずっと」という期間全体を表す用法。", "この用法のthroughは「通り抜けて」という空間的な意味から「（時間を）通して」という時間的な意味に転用されている。", "be able to do: 「〜することができる」というcanの言い換え表現（過去形はwas/were able to）。"], "vocabulary_notes": ["through + 期間: 〜の間中ずっと（時間的な用法）。through the night=一晩中。", "soundly: ぐっすりと。sleep soundly=ぐっすり眠る。"]}, "S6-1": {"grammar_notes": ["命令文, and 〜: 「…しなさい、そうすれば〜」という条件的な結果を表す構文。", "andは「そうすれば」という意味で、命令文の内容が実現した場合の結果を導く。", "命令文, or 〜（S6-2）との対比：andは good result、orは bad result を導く点が対照的。"], "vocabulary_notes": ["命令文, and ~: …しなさい、そうすれば〜。", "feel better: 気分がよくなる。betterはwellの比較級。"]}, "S6-2": {"grammar_notes": ["命令文, or 〜: 「…しなさい、さもないと〜」という条件的な悪い結果を表す構文。", "orは「さもないと」という意味で、命令文の内容が実現しなかった場合の悪い結果を導く。", "S6-1のandとの対比がこの2文のセットの学習ポイント（結果が良いか悪いかで使い分ける）。"], "vocabulary_notes": ["命令文, or ~: …しなさい、さもないと〜。", "regret: 後悔する。"]}, "S6-3": {"grammar_notes": ["not A but B: 「AではなくB」という選択的な否定を表す相関接続表現。", "orderedの目的語が not a hamburger but a cheese burgerという形で並置されている。", "この構文は2つの選択肢のうち後者（B）を肯定し、前者（A）を明確に否定する。"], "vocabulary_notes": ["not A but B: AではなくB。", "order: 注文する。"]}, "S6-4": {"grammar_notes": ["not only A but also B: 「AだけでなくBも」という累加的な相関接続表現。", "この構文の主語が単数名詞の場合、動詞はB（also以下）に一致させる点も文法的に重要（この文はLisaが主語）。", "also は省略されることもあるが、フォーマルな文では明示するのが一般的。"], "vocabulary_notes": ["not only A but also B: AだけでなくBも。", "guitar: ギター。play the guitarのように楽器にはtheを付ける。"]}, "S6-5": {"grammar_notes": ["while: 「〜する間に」という時の同時性を表す接続詞（この文脈では時を表す用法）。", "come to see A: 「Aに会いに来る」という目的を表すto不定詞を伴う表現。", "be away: 「不在である、留守である」という熟語表現。"], "vocabulary_notes": ["while (時): 〜する間に。同時進行の出来事を表す。", "be away: 不在である、留守にしている。"]}, "S6-6": {"grammar_notes": ["while: 「〜だが一方」という対比を表す接続詞（S6-5とは異なる対比・逆接の用法）。", "whileの2つの用法（時の同時性／対比）を文脈で判断する必要がある点がこのレッスンのポイント。", "want to do の並列構造：I want to go / Tom wants to stayが対比的に並べられている。"], "vocabulary_notes": ["while (対比): 〜だが一方。butに近い対比の意味を表す。", "S6-5の「時」の用法との違いを確認。"]}, "S6-7": {"grammar_notes": ["as soon as 〜: 「〜するとすぐに」という時を表す接続詞（S5-7で既出）。", "finish Ving: 「〜し終える」というfinishが動名詞を目的語にとる動詞（to不定詞は不可）。", "returnは「返す」という意味の他動詞（returnは自動詞「戻る」の意味もある多義語）。"], "vocabulary_notes": ["as soon as: 〜するとすぐに。", "finish Ving: 〜し終える。finishは動名詞のみを目的語にとる。"]}, "S6-8": {"grammar_notes": ["the moment (that) S+V: 「〜するとたんに」という時を表す名詞由来の接続詞的表現。", "the momentはas soon asとほぼ同義だが、より瞬間的な即時性を強調するニュアンスがある。", "call out 〜: 「〜を叫ぶ、大声で呼ぶ」という句動詞。"], "vocabulary_notes": ["the moment S+V: 〜するとたんに。＝as soon as。", "call out: 大声で呼ぶ、叫ぶ。"]}, "S6-9": {"grammar_notes": ["once S+V: 「いったん〜すると」という条件的な時を表す接続詞。", "この接続詞は「一度その状態になれば、それ以降ずっと」という含意を持つ点が特徴的。", "make a promise: 「約束をする」という熟語表現。breakと組み合わせて「約束を破る」の対比も重要。"], "vocabulary_notes": ["once S+V: いったん〜すると。", "make a promise / break a promise: 約束をする／約束を破る。"]}, "S6-10": {"grammar_notes": ["now that S+V: 「今や〜なので」という理由を表す接続詞（sinceやbecauseに近いが「状況の変化」を強調）。", "この接続詞は「以前とは状況が変わった今は」という新しい状況に基づく理由を表す点が特徴。", "retired: 「退職した」という過去分詞由来の形容詞。be retiredで「退職している」という状態を表す。"], "vocabulary_notes": ["now that S+V: 今や〜なので（状況の変化に基づく理由）。", "retired: 退職した。retireの過去分詞形。"]}, "S6-11": {"grammar_notes": ["as long as S+V: 「〜する限り（条件）」という条件を表す接続詞（時間的な範囲というより条件のニュアンス）。", "この構文はifに近い条件節の働きをするが、「その条件が満たされている間はずっと」という継続性を含む。", "achieve one's goal: 「目標を達成する」という熟語表現。"], "vocabulary_notes": ["as long as (条件): 〜する限り。ifに近い条件節の用法。", "achieve a goal: 目標を達成する。"]}, "S6-12": {"grammar_notes": ["as far as S+V: 「〜する限り（範囲）」という知識・認識の範囲を限定する接続詞。", "S6-11のas long as（条件の限定）とS6-12のas far as（範囲・程度の限定）の意味の違いに注意。", "as far as I can remember: 「私が覚えている限り」という記憶の範囲を限定する定型表現。"], "vocabulary_notes": ["as far as (範囲): 〜する限り（知識・認識の範囲）。as long as（条件）との違いに注意。", "belong to: 〜に所属する。"]}, "S6-13": {"grammar_notes": ["in case S+V: 「〜する場合に備えて」という万一の事態への備えを表す接続詞。", "この構文はifと似ているが、「実際に起こるかは分からないが念のため」という予防的なニュアンスが強い。", "suspicious: 「怪しい、不審な」という形容詞。anyoneを修飾している。"], "vocabulary_notes": ["in case S+V: 〜する場合に備えて（万一の予防）。", "suspicious: 怪しい、不審な。"]}, "S6-14": {"grammar_notes": ["had better do: 「〜した方がよい」という強めの助言を表す助動詞的表現（shouldより強い忠告のニュアンス）。", "in case (that) 〜: 「〜するといけないので」という予防的な理由を表す（S6-13と同じ接続詞用法）。", "write down 〜: 「〜を書き留める」という句動詞。"], "vocabulary_notes": ["had better do: 〜した方がよい（強めの助言、目上には注意して使う）。", "write down: 書き留める。"]}, "S6-15": {"grammar_notes": ["for fear that S+V: 「〜することを恐れて」という否定的な結果を避けるための理由を表す接続詞句。", "この構文はso that S won't[can't] doとほぼ同じ意味を持つ、ややフォーマルな表現。", "oversleep: 「寝過ごす」という自動詞（over+sleepの複合動詞）。"], "vocabulary_notes": ["for fear that S+V: 〜することを恐れて（否定的結果への懸念）。", "oversleep: 寝過ごす。over-（過度に）+sleepの複合語。"]}, "S7-1": {"grammar_notes": ["do/does/did + 原形: 一般動詞を強調する強調のdo。「本当に、どうしても」という意味を動詞に付加する。", "I do want to: 「本当に〜したい」という強調。doにアクセントが置かれ、話者の強い気持ちを表す。", "この強調のdoは肯定文にのみ使われ、否定文・疑問文の助動詞のdoとは機能が異なる点に注意。"], "vocabulary_notes": ["強調のdo: 本当に、どうしても。一般動詞の前に置いて意味を強める。", "concert: コンサート。"]}, "S7-2": {"grammar_notes": ["knowとshouldn'tが対比される譲歩的な文構造（「〜なのは分かるが、それでも…すべきでない」）。", "that the food is good: knowの目的語になるthat節。", "shouldn't: 「〜すべきでない」というshould notの短縮形（禁止に近い助言）。"], "vocabulary_notes": ["know that 〜, but ...: 〜なのは分かるが、しかし…（譲歩的対比）。", "shouldn't: 〜すべきでない（should notの短縮）。"]}, "S7-3": {"grammar_notes": ["that Kyoto gets this hot: knowの目的語となるthat節。knowが過去形（didn't know）で使われている。", "get + 形容詞: 「〜になる」という状態変化を表す（L13-3のget crowdedと同じ用法）。", "this hot: 「これほど暑い」というthisが程度を表す副詞的用法（＝so hot、指示語が強調の役割）。"], "vocabulary_notes": ["this (程度の副詞): これほど。this hot=これほど暑い。", "get hot: 暑くなる。"]}, "S7-4": {"grammar_notes": ["don't have to do: 「〜する必要はない」という不必要を表す表現（must notとの意味の違いに注意：禁止ではない）。", "at all: 「全く（〜ない）」という否定を強調する副詞句（否定文と共起）。", "apologize: 「謝る」という自動詞。"], "vocabulary_notes": ["don't have to do: 〜する必要はない（不必要、禁止ではない）。must notとの違いに注意。", "at all: 全く（〜ない）。否定の強調。"]}, "S7-5": {"grammar_notes": ["in the least: 「少しも（〜ない）」という否定を強調する副詞句（at allと同系統の強調表現）。", "be moved by 〜: 「〜に感動する」という受動態の熟語表現（GP4-12のbe moved to tearsと関連）。", "not 〜 in the least: 「少しも〜ない」という完全否定を表す。"], "vocabulary_notes": ["not ... in the least: 少しも〜ない。at allと同系統の否定強調。", "be moved by: 〜に感動する。"]}, "S7-6": {"grammar_notes": ["on earth: 「一体全体」という疑問詞を強調する慣用句（疑問詞の直後に置く）。", "why on earth: 「一体なぜ」という驚き・いらだちを込めた強い疑問を表す。", "この強調表現はin the world（S7-7）とほぼ同義で置き換え可能。"], "vocabulary_notes": ["on earth: 一体全体（疑問詞の強調）。＝in the world。", "why on earth: 一体なぜ。"]}, "S7-7": {"grammar_notes": ["in the world: 「一体全体」という疑問詞を強調する慣用句（S7-6のon earthと同義）。", "what in the world: 「一体何を」という強い疑問・困惑を表す。", "should I do: 「私は何をすべきか」という助言を求める疑問文の基本構造。"], "vocabulary_notes": ["in the world: 一体全体（疑問詞の強調）。＝on earth。", "what in the world: 一体何を。"]}, "S7-8": {"grammar_notes": ["at all: 「少しでも（〜か）」という疑問文での強調用法（S7-4の否定文用法とは異なる文脈）。", "anything at all: 「何か少しでも」というanythingを強調する副詞句。", "incident: 「事件、出来事」という名詞。"], "vocabulary_notes": ["at all (疑問文): 少しでも。否定文（全く〜ない）とは異なる文脈での用法。", "incident: 事件、出来事。"]}, "S7-9": {"grammar_notes": ["強調構文：It is[was] A that 〜。文中の要素（ここではthat blue coat）を強調して取り出す構文。", "元の文I want to try on that blue coat.のthat blue coatをIt is ... thatで挟んで強調している。", "強調構文の見分け方：It isとthatの間の要素を取り除いても文が成立するかを確認する。"], "vocabulary_notes": ["It is A that 〜: Aこそが〜だ（強調構文）。文の一要素を強調して取り出す。", "try on: 試着する（S3-14で既出）。"]}, "S7-10": {"grammar_notes": ["元の文（強調構文を使わない通常の文）：want to try A onという句動詞にAを挟んだ形。", "S7-9の強調構文と比較するための「強調なし」の基本文として位置づけられる。", "try A on: 「Aを試着する」という句動詞（代名詞の場合はtry it onのように必ず間に挟む）。"], "vocabulary_notes": ["try A on: Aを試着する（句動詞、目的語を間に挟む形）。", "S7-9の強調構文It is that blue coat that I want to try on.との書き換え関係を確認。"]}, "S7-11": {"grammar_notes": ["関係代名詞whatが導く名詞節（What I want to know）が文の主語になっている（GP2-5などと同系統）。", "この構文は「私が知りたいのは〜だ」と主語を強調する効果を持つ（強調構文とは異なる強調の手法）。", "true feelings: 「本心、真の気持ち」という形容詞+名詞の組み合わせ。"], "vocabulary_notes": ["What S want to know: Sが知りたいこと（関係代名詞whatの名詞節が主語）。", "true feelings: 本心。"]}, "S7-12": {"grammar_notes": ["元の文（What I want to knowを使わない通常の文）：I want to know 〜というシンプルな第3文型。", "S7-11のwhat節による主語の強調と比較するための「強調なし」の基本文。", "この2文（S7-11とS7-12）は同じ内容を「主語を強調するか、しないか」で書き分けた対比例。"], "vocabulary_notes": ["want to know: 〜を知りたい（基本形）。", "S7-11のWhat S want to know is 〜との書き換え関係を確認。"]}, "S7-13": {"grammar_notes": ["All S want to do is (to) 原形: 「Sがしたいことはただ〜だけだ」という限定的な強調表現。", "All 〜 isが主語で、補語にdoの原形（またはto do）が続く点が特徴的な構文（isの直後はto省略可能）。", "live in peace: 「平和に暮らす」という熟語表現。"], "vocabulary_notes": ["All S want to do is (to) 原形: Sがしたいのはただ〜だけだ。isの後のtoは省略可能。", "live in peace: 平和に暮らす。"]}, "S7-14": {"grammar_notes": ["All S want to do is to do: S7-13と同じ構文だが、isの後のtoが省略されていないバージョン。", "isの直後の原形不定詞とto不定詞はどちらも文法的に正しく、口語ではtoを省略する傾向がある。", "この2文（S7-13とS7-14）はtoの有無だけが異なる同義文として対比的に学ぶ。"], "vocabulary_notes": ["All S want to do is to do: S7-13のto省略形との書き換え関係を確認。", "live in peace: 平和に暮らす。"]}, "S7-15": {"grammar_notes": ["否定語の倒置：Never + 助動詞（have）+ S + 過去分詞。否定の副詞Neverが文頭に出ると倒置が起きる。", "通常の語順I have never told you a lie.が、Neverを強調のため文頭に置くことで疑問文と同じ倒置語順になる。", "tell a lie: 「嘘をつく」という熟語表現。"], "vocabulary_notes": ["否定語の倒置: 否定の副詞(Never等)が文頭に出ると、疑問文と同じ倒置語順になる。", "tell a lie: 嘘をつく。"]}, "S7-16": {"grammar_notes": ["場所を表す副詞句の倒置：In that old mansion + V + S。場所の副詞句が文頭に出て動詞と主語が倒置する。", "通常の語順An old man lives in that old mansion.が、場所を強調するために倒置されている。", "この倒置は主に書き言葉・物語調の文体で使われ、登場人物や場所を印象的に導入する効果がある。"], "vocabulary_notes": ["場所の副詞句+倒置: 場所を強調する際に動詞と主語が入れ替わる（特に書き言葉・物語文で使用）。", "mansion: 大邸宅、屋敷。"]}, "S7-17": {"grammar_notes": ["so + 助動詞/be動詞 + S: 「Sもまたそうだ」という前文の内容への同意を表す倒置構文（肯定文への同意）。", "so am Iのamは前文のbe動詞（is interested）に合わせて選ばれる（時制・人称の一致）。", "be interested in: 「〜に興味がある」という熟語表現（L10-8で既出）。"], "vocabulary_notes": ["so + V + S: Sもまたそうだ（肯定文への同意、倒置構文）。", "be interested in: 〜に興味がある。"]}, "S7-18": {"grammar_notes": ["neither + 助動詞 + S: 「Sもまたそうではない」という前文の否定内容への同意を表す倒置構文（否定文への同意）。", "neither can Iのcanは前文の助動詞（can't play）に合わせて選ばれる（S7-17のsoと同じ一致のルール）。", "S7-17（so、肯定文への同意）とS7-18（neither、否定文への同意）が対になる構文として重要。"], "vocabulary_notes": ["neither + V + S: Sもまたそうではない（否定文への同意、倒置構文）。", "S7-17のso+V+Sとの対比（肯定⇔否定）を確認。"]}};

const LSECS=['LESSON 1','LESSON 2','LESSON 3','LESSON 4','LESSON 5',
  'LESSON 6','LESSON 7','LESSON 8','LESSON 9','LESSON 10',
  'LESSON 11','LESSON 12','LESSON 13','LESSON 14','LESSON 15'];
const GSECS=['GRAMMAR PLUS 1','GRAMMAR PLUS 2','GRAMMAR PLUS 3','GRAMMAR PLUS 4'];
const SSECS=['SUPPLEMENT 1','SUPPLEMENT 2','SUPPLEMENT 3','SUPPLEMENT 4',
  'SUPPLEMENT 5','SUPPLEMENT 6','SUPPLEMENT 7'];

/* ── STORAGE ── */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}
function getSRS(){return lsGet('eb_srs')||{};}
function saveSRS(d){lsSet('eb_srs',d);}
function getLog(){return lsGet('eb_log')||[];}
function saveLog(d){lsSet('eb_log',d.slice(-1000));}

/* ── SM-2 ── */
function sm2(id,grade){
  const srs=getSRS();
  const c=srs[id]||{n:0,ef:2.5,iv:1};
  const q=[0,3,4,5][grade];
  if(q>=3){
    c.iv=c.n===0?1:c.n===1?6:Math.round(c.iv*c.ef);
    c.n++;
  }else{c.n=0;c.iv=1;}
  c.ef=Math.max(1.3,c.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
  const d=new Date();d.setDate(d.getDate()+c.iv);
  c.due=d.toISOString().slice(0,10);
  srs[id]=c;saveSRS(srs);return c;
}
function today(){return new Date().toISOString().slice(0,10);}
function isDue(id){const c=(getSRS()[id]);return c&&c.due<=today();}
function getDue(){return SENTENCES.filter(s=>isDue(s.id));}
function logRev(id,g){
  const l=getLog();
  l.push({id,g,date:today(),ts:Date.now()});
  saveLog(l);
}

/* ── NOTES LOOKUP（組み込み解説データ） ── */
function getNotes(id){
  return NOTES[id] || null;
}

/* ── UTILS ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,' ');}
function getSents(sid){
  if(sid==='all')return SENTENCES;
  if(sid==='lessons')return SENTENCES.filter(s=>LSECS.includes(s.sec));
  if(sid==='gp')return SENTENCES.filter(s=>GSECS.includes(s.sec));
  if(sid==='sup')return SENTENCES.filter(s=>SSECS.includes(s.sec));
  if(sid==='due')return getDue();
  return SENTENCES.filter(s=>s.sec===sid);
}
function secProg(sid){
  const srs=getSRS();const cards=getSents(sid);
  const studied=cards.filter(s=>srs[s.id]).length;
  const due=cards.filter(s=>isDue(s.id)).length;
  return{total:cards.length,studied,due};
}

/* ── SESSION ── */
let SES=null;
function startSession(cards,mode){
  if(!cards||!cards.length){alert('例文がありません。');return;}
  SES={cards:shuffle([...cards]),idx:0,mode,phase:'q',
    avail:[],sel:[],wOk:null,results:[],t0:Date.now(),
    secId:SES&&SES.secId,againQ:[],inRetry:false};
  renderStudy();
}
function cur(){return SES&&SES.cards[SES.idx];}
function advance(){
  SES.idx++;
  if(SES.idx>=SES.cards.length){
    if(SES.againQ&&SES.againQ.length>0){
      SES.cards=shuffle([...SES.againQ]);
      SES.againQ=[];SES.inRetry=true;SES.idx=0;
      SES.phase='q';SES.avail=[];SES.sel=[];SES.wOk=null;
      renderStudy();return;
    }
    renderEnd();return;
  }
  SES.phase='q';SES.avail=[];SES.sel=[];SES.wOk=null;
  renderStudy();
}

function renderStudy(){
  if(!SES)return;
  const card=cur();if(!card)return;
  const pct=Math.round(SES.idx/SES.cards.length*100);
  const prog=`${SES.idx+1}/${SES.cards.length}`;
  const mIcon=SES.mode==='flashcard'?'🃏':SES.mode==='wordorder'?'🔤':'✍️';
  const retryHtml=SES.inRetry
    ?`<div class="retry-banner">🔄 もう一度チャレンジ！ — 残り${SES.cards.length-SES.idx}枚</div>`
    :'';
  document.getElementById('app').innerHTML=`
<div class="sp2">
  <div class="sh2">
    <button class="back" onclick="exitStudy()">✕</button>
    <div class="pi">
      <div class="pb"><div class="pf" style="width:${pct}%"></div></div>
      <div class="pt">${prog}</div>
    </div>
    <div class="mb2">${mIcon}</div>
  </div>
  ${retryHtml}
  <div class="sb2" id="sb2">${buildStudyBody(card)}</div>
</div>`;
  document.getElementById('mnav').style.display='none';
  // Focus textarea
  if(SES.mode==='writing'&&SES.phase==='q'){
    setTimeout(()=>{const el=document.getElementById('wri');if(el)el.focus();},100);
  }
}

function buildStudyBody(card){
  if(SES.mode==='flashcard')return buildFC(card);
  if(SES.mode==='wordorder')return buildWO(card);
  return buildWR(card);
}

/* ─── FLASHCARD ─── */
function buildFC(card){
  const lbl=`${esc(card.sec)}${card.num?' '+esc(card.num):''}`;
  if(SES.phase==='q')return `

</div>`;
  const nd=getNotes(card.id);
  const gHtml=nd&&nd.grammar_notes&&nd.grammar_notes.length
    ?`<div class="nblk">
        <div class="nt">📝 文法ポイント</div>
        <ul class="nb2">${nd.grammar_notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
      </div>`:'';
  const vHtml=nd&&nd.vocabulary_notes&&nd.vocabulary_notes.length
    ?`<div class="nblk">
        <div class="nt">💡 重要語句</div>
        <ul class="nb2">${nd.vocabulary_notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
      </div>`:'';
  return `
<div class="fcc fca">
  <div class="cl">${lbl}</div>
  <div class="en">${esc(card.en)}</div>
  <div class="dv"></div>
  <div class="ja">${esc(card.ja)}</div>

</div>`;
}
function fcReveal(){SES.phase='a';renderStudy();}
/* ─── WORD ORDER ─── */
function buildWO(card){
  const lbl=`${esc(card.sec)}${card.num?' '+esc(card.num):''}`;
  if(SES.phase==='q'){
    if(!SES.avail.length && !SES.sel.length){
      SES.avail=shuffle(card.en.trim().split(/\s+/));
      SES.sel=[];
    }
    const selHtml=SES.sel.map((w,i)=>`<button class="ch sl" onclick="woRm(${i})">${esc(w)}</button>`).join('');
    const avHtml=SES.avail.map((w,i)=>`<button class="ch av" onclick="woAdd(${i})">${esc(w)}</button>`).join('');
    return `
<div class="woc">
  <div class="cl">${lbl}<span class="mt">語順整序</span></div>
  <div class="jab">${esc(card.ja)}</div>
  <div class="albl">▶ あなたの答え（タップして並べる）：</div>
  <div class="aa">${selHtml||'<span class="ap">ここに並べてください…</span>'}</div>
  <div class="albl">単語バンク：</div>
  <div class="wb">${avHtml}</div>
  <div class="woa">
    <button class="bs" onclick="woReset()">↺ リセット</button>
    <button class="bp" onclick="woCheck()" ${SES.sel.length===0?'disabled':''}>答え合わせ ✓</button>
  </div>
</div>`;
  }
  // Answer phase
  const ok=SES.wOk;
  const nd5=getNotes(card.id);
  const eg5=(!ok&&nd5&&nd5.grammar_notes&&nd5.grammar_notes.length)
    ?`<div class="eg">
        <div class="egl">📝 文法ヒント</div>
        <ul class="nb2">${nd5.grammar_notes.slice(0,2).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
      </div>`:'';
  return `
<div class="woc">
  <div class="cl">${lbl}<span class="mt">語順整序</span></div>
  <div class="jab">${esc(card.ja)}</div>
  <div class="${ok?'rko':'rng'}">${ok?'✓ 正解！':'✗ 不正解'}</div>
  ${!ok?`
  <div class="ca">
    <div class="cal">正解：</div>
    <div class="cat">${esc(card.en)}</div>
  </div>
  ${eg5}`:''}
  <div class="dv"></div>
  <div class="g-lbl">どれくらい覚えていましたか？</div>
  <div class="gbts">
    <button class="gbt g0" onclick="woGrade(0)">もう一度<br><small>Again</small></button>
    <button class="gbt g1" onclick="woGrade(1)">難しい<br><small>Hard</small></button>
    <button class="gbt g2" onclick="woGrade(2)">良い<br><small>Good</small></button>
    <button class="gbt g3" onclick="woGrade(3)">簡単<br><small>Easy</small></button>
  </div>
</div>`;
}
function woAdd(i){SES.sel.push(SES.avail.splice(i,1)[0]);renderStudy();}
function woRm(i){SES.avail.push(SES.sel.splice(i,1)[0]);renderStudy();}
function woReset(){SES.avail=shuffle([...SES.sel,...SES.avail]);SES.sel=[];renderStudy();}
function woCheck(){
  const c=cur();const ans=SES.sel.join(' ');
  const ok=norm(ans)===norm(c.en);
  SES.wOk=ok;SES.phase='a';
  renderStudy();
}
function woGrade(g){
  const c=cur();
  const eg=(!SES.wOk&&g>=2)?1:g;
  sm2(c.id,eg);logRev(c.id,eg);
  SES.results.push({id:c.id,grade:eg,correct:SES.wOk});
  if(eg===0||(SES.inRetry&&!SES.wOk))SES.againQ.push(c);
  advance();
}

function buildWR(card){
  const lbl=`${esc(card.sec)}${card.num?' '+esc(card.num):''}`;
  if(SES.phase==='q')return `
<div class="wrc">

  <button class="bp fw mt12" onclick="wrCheck()">答え合わせ ✓</button>
</div>`;
  const ok=SES.wOk;
  const nd6=getNotes(card.id);

      </div>`:'';
  return `
<div class="wrc">
  <div class="cl">${lbl}<span class="mt">記述式</span></div>
  <div class="jab">${esc(card.ja)}</div>
  <div class="${ok?'rko':'rng'}">${ok?'✓ 正解！':'✗ 不正解'}</div>
  ${!ok?`
  <div class="ca">
    <div class="cal">あなたの答え：</div>
    <div class="cat" style="border-left-color:var(--ng);color:var(--ng);background:var(--ng2)">${esc(SES.wrInput||'')}</div>
  </div>
  <div class="ca">
    <div class="cal">正解：</div>
    <div class="cat">${esc(card.en)}</div>
  </div>
  ${eg6}`:''}
  <div class="dv"></div>
  <div class="g-lbl">どれくらい覚えていましたか？</div>
  <div class="gbts">
    <button class="gbt g0" onclick="wrGrade(0)">もう一度<br><small>Again</small></button>
    <button class="gbt g1" onclick="wrGrade(1)">難しい<br><small>Hard</small></button>
    <button class="gbt g2" onclick="wrGrade(2)">良い<br><small>Good</small></button>
    <button class="gbt g3" onclick="wrGrade(3)">簡単<br><small>Easy</small></button>
  </div>
</div>`;
}
function wrCheck(){
  const c=cur();
  const inp=document.getElementById('wri');
  const raw=inp?inp.value:'';
  SES.wrInput=raw;
  const ok=norm(raw)===norm(c.en);
  SES.wOk=ok;SES.phase='a';
  renderStudy();
}
function wrGrade(g){
  const c=cur();
  const eg=(!SES.wOk&&g>=2)?1:g;
  sm2(c.id,eg);logRev(c.id,eg);
  SES.results.push({id:c.id,grade:eg,correct:SES.wOk});
  if(eg===0||(SES.inRetry&&!SES.wOk))SES.againQ.push(c);
  advance();
}
