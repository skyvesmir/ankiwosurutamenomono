<script>
const W=[0.2172,1.1771,3.2602,16.1507,7.0114,0.57,2.0966,0.0069,1.5261,0.112,1.0178,1.849,0.1133,0.3127,2.2934,0.2191,3.0004,0.7536,0.3332,0.1437,0.2];
let RETENTION=0.9;
const decay=()=>-W[20];
const factor=()=>Math.pow(0.9,1/decay())-1;
function retr(t,S){return Math.pow(1+factor()*t/S,decay());}
function ivlFromS(S){let r=RETENTION;let v=(S/factor())*(Math.pow(r,1/decay())-1);return Math.max(1,Math.round(v));}
const clampD=d=>Math.min(Math.max(d,1),10);
const clampS=s=>Math.min(Math.max(s,0.01),36500);
function initS(g){return clampS(W[g-1]);}
function initD(g){return clampD(W[4]-Math.exp(W[5]*(g-1))+1);}
function nextD(D,g){let d=D-W[6]*(g-3);d=W[7]*initD(4)+(1-W[7])*d;return clampD(d);}
function sSucc(D,S,r,g){const hard=g===2?W[15]:1,easy=g===4?W[16]:1;const inc=Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-r))-1)*hard*easy;return clampS(S*(1+inc));}
function sFail(D,S,r){const sf=W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-r));return clampS(Math.min(sf,S));}
function sShort(S,g){return clampS(S*Math.exp(W[17]*(g-3+W[18])));}
const DAY=86400000;
function schedule(card,g,now){
  now=now||Date.now();let c=Object.assign({},card);
  if(!c.state||c.state==='new'){c.D=initD(g);c.S=(g===1)?sShort(initS(1),g):initS(g);}
  else{const t=Math.max(0,(now-c.last)/DAY);const r=retr(t,c.S);c.D=nextD(c.D,g);
    if(g===1){c.S=sFail(c.D,c.S,r);c.lapses=(c.lapses||0)+1;}else{c.S=sSucc(c.D,c.S,r,g);}}
  c.reps=(c.reps||0)+1;c.state='review';c.last=now;
  const ivl=(g===1)?1:ivlFromS(c.S);c.ivl=ivl;c.due=now+ivl*DAY;return c;
}
function previewIvl(card,g,now){const c=schedule(card,g,now);return c.ivl;}

ダウン症等）の可能性を調べる検査。日本では2013年に新型出生前診断（NIPT）が導入され、2022年に対象が拡大された。","cat":"概念","src":"清水書院「公共用語集」","contro":"論争性：「命の選別」・障害者差別への懸念と、妊婦の自己決定権が対立","alias":"NIPT","rank":"B","rel":"","shushi":false},{"no":581,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"着床前診断","yomi":"ちゃくしょうぜんしんだん","def":"体外受精した受精卵の段階で遺伝子・染色体を調べ、異常のないものを選んで子宫に戻す診断。重い遺伝病の回避に用いられる一方、命の選別の懸念がある。","cat":"概念","src":"清水書院「公共用語集」","contro":"論争性：遺伝性疾患の回避と生命の選別・優生思想への接近が対立","alias":"","rank":"B","rel":"","shushi":false},{"no":582,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"デザイナーベビー","yomi":"でざいなーべびー","def":"遺伝子操作や受精卵選別により、容姿・能力など親の望む特徴を持たせて生まれる子ども。ゲノム編集技術の進展で現実味を帯び、強い倫理的批判がある。","cat":"概念","src":"清水書院「公共用語集」","contro":"論争性：治療目的を超えた能力増強（エンハンスメント）の是非","alias":"","rank":"B","rel":"","shushi":false},{"no":583,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"再生医療","yomi":"さいせいいりょう","def":"iPS細胞やES細胞等を用いて、失われた組織・臓器の機能を回復させる医療。難病治療への期待と、生命操作・安全性・費用の課題がある。","cat":"概念","src":"清水書院「公共用語集」","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":584,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"QOL（生命の質）","yomi":"せいめいのしつ","def":"Quality of Life。単なる延命よりも、患者本人の生活・人生の質を重視する考え方。終末期医療でSOL（生命の尊厳）と対比される。","cat":"概念","src":"清水書院「公共用語集」","contro":"論争性：QOL重視とSOL（生命の尊厳）重視が終末期医療で対立","alias":"生命の質","rank":"B","rel":"","shushi":false},{"no":585,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"リビング・ウィル（事前指示書）","yomi":"りびんぐうぃる","def":"自分が判断能力を失った場合に備え、延命治療の可否など終末期医療の希望を事前に書き記した文書。尊厳死・自己決定権と関わる。","cat":"概念","src":"清水書院「公共用語集」","contro":"","alias":"事前指示書","rank":"B","rel":"","shushi":false},{"no":586,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"ドナーカード（臓器提供意思表示カード）","yomi":"どなーかーど","def":"脳死後・心停止後の臓器提供に関する本人の意思を示すカード。2010年の改正臓器移植法で、本人の意思が不明でも家族の承諾で提供可能となった。","cat":"制度プロセス","src":"清水書院「公共用語集」","contro":"","alias":"臓器提供意思表示カード","rank":"B","rel":"","shushi":false},{"no":587,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"パターナリズム","yomi":"ぱたーなりずむ","def":"本人のためだとして、専門家や国家が本人の意思に介入・干渉すること（父権主義）。医療の場ではインフォームド・コンセントと対立する概念。","cat":"概念","src":"清水書院「公共用語集」","contro":"論争性：本人保護と自己決定権の尊重が対立","alias":"","rank":"B","rel":"","shushi":false},{"no":588,"maj":"I","mid":"生命倫理","sub":"生命倫理の論点追加","term":"優生思想（旧優生保護法）","yomi":"ゆうせいしそう","def":"遺伝的に「優秀」な者を増やし「劣った」者を排除しようとする思想。日本では旧優生保護法（1948〜1996年）の下で障害者等への強制不妊手術が行われ、重大な人権侵害として問題化した。","cat":"思想学説","src":"清水書院「公共用語集」","contro":"論争性：生命倫理・障害者の人権に関わる歴史的問題","alias":"旧優生保護法","rank":"B","rel":"","shushi":false},{"no":589,"maj":"II","mid":"民主政治の原理","sub":"民主主義の類型","term":"多数決の暴政（トクヴィル）","yomi":"たすうけつのぼうせい","def":"フランスの政治思想家トクヴィル（1805〜1859）が指摘した民主主義の欠陥。多数派が少数派を抑圧する危険性。","cat":"思想学説","src":"清水書院「政治・経済用語集」","contro":"","alias":"トクヴィル","rank":"B","rel":"","shushi":false},{"no":590,"maj":"II","mid":"民主政治の原理","sub":"民主主義の類型","term":"独立宣言・南北戦争とリンカーン","yomi":"どくりつせんげんなんぼくせんそう","def":"「人民の人民による人民のための政治」（リンカーン、ゲティスバーグ演説）。民主主義の理念の象徴的表現。","cat":"固有名詞（人物）","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"B","rel":"アメリカ独立宣言","shushi":false},{"no":591,"maj":"II","mid":"民主政治の原理","sub":"民主主義の類型","term":"デリバラティブ（討議的）民主主義vs集約的民主主義","yomi":"とうぎてきみんしゅしゅぎ","def":"利害の集約を重視する代議制民主主義に対し、公共的討議・熟議を重視する民主主義の形態。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"討議的","rank":"C","rel":"民主主義の後退（バックスライディング）、政治的安定と民主主義、メディア・民主主義・フィルターバブルの問題","shushi":false},{"no":592,"maj":"II","mid":"民主政治の原理","sub":"民主主義の類型","term":"電子民主主義（eデモクラシー）","yomi":"でんしみんしゅしゅぎ","def":"ICTを活用した市民参加・投票・政策形成の仕組み。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"eデモクラシー","rank":"B","rel":"","shushi":false},{"no":593,"maj":"II","mid":"民主政治の原理","sub":"民主主義の類型","term":"参加民主主義","yomi":"さんかみんしゅしゅぎ","def":"市民が政策形成過程に直接参加することを重視する民主主義の形態。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":594,"maj":"II","mid":"民主政治の原理","sub":"政治哲学の概念","term":"王権神授説","yomi":"おうけんしんじゅせつ","def":"君主の権力は神から与えられたものとする考え方。社会契約説がこれへの反論として登場した。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":595,"maj":"II","mid":"民主政治の原理","sub":"政治哲学の概念","ter ","term":"情報公開法","yomi":"じょうほうこうかいほう","def":"1999年制定。国民が行政機関の持つ文書の開示を請求できる制度を定めた法律。","cat":"法律","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"A","rel":"","shushi":false},{"no":952,"maj":"II","mid":"基本的人権の保障","sub":"新しい人権","term":"自己決定権","yomi":"じこけっていけん","def":"自己の生き方・ライフスタイルを自分で決定する権利。第13条を根拠とする。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"B","rel":"輸血拒否と自己決定権（エホバの証人）","shushi":false},{"no":953,"maj":"II","mid":"基本的人権の保障","sub":"新しい人権","term":"アクセス権（反論権）","yomi":"あくせすけん","def":"マスメディアの報道に対し、個人・市民が反論・応答する機会を求める権利。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"反論権","rank":"B","rel":"","shushi":false},{"no":954,"maj":"II","mid":"基本的人権の保障","sub":"新しい人権","term":"日照権","yomi":"にっしょうけん","def":"建物の日当たりを確保する権利。環境権の一形態。","cat":"概念","src":"清水書院「政治・経済用語集」","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":955,"maj":"II","mid":"基本的人権の保障","sub":"新しい人権","term":"忘れられる権利","yomi":"わすれられるけんり","def":"インターネット上の古い個人情報の削除を求める権利。EU一般データ保護規則（GDPR）で明文化。","cat":"概念","src":"EU・欧州司法裁判所","contro":"論争性：忘れられる権利と、表現の自由・知る権利との衝突が論点","alias":"","rank":"B","rel":"知る権利、裁判を受ける権利、勤労の権利","shushi":false},{"no":956,"maj":"II","mid":"基本的人権の保障","sub":"人権の国際化","term":"国際人権規約","yomi":"こくさいじんけんきやく","def":"1966年国連採択・1976年発効。世界人権宣言を条約化。自由権規約（B規約）・社会権規約（A規約）がある。","cat":"固有名詞（制度・機関）","src":"国連","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":957,"maj":"II","mid":"基本的人権の保障","sub":"人権の国際化","term":"難民条約","yomi":"なんみんじょうやく","def":"1951年採択。難民の定義・待遇・保護を定めた国際条約。","cat":"固有名詞（制度・機関）","src":"国連難民高等弁務官事務所（UNHCR）","contro":"","alias":"","rank":"B","rel":"","shushi":false},{"no":958,"maj":"II","mid":"基本的人権の保障","sub":"人権の国際化","term":"女性差別撤廃条約","yomi":"じょせいさべつてっぱいじょうやく","def":"1979年採択。女性に対するあらゆる差別の撤廃を求める国際条約。日本は1985年批准。","cat":"固有名詞（制度・機関）","src":"国連","contro":"論争性：実質的平等の実現手法や、国内法への反映のあり方をめぐり議論","alias":"","rank":"B","rel":"","shushi":false},{"no":959,"maj":"II","mid":"基本的人権の保障","sub":"人権の国際化","term":"子どもの権利条約","yomi":"こどものけんりじょうやく","def":"1989年採択。子どもの生存・発達・保 function curData(){return DATA.filter(d=>d.maj===ST.maj);}
function curMids(){return [...new Set(curData().map(d=>d.mid))];}
function cardOf(no){return ST.cards[no]||{state:'new'};}
function dueList(now){now=now||Date.now();return curData().filter(d=>{const c=ST.cards[d.no];return c&&c.state==='review'&&c.due<=now;});}
function newList(){return curData().filter(d=>!ST.cards[d.no]||ST.cards[d.no].state==='new');}
function midStat(m){const arr=curData().filter(d=>d.mid===m);const learned=arr.filter(d=>ST.cards[d.no]&&ST.cards[d.no].state==='review').length;return{total:arr.length,learned};}

let SESS=null;
function startSession(kind,mid){
  let pool;
  if(kind==='review')pool=dueList();
  else if(kind==='mid')pool=curData().filter(d=>d.mid===mid);
  else pool=dueList().concat(newList().slice(0,20));
  pool=shuffle(pool.slice()).slice(0,30);
  SESS={pool,idx:0,kind,revealed:false,answered:false,selected:null,correct:null,choices:null,typed:'',done:0};
  route('quiz');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rate(g){
  const d=SESS.pool[SESS.idx];const now=Date.now();
  const c=schedule(cardOf(d.no),g,now);ST.cards[d.no]=c;
  ST.log.push({no:d.no,g,t:now});save();
  SESS.done++;SESS.idx++;SESS.revealed=false;SESS.answered=false;SESS.selected=null;SESS.correct=null;SESS.choices=null;SESS.typed='';
  if(SESS.idx>=SESS.pool.length)renderDone();else renderQuiz();
}

let TAB='home';
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let GQ='';function renderGlossary(){view.innerHTML=`<div class="sec">用語一覧</div>${majSelHtml()}<div class="glsearch"><input id="glq" class="ti" type="text" autocomplete="off" autocapitalize="off" placeholder="用語・読み・略語で検索（全大項目）…" oninput="glossaryFilter()" value="${esc(GQ)}"></div><div id="glresults"></div>`;glossaryFilter();setTimeout(function(){var el=document.getElementById('glq');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}},30);}function glRow(d){return `<div class="glrow"><div class="glt">${esc(d.term)}${d.yomi?`<span class="gly">${esc(d.yomi)}</span>`:''}${d.contro?'<span class="glb">⚖両論</span>':''}${d.shushi?'<span class="glb sh">🏹趣旨</span>':''}</div><div class="gld">${esc(d.def)}</div><div class="gls">${esc(d.mid)}${d.sub?' ・ '+esc(d.sub):''} ・ 重要度${esc(d.rank)}</div></div>`;}function glossaryFilter(){var el=document.getElementById('glq');if(el)GQ=el.value;var box=document.getElementById('glresults');if(!box)return;var q=GQ.trim().toLowerCase();var html='';if(q){var res=DATA.filter(function(d){return (d.term&&d.term.toLowerCase().indexOf(q)>=0)||(d.yomi&&d.yomi.toLowerCase().indexOf(q)>=0)||(d.alias&&d.alias.toLowerCase().indexOf(q)>=0);});html=`<div class="glcount">検索結果 ${res.length}件</div>`+(res.length?`<div class="gllist">`+res.map(glRow).join('')+`</div>`:`<div class="empty" style="padding:30px 10px">該当する用語がありません</div>`);}else{var d0=curData();var mids=[];d0.forEach(function(d){if(mids.indexOf(d.mid)<0)mids.push(d.mid);});html=`<div class="glcount">${MAJ[ST.maj].label} ${MAJ[ST.maj].name}　全${d0.length}語</div>`;mids.forEach(function(m){var items=d0.filter(function(d){return d.mid===m;});html+=`<details class="glgrp" open><summary><span class="gm">${MIC[m]||'📖'} ${esc(m)}</span><b>${items.length}</b></summary>${items.map(glRow).join('')}</details>`;});}box.innerHTML=html;}function route(t){TAB=t;if(t!=='quiz')SESS=null;render();}
function render(){renderTabs();if(TAB==='home')renderHome();else if(TAB==='quiz')renderQuiz();else if(TAB==='stats')renderStats();else if(TAB==='settings')renderSettings();else if(TAB==='learn')renderLearn();else if(TAB==='glossary')renderGlossary();}
function svgIcon(n){const p={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',learn:'<path d="M12 6.5C10.5 5.2 8 4.8 5 5.2V19c3-.4 5.5 0 7 1.3 1.5-1.3 4-1.7 7-1.3V5.2c-3-.4-5.5 0-7 1.3z"/><path d="M12 6.5V20.3"/>',quiz:'<path d="M13 3 4 14h7l-1 7 9-11h-7z"/>',glossary:'<path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/>',stats:'<path d="M6 20v-6"/><path d="M12 20V8"/><path d="M18 20v-9"/><path d="M3 20h18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'};return '<svg viewBox="0 0 24 24">'+(p[n]||'')+'</svg>';}
function renderTabs(){const t=[['home','🏠','ホーム'],['learn','📖','学習'],['quiz','⚡','一問一答'],['glossary','📋','一覧'],['stats','📊','統計'],['settings','⚙️','設定']];
  tabbar.innerHTML=t.map(x=>`<div class="tab ${TAB===x[0]?'on':''}" onclick="route('${x[0]}')">${TAB===x[0]?'<span class=\'p\'></span>':''}<span class="i">${svgIcon(x[0])}</span>${x[2]}</div>`).join('');}
function pct(a,b){return b?Math.round(a/b*100):0;}
function majSelHtml(){return `<div class="majsel">${Object.keys(MAJ).map(k=>`<div class="lg mtab ${ST.maj===k?'on':''}" onclick="setMaj('${k}')">${MAJ[k].label} ${MAJ[k].name}</div>`).join('')}</div>`;}
function renderHome(){
  const cd=curData();const mj=MAJ[ST.maj];
  const due=dueList().length,newc=newList().length,learned=cd.length-newc;
  view.innerHTML=`
  <div class="lg header"><div class="appicon">${mj.icon}</div><div class="htext"><h1>${mj.name}</h1><p>大項目${mj.label} ・ ${cd.length}語</p></div><div class="lg badge plate"><b>${learned}</b><span>学習済み</span></div></div>
  ${majSelHtml()}
  <div class="sec">今日の復習（FSRS-6）</div>
  <div class="lg review"><div class="ring" style="background:conic-gradient(var(--good) 0 ${pct(learned,cd.length)}%,rgba(255,255,255,.14) 0)"><i>${pct(learned,cd.length)}%</i></div><div class="t"><b>復習待ち ${due}枚</b><p>新規 ${newc}語 ・ 学習済 ${learned}語</p></div><button class="lg btn go" onclick="startSession('review')" ${due?'':'disabled style=opacity:.4'}>復習</button></div>
  <div class="lg review"><div class="ring" style="background:conic-gradient(var(--accent) 0 100%,#0000 0)"><i>⚡</i></div><div class="t"><b>おまかせ学習</b><p>復習＋新規を自動で出題</p></div><button class="lg btn go" onclick="startSession('auto')">開始</button></div>
  <div class="sec">中項目で学ぶ</div>
  ${curMids().map(m=>{const s=midStat(m);return `<div class="lg midcard" onclick="startSession('mid','${esc(m)}')"><div class="ic">${MIC[m]||'📖'}</div><div class="t"><b>${esc(m)}</b><div class="bar"><i style="width:${pct(s.learned,s.total)}%"></i></div></div><div class="cnt">${s.learned}/${s.total}</div></div>`}).join('')}
  `;
}
function renderLearn(){view.innerHTML=`<div class="sec">学習モード</div>${majSelHtml()}<div class="modebar" style="margin-top:12px"><div class="lg m ${ST.mode==='choice'?'on':''}" onclick="setMode('choice')">選択式</div><div class="lg m ${ST.mode==='input'?'on':''}" onclick="setMode('input')">記入式</div><div class="lg m ${ST.mode==='flash'?'on':''}" onclick="setMode('flash')">カード</div></div><p style="font-size:12px;color:var(--dim);margin:10px 6px;line-height:1.8">※ 選択式＝4択、記入式＝用語を入力して判定、カードは自己採点。いずれも解答後のGood等でFSRSが次回出題日を計算します。</p>`+curMids().map(m=>{const s=midStat(m);return `<div class="lg midcard" onclick="startSession('mid','${esc(m)}')"><div class="ic">${MIC[m]||'📖'}</div><div class="t"><b>${esc(m)}</b><div class="bar"><i style="width:${pct(s.learned,s.total)}%"></i></div></div><div class="cnt">${s.learned}/${s.total}</div></div>`}).join('');}
function setMode(m){ST.mode=m;save();render();}
function setMaj(k){ST.maj=k;save();render();}
function renderQuiz(){
  if(!SESS){view.innerHTML=`<div class="lg" style="margin-top:16px;padding:20px"><div class="empty">一問一答を開始します。<br>復習待ち ${dueList().length}枚</div><button class="lg btn go" style="width:100%;padding:14px" onclick="startSession('auto')">開始する</button></div>`;return;}
  if(SESS.idx>=SESS.pool.length){renderDone();return;}
  const d=SESS.pool[SESS.idx];const total=SESS.pool.length;const flash=ST.mode==='flash';
  const q=flash?esc(d.term):esc(d.def);
  const qlabel=flash?'この用語の意味は？':'この説明にあてはまる用語は？';
  view.innerHTML=`
  <div class="qtop"><span>${MAJ[d.maj].label} ${esc(d.mid)}</span><span>${SESS.idx+1} / ${total}</span></div>
  <div class="pl"><i style="width:${(SESS.idx)/total*100}%"></i></div>
  <div class="lg qcard">
    <div class="qcat">${esc(d.sub||d.mid)}${d.contro?'<span class=\'warnbadge\'>要両論併記</span>':''}${d.shushi?'<span class=\'shbadge\'>趣旨・手続</span>':''}</div>
    <div class="lg qq plate"><h2>${q}</h2></div>
    <div class="hint">${qlabel}</div>
    <div id="ansbox"></div>
    <div id="actionbox"></div>
  </div>`;
  const ansbox=document.getElementById('ansbox');const act=document.getElementById('actionbox');
  if(flash){if(!SESS.revealed){act.innerHTML=`<div class="lg btn reveal" onclick="revealAns()">解答を表示</div>`;}else{showAns(d,ansbox,act,true);}return;}if(ST.mode==='choice'){if(!SESS.answered){if(!SESS.choices)SESS.choices=makeChoices(d);act.innerHTML=`<div class="choices">`+SESS.choices.map((c,i)=>`<div class="lg choicebtn" onclick="choose(${i})">${esc(c.term)}</div>`).join('')+`</div>`;}else{showAns(d,ansbox,act,false);}return;}if(!SESS.answered){act.innerHTML=`<div class="inputrow"><input id="ansinput" class="ti" type="text" autocomplete="off" autocapitalize="off" placeholder="用語を入力…" onkeydown="if(event.key==='Enter')submitInput()"><div class="go2" onclick="submitInput()">判定</div></div><div class="giveup" onclick="submitInput(true)">わからない</div>`;setTimeout(function(){var el=document.getElementById('ansinput');if(el)el.focus();},60);}else{showAns(d,ansbox,act,false);}
}
function revealAns(){SESS.revealed=true;renderQuiz();}function makeChoices(d){var same=curData().filter(function(x){return x.mid===d.mid&&x.no!==d.no});if(same.length<3)same=same.concat(curData().filter(function(x){return x.no!==d.no&&x.mid!==d.mid}));same=shuffle(same.slice());var seen={};seen[d.term]=1;var dis=[];for(var i=0;i<same.length&&dis.length<3;i++){if(seen[same[i].term])continue;seen[same[i].term]=1;dis.push(same[i]);}return shuffle([d].concat(dis));}function choose(i){if(SESS.answered)return;SESS.selected=i;SESS.answered=true;var d=SESS.pool[SESS.idx];SESS.correct=(SESS.choices[i].no===d.no)||(SESS.choices[i].term===d.term);renderQuiz();}function normalize(s){s=(s||'').trim().toLowerCase();s=s.split(' ').join('').split('　').join('');s=s.replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});return s.replace(/[・･（）()「」『』、,.。ー―〜~-]/g,'');}function submitInput(giveup){if(SESS.answered)return;var el=document.getElementById('ansinput');var val=giveup?'':(el?el.value:'');SESS.typed=val;var d=SESS.pool[SESS.idx];var cand=[d.term].concat((d.alias||'').split(new RegExp('[/／、,]')).map(function(s){return s.trim()}).filter(Boolean));var nv=normalize(val);SESS.correct=!giveup&&nv!==''&&cand.some(function(c){return normalize(c)===nv});SESS.answered=true;renderQuiz();}
function showAns(d,ansbox,act,flash){let banner='';if(!flash){let ya='';if(ST.mode==='choice'&&SESS.selected!=null)ya=esc(SESS.choices[SESS.selected].term);else if(ST.mode==='input')ya=(SESS.typed&&SESS.typed.trim())?esc(SESS.typed.trim()):'（無回答）';banner=`<div class="rbanner ${SESS.correct?'okb':'ngb'}">${SESS.correct?'✅ 正解':'❌ 不正解'}<span>あなたの解答：${ya||'—'}</span></div>`;}
  const controHtml=d.contro?`<div class="contro"><b>⚖ 両論併記（中立）</b><br>${esc(d.contro)}<br><span style="color:var(--mute)">※ 両論の具体内容はステップ８以降で精査・追記予定</span></div>`:'';
  const shushiHtml=d.shushi?SHUSHI_HTML:'';
  ansbox.innerHTML=banner+`<div class="lg ans plate-s"><span class="l">解答</span><div class="term">${esc(d.term)}</div>${flash?`<div class="def">${esc(d.def)}</div>`:`<div class="yomi">${esc(d.yomi)}</div>`}<div class="s">出典：${esc(d.src)}　・重要度${esc(d.rank)}</div>${shushiHtml}${controHtml}</div>`;
  const c=cardOf(d.no);const now=Date.now();
  act.innerHTML=`<div class="rate">
    <div class="lg rbtn again" onclick="rate(1)">Again<span>${fmtIvl(previewIvl(c,1,now))}</span></div>
    <div class="lg rbtn hard" onclick="rate(2)">Hard<span>${fmtIvl(previewIvl(c,2,now))}</span></div>
    <div class="lg rbtn good" onclick="rate(3)">Good<span>${fmtIvl(previewIvl(c,3,now))}</span></div>
    <div class="lg rbtn easy" onclick="rate(4)">Easy<span>${fmtIvl(previewIvl(c,4,now))}</span></div></div>`;
}
function renderDone(){view.innerHTML=`<div class="lg" style="margin-top:40px;padding:34px 20px;text-align:center"><div style="font-size:44px">🎉</div><h2 style="margin-top:12px;font-size:20px">セッション完了</h2><p style="margin-top:10px;color:var(--dim);font-size:13px">${SESS.done}枚を学習しました</p><button class="lg btn go" style="margin-top:20px;padding:13px 22px" onclick="route('home')">ホームへ</button></div>`;SESS=null;}
function renderStats(){
  const cd=curData();const learned=cd.filter(d=>ST.cards[d.no]&&ST.cards[d.no].state==='review').length;
  const due=dueList().length;const reviews=ST.log.length;const lapses=Object.values(ST.cards).reduce((a,c)=>a+(c.lapses||0),0);
  const avgS=(()=>{const ss=Object.values(ST.cards).filter(c=>c.state==='review').map(c=>c.S);return ss.length?(ss.reduce((a,b)=>a+b,0)/ss.length):0;})();
  view.innerHTML=`<div class="sec">統計</div>${majSelHtml()}<div class="statgrid" style="margin-top:12px">
   <div class="lg stat"><b>${learned}</b><div class="k">学習済み / ${cd.length}</div></div>
   <div class="lg stat"><b>${due}</b><div class="k">本日の復習待ち</div></div>
   <div class="lg stat"><b>${reviews}</b><div class="k">累計回答（全体）</div></div>
   <div class="lg stat"><b>${avgS.toFixed(1)}日</b><div class="k">平均安定度 S</div></div>
   <div class="lg stat"><b>${lapses}</b><div class="k">累計忘却(Again)</div></div>
   <div class="lg stat"><b>${Math.round(RETENTION*100)}%</b><div class="k">目標保持率</div></div></div>
   <div class="sec">FSRS設定</div><div class="lg" style="padding:14px 16px;font-size:12px;color:var(--dim);line-height:1.9">アルゴリズム：FSRS-6（21重み）<br>適用対象：一問一答のみ<br>減衰パラメータ：${(-decay()).toFixed(2)}</div>`;
}
function renderSettings(){
  view.innerHTML=`<div class="sec">設定</div>
  <div class="lg setrow"><span>目標保持率（desired retention）</span><span class="lg seg">${[0.85,0.9,0.95].map(v=>`<button class="${Math.abs(RETENTION-v)<0.001?'on':''}" onclick="setRet(${v})">${Math.round(v*100)}%</button>`).join('')}</span></div>
  <div class="lg setrow"><span>学習モード</span><span class="lg seg"><button class="${ST.mode==='choice'?'on':''}" onclick="setMode('choice')">選択式</button><button class="${ST.mode==='input'?'on':''}" onclick="setMode('input')">記入式</button><button class="${ST.mode==='flash'?'on':''}" onclick="setMode('flash')">カード</button></span></div>
  <div class="lg setrow"><span>学習履歴をリセット</span><button class="lg" style="padding:8px 14px;border-radius:12px;color:var(--bad);background:rgba(255,138,151,.12);border:none;font-family:inherit;cursor:pointer" onclick="resetAll()">リセット</button></div>
  <div class="lg" style="padding:14px 16px;margin-top:6px;font-size:11.5px;color:var(--mute);line-height:1.9">収録：大項目Ⅰ 公共の扉 ${DATA.filter(d=>d.maj==='I').length}語・大項目Ⅱ 政治分野 ${DATA.filter(d=>d.maj==='II').length}語・大項目Ⅲ 経済分野 ${DATA.filter(d=>d.maj==='III').length}語・大項目Ⅳ 現代社会の諸課題 ${DATA.filter(d=>d.maj==='IV').length}語。論争的テーマは両論併記バッジを表示（詳細は後続ステップで精査）。安全保障の固有名詞には趣旨・手続の補助設問。出典：検定教科書・法令・判例・公的資料に準拠。</div>`;
}
function setRet(v){RETENTION=v;ST.retention=v;save();render();}
function resetAll(){if(confirm('学習履歴をすべて消去しますか？')){ST.cards={};ST.log=[];save();route('home');}}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,10000);
route('home');
</script>
</body></html>
