<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✯ANKISHIYOUZE✯</title>
  <style>
    /* アプリの世界観に合わせた背景とデザイン */
    body {
      background-color: #FFC0CB;
      color: #fff;
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    /* 背景のぼんやりした光 */
    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
    }
    /* 魔女文字風の赤紫の光 */
    .glow-1 {
      background: radial-gradient(circle, #FF1493, transparent);
      width: 500px; height: 500px; top: -100px; left: -100px;
    }
    /* 物理風のシアンの光 */
    .glow-2 {
      background: radial-gradient(circle, #00f2ff, transparent);
      width: 600px; height: 600px; bottom: -150px; right: -100px;
    }

    /* 中央のガラスパネル */
    .glass-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #ff1a4a, #00f2ff);
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
    }

    p {
      color: rgba(90, 115, 147, 0.7);
      font-size: 1.3rem;
      margin-bottom: 30px;
    }

    /* 各アプリへのリンクボタン */
    .btn {
      display: block;
      margin: 15px 0;
      padding: 20px;
      text-decoration: none;
      color: #fff;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 魔女文字ボタンをホバーした時 */
    .btn-majo:hover {
      border-color: #F172A3;
      background: rgba(241, 114, 163, 0.2);
      color: #F172A3;
      box-shadow: 0 0 15px rgba(241, 114, 163, 0.3);
    }

    /* 物理ボタンをホバーした時 */
    .btn-butsuri:hover {
      border-color: #00f2ff;
      background: rgba(0, 242, 255, 0.2);
      color: #00f2ff;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="nebula">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>

  <div class="glass-panel">
    <h1>暗記をするためのサイト</h1>
    <p>好きなものを選んで暗記しよう</p>
    
    <!-- ここからそれぞれのHTMLファイルに飛びます -->
    <!-- ※ファイル名を変えた場合は、ここの href="..." の中身も合わせて変えてください -->
    <a href="魔女文字暗記.html" class="btn btn-majo">魔女文字暗記コース</a>
    <a href="物理暗記.html" class="btn btn-butsuri">物理マスターコース</a>
  </div>
</body>
</html>
