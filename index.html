<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" href="Images/fabicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✯ANKISHIYOUZE✯</title>
  <style>
    /* アプリの世界観に合わせた背景とデザイン */
    body {
      background-color: #FFC0CB;
      color: #fff;
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    /* 背景のぼんやりした光 */
    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
    }
    .glow-1 {
      background: radial-gradient(circle, #FF1493, transparent);
      width: 500px; height: 500px; top: -100px; left: -100px;
    }
    .glow-2 {
      background: radial-gradient(circle, #00f2ff, transparent);
      width: 600px; height: 600px; bottom: -150px; right: -100px;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #ff1493, #00f2ff);
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
    }

    p {
      color: rgba(55, 73, 121, 0.7);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      margin: 15px 0;
      padding: 20px;
      text-decoration: none;
      color: #575153;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      background: rgba(87, 81, 83, 0.05);
      border: 1px solid rgba(87, 81, 83, 0.1);
    }

    .btn-majo:hover {
      border-color: #F6ADC6;
      background: rgba(246, 173, 198, 0.2);
      color: #F6ADC6;
      box-shadow: 0 0 15px rgba(246, 173, 198, 0.3);
    }

    .btn-butsuri:hover {
      border-color: #00f2ff;
      background: rgba(0, 242, 255, 0.2);
      color: #00f2ff;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
    }

    .btn-setsubi:hover{
      border-color: #84C98B;
      background: rgba(132, 201, 139, 0.2);
      color: #84C98B;
      box-shadow: 0 0 15px rgba(132, 201, 139, 0.3);
    }

    .btn-voca:hover{
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.2);
      color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    } 
    
    .btn-itowokashi:hover{
      border-color: #5E3D50;
      background: rgba(94, 61, 80, 0.2);
      color: #5E3D50;
      box-shadow: 0 0 15px rgba(94, 61, 80, 0.3);
    } 

    .btn-koukyou:hover{
      border-color: #0D1B2A;
      background: rgba(13, 27, 42, 0.2);
      color: #0D1B2A;
      box-shadow: 0 0 15px rgba(13, 27, 42, 0.3);
    }
      
  </style>
</head>
<body>
  <div class="nebula">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>

  <div class="glass-panel">
    <h1>暗記をするためのサイト</h1>
    <p>好きなものを選んで暗記しよう</p>
    
    <a href="魔女文字暗記.html" class="btn btn-majo">魔女文字暗記コース</a>
    <a href="https://webapp-2tw.pages.dev" class="btn btn-voca">VocaForge 英語語彙コース</a>
    <a href="英語例文暗唱.html" class="btn btn-setsubi">例文暗唱コース</a>
    <a href="公共暗記.html" class="btn btn-koukyou">公共+政経暗記コース</a>
    <a href="いとをかし.html" class="btn btn-itowokashi">古典暗記コース</a>
    <a href="物理暗記.html" class="btn btn-butsuri">物理記号暗記コース</a>
  </div>
</body>
</html>
